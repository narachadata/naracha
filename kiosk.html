<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF6E8">
<title>나라차태권도 출석</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  :root{
    /* ══ 나라차 디자인 B안 "친근 성장형" — 학부모앱과 같은 토큰 ══
       변수 이름은 그대로 두고 값만 바꿨습니다. 기존 규칙이 전부 그대로 동작합니다.
       (--blue 계열은 B안 포인트 색인 주황으로 통일) */
    --brand:#FF9F43; --brandRed:#FF9F43; --blue:#FF9F43; --blueDark:#F08A24; --blueSoft:#FFF1C9;
    --red:#C8342A; --redSoft:#FFE7E4; --amber:#B45309; --amberSoft:#FFF0E2; --green:#2E9E4F; --greenSoft:#E4F6EA;
    --bg:#FFF6E8; --card:#FFFFFF; --line:#F0E6DA; --sub:#7A6E86; --ink:#3C3350;
    --belt1:#F3C614; --belt2:#1E8E3E; --belt3:#2B5FB8; --belt4:#C8342A; --belt5:#111111;
    --shadow:0 1px 3px rgba(150,110,70,.06), 0 5px 16px rgba(150,110,70,.10);
    --shadowUp:0 6px 20px rgba(150,110,70,.13);
    --photoBg:#FFF1C9; --photoInk:#C79A4A;
  }
  body{ font-family:'Nanum Gothic','나눔고딕','Malgun Gothic','맑은 고딕',-apple-system,sans-serif;
    background:linear-gradient(180deg,#FFF6E8 0%,#FDF3F6 42%,#F1F7FF 100%); background-attachment:fixed;
    color:var(--ink); height:100vh; height:100dvh; overflow:hidden; display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); font-variant-numeric:tabular-nums; }
  /* 제목 글꼴 — 나눔고딕 굵게 */
  h1,h2,h3,.topbar .brand,.facecard .info .nm,.stu .nm,.done .badge,.setup h1{
    font-family:'Nanum Gothic','나눔고딕',sans-serif; font-weight:800; letter-spacing:-.02em; }

  /* 벨트 스트라이프 */
  .belt{ height:6px; display:flex; flex-shrink:0; }
  .belt span{ flex:1; }
  .belt span:nth-child(1){ background:var(--belt1); } .belt span:nth-child(2){ background:var(--belt2); }
  .belt span:nth-child(3){ background:var(--belt3); } .belt span:nth-child(4){ background:var(--belt4); }
  .belt span:nth-child(5){ background:var(--belt5); }

  /* 헤더 (B안 — 밝은 크림 바탕 + 둥근 주황 로고) */
  .topbar{ background:rgba(255,255,255,.72); backdrop-filter:saturate(1.3) blur(8px); color:var(--ink);
    padding:12px clamp(16px,3vw,28px); display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
    border-bottom:1px solid var(--line); }
  .topbar .brand{ display:flex; align-items:center; gap:12px; font-size:clamp(18px,2.4vw,23px); }
  .topbar .brand .logo{ width:44px; height:44px; border-radius:50%; background:linear-gradient(150deg,#FFE9A8,#FFD166);
    color:#5A4209; display:flex; align-items:center; justify-content:center; font-size:23px; flex-shrink:0;
    font-family:'Nanum Gothic',sans-serif; font-weight:800; box-shadow:0 3px 10px rgba(255,180,60,.3); }
  .topbar .now .time{ font-size:clamp(19px,2.6vw,24px); font-weight:700; text-align:right; letter-spacing:-.5px; }
  .topbar .now .date{ font-size:12px; color:var(--sub); text-align:right; font-weight:500; }

  .classbar{ background:var(--blueSoft); color:#8A6416; padding:12px 24px; font-size:clamp(13px,1.8vw,15.5px); font-weight:700; flex-shrink:0; text-align:center; }
  .classbar.off{ background:var(--amberSoft); color:var(--amber); }
  /* [k2.9] 네트워크 상태 띠 — 끊겼거나 아직 못 보낸 기록이 있을 때만 보임 (누르는 것 아님) */
  .nettag{ background:#FFF0E2; color:#B45309; padding:7px 20px; font-size:clamp(12px,1.6vw,14px); font-weight:700; text-align:center; flex-shrink:0; border-bottom:1px solid #F5D9BE; }
  .nettag.off{ background:#FFE7E4; color:#C8342A; border-bottom-color:#F3C4BE; }
  .nettag[hidden]{ display:none; }

  .stage{ flex:1; display:flex; align-items:center; justify-content:center; padding:clamp(16px,3vw,28px); overflow:hidden; }
  .panel{ width:100%; max-width:460px; }

  .lead{ text-align:center; margin-bottom:24px; }
  .lead h1{ font-size:clamp(24px,3.4vw,30px); font-weight:800; letter-spacing:-.5px; }
  .lead p{ font-size:clamp(14px,1.8vw,16px); color:var(--sub); margin-top:9px; font-weight:600; }
  .lead p b{ color:var(--blue); }

  .pin{ display:flex; gap:12px; justify-content:center; margin-bottom:26px; }
  .pin .dot{ width:clamp(48px,8vw,58px); height:clamp(58px,10vw,70px); border-radius:14px; background:var(--card); border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:30px; color:var(--blue); transition:all .12s; box-shadow:var(--shadow); }
  .pin .dot.filled{ border-color:var(--blue); background:var(--blueSoft); }

  .pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(9px,1.4vw,13px); }
  .key{ height:clamp(56px,9vw,72px); border-radius:18px; border:1px solid var(--line); background:var(--card); font-family:inherit;
    font-size:clamp(24px,3.4vw,30px); font-weight:800; color:var(--ink); cursor:pointer; box-shadow:var(--shadow); transition:transform .08s, background .08s; }
  .key:active{ transform:scale(.96); background:var(--blueSoft); }
  .key.del{ color:var(--sub); font-size:24px; } .key.clr{ color:var(--sub); font-size:17px; font-weight:700; }
  .errmsg{ text-align:center; color:var(--red); font-size:15px; font-weight:800; margin-top:14px; min-height:20px; }

  .confirm-lead{ text-align:center; margin-bottom:20px; }
  .confirm-lead h1{ font-size:clamp(20px,2.8vw,24px); font-weight:800; }
  .confirm-lead p{ font-size:14px; color:var(--sub); margin-top:6px; font-weight:600; }
  .facegrid{ display:flex; flex-direction:column; gap:12px; max-height:60vh; overflow:auto; }
  .facecard{ display:flex; align-items:center; gap:16px; background:var(--card); border:1px solid var(--line);
    border-radius:22px; padding:14px 17px; cursor:pointer; box-shadow:var(--shadow); transition:transform .08s, border-color .12s, background .12s; }
  .facecard:active{ transform:scale(.98); border-color:var(--blue); background:var(--blueSoft); }
  .facecard .photo{ width:80px; height:80px; border-radius:18px; object-fit:cover; flex-shrink:0; background:var(--photoBg);
    display:flex; align-items:center; justify-content:center; font-size:34px; color:var(--photoInk); }
  .facecard .info{ flex:1; text-align:left; }
  .facecard .info .nm{ font-size:clamp(20px,2.6vw,24px); font-weight:800; }
  .facecard .info .cls{ font-size:13.5px; color:var(--sub); margin-top:3px; font-weight:600; }
  .facecard .tap{ font-size:15px; color:#fff; font-weight:700; background:var(--blue); padding:11px 18px; border-radius:14px;
    box-shadow:0 4px 12px rgba(255,159,67,.34); }

  /* 그리드 모드: 넓게 + 세로 스크롤 */
  body.gridmode .stage{ align-items:flex-start; overflow:auto; }
  body.gridmode .panel{ max-width:1100px; }
  /* ══ [사진 출석] 반 명단 그리드 ══ */
  .gstage{ flex:1; overflow:auto; padding:clamp(10px,2vw,18px); width:100%; }
  .gwrap{ max-width:1100px; margin:0 auto; }
  .glead{ text-align:center; margin-bottom:13px; }
  .glead h1{ font-size:clamp(19px,2.8vw,26px); font-weight:800; letter-spacing:-.5px; }
  .glead p{ font-size:clamp(12.5px,1.7vw,14.5px); color:var(--sub); margin-top:6px; font-weight:600; }
  .glead p b{ color:var(--blue); }
  .grid{ display:grid; gap:clamp(8px,1.3vw,13px);
    grid-template-columns:repeat(auto-fill, minmax(clamp(100px,12.5vw,148px), 1fr)); }
  .stu{ background:var(--card); border:1.5px solid var(--line); border-radius:20px; padding:10px 8px 11px;
    text-align:center; cursor:pointer; box-shadow:var(--shadow); position:relative;
    transition:transform .09s, border-color .12s, background .12s; }
  .stu:active{ transform:scale(.96); border-color:var(--blue); background:var(--blueSoft); }
  .stu img,.stu .noimg{ width:100%; aspect-ratio:1/1; border-radius:16px; object-fit:cover; background:var(--photoBg); display:block; }
  .stu .noimg{ display:flex; align-items:center; justify-content:center; font-size:clamp(26px,4vw,38px);
    font-weight:800; color:var(--photoInk); }
  .stu .nm{ font-size:clamp(15px,1.9vw,18px); font-weight:800; margin-top:8px; letter-spacing:-.3px; }
  .stu .gr{ font-size:11.5px; color:var(--sub); font-weight:700; margin-top:2px; }
  /* [k2.5] 띠 색은 이름 아래 급수 왼쪽에 작은 띠로 표시 (좌측 상단 원형 점 삭제) */
  .stu .gr{ display:flex; align-items:center; justify-content:center; gap:6px; }
  .stu .bbar{ width:clamp(18px,2.4vw,26px); height:7px; border-radius:3px; flex:0 0 auto;
    border:1px solid rgba(0,0,0,.18); box-shadow:0 1px 2px rgba(0,0,0,.12); }
  /* [k2.3] 이번달 심사 대상 배지 */
  .stu .exb{ position:absolute; top:7px; right:7px; background:linear-gradient(150deg,#FFE9A8,#FFCB4D);
    color:#5A4209; font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:999px;
    box-shadow:0 2px 6px rgba(200,150,30,.35); border:1.5px solid #fff; letter-spacing:-.2px; }
  .stu.exam{ border-color:#FFCB4D; box-shadow:0 0 0 2px rgba(255,203,77,.35), var(--shadow); }
  .exline{ display:inline-flex; align-items:center; gap:6px; background:linear-gradient(150deg,#FFE9A8,#FFCB4D);
    color:#5A4209; font-size:13px; font-weight:700; padding:7px 15px; border-radius:999px; margin-top:12px;
    box-shadow:0 4px 12px rgba(200,150,30,.3); }
  .glead .exsum{ display:inline-block; margin-top:7px; background:var(--point-soft,#FFF1C9); color:#8A6416;
    font-size:12px; font-weight:700; padding:4px 12px; border-radius:999px; }
  /* [k2.4] 상태별 표시 — 출석 전 / 본인 출석 / 사범 체크 / 결석 */
  .stu.att, .stu.bycoach, .stu.absent{ }
  .stu.att::after, .stu.bycoach::after, .stu.absent::after, .stu.rest::after, .stu.gone::after{
    position:absolute; inset:auto 0 0 0; color:#fff;
    font-size:11.5px; font-weight:700; padding:5px 0; border-radius:0 0 18px 18px; }
  /* ① 본인이 눌러 출석 — 초록 */
  .stu.att, .stu.bycoach, .stu.absent{ padding-bottom:28px; }
  .stu.att{ opacity:.45; }
  .stu.att::after{ content:"✓ 출석완료"; background:var(--green); }
  /* ② 늦게 누름 — 주황 (표시 전용, 기록에는 남지 않음) */
  .stu.att.late{ opacity:.55; }
  .stu.att.late::after{ content:"⏰ 늦게 도착"; background:var(--amber); }
  /* ③ 사범님이 대신 체크 — 남색. 아이가 또 누를 필요 없음 */
  .stu.bycoach{ opacity:.6; }
  .stu.bycoach::after{ content:"사범님 체크"; background:#5B6B8C; }
  /* ④ 결석 — 사진을 흑백으로 */
  .stu.absent{ opacity:.52; }
  .stu.absent img, .stu.absent .noimg{ filter:grayscale(1); }
  .stu.absent::after{ content:"결석"; background:var(--red); }
  /* [k2.6] 오늘 수업 탭 */
  .ctabs{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 11px; -webkit-overflow-scrolling:touch; }
  .ctabs::-webkit-scrollbar{ height:0 }
  .ctabs button{ flex:0 0 auto; background:var(--card); border:2px solid var(--line); border-radius:999px;
    padding:10px 17px; font-family:inherit; font-size:clamp(13px,1.8vw,16px); font-weight:700; color:var(--sub);
    box-shadow:var(--shadow); cursor:pointer; white-space:nowrap; }
  .ctabs button[aria-pressed="true"]{ background:var(--blue); border-color:var(--blue); color:#fff;
    box-shadow:0 5px 14px rgba(255,159,67,.34); }
  .ctabs .nowdot{ display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--green); margin-right:7px; vertical-align:1px; }
  .ctabs button[aria-pressed="true"] .nowdot{ background:#fff; }

  /* [k2.6] 구역 나누기 */
  .sec{ margin-bottom:17px; }
  .sechd{ display:flex; align-items:center; gap:9px; margin:0 3px 9px; }
  .sechd h2{ margin:0; font-size:clamp(15px,2.1vw,19px); font-weight:800; }
  .sechd .cnt{ background:var(--blueSoft); color:#8A6416; font-size:12px; font-weight:700;
    padding:2px 11px; border-radius:999px; }
  .sechd .hint{ margin-left:auto; font-size:11.5px; color:var(--sub); font-weight:700; }
  .secMini .grid{ grid-template-columns:repeat(auto-fill, minmax(clamp(82px,9vw,112px),1fr)); gap:8px; }
  .secMini .stu{ padding:7px 5px 8px; border-radius:15px; border-width:1px; opacity:1; }
  .secMini .stu img,.secMini .stu .noimg{ border-radius:11px; }
  .secMini .stu .nm{ font-size:clamp(13px,1.5vw,15px); margin-top:5px; }
  .secMini .stu .gr{ font-size:10.5px; gap:4px; }
  .secMini .stu .bbar{ width:16px; height:5px; }
  .secMini .stu .exb{ font-size:9.5px; padding:2px 6px; top:5px; right:5px; }
  .secMini .stu.att,.secMini .stu.bycoach,.secMini .stu.absent,
  .secMini .stu.rest,.secMini .stu.gone{ padding-bottom:23px; }
  .secMini .stu.att::after,.secMini .stu.bycoach::after,.secMini .stu.absent::after,
  .secMini .stu.rest::after,.secMini .stu.gone::after{ font-size:10px; padding:3px 0; border-radius:0 0 13px 13px; }

  /* [k2.7] 하원 완료 */
  .stu.gone{ opacity:.5; }
  .stu.gone img, .stu.gone .noimg{ filter:grayscale(.6); }
  .stu.gone::after{ content:"🏠 하원"; background:#7A6E86; }

  /* 미리 연락한 결석 */
  .stu.rest{ opacity:.62; }
  .stu.rest img, .stu.rest .noimg{ filter:grayscale(.85); }
  .stu.rest::after{ content:"오늘 쉬어요"; background:#5B7FB0; }

  /* 범례 */
  .lgd{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:16px;
    font-size:11.5px; color:var(--sub); font-weight:600; }
  .lgd i{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px; }
  .gempty{ text-align:center; color:var(--sub); font-size:14.5px; font-weight:600; padding:40px 12px; line-height:1.7; }
  .altbtn{ display:block; margin:22px auto 4px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; color:var(--sub); font-family:inherit; font-size:14px; font-weight:800;
    cursor:pointer; padding:12px 22px; box-shadow:var(--shadow); }
  /* 되돌리기 */
  .undoBtn{ margin-top:20px; background:var(--card); border:2px solid var(--red); color:var(--red);
    border-radius:14px; font-family:inherit; font-size:clamp(15px,2.1vw,18px); font-weight:800;
    padding:14px 28px; cursor:pointer; box-shadow:var(--shadow); }
  .undoBtn:active{ transform:scale(.96); background:var(--redSoft); }
  .cdWrap{ width:min(280px,72vw); height:7px; background:var(--line); border-radius:99px; margin-top:14px; overflow:hidden; }
  .cdBar{ height:100%; background:var(--green); border-radius:99px; width:100%; transition:width .1s linear; }
  .cdTxt{ font-size:12.5px; color:var(--sub); font-weight:700; margin-top:8px; }

  /* [k2.2] 너무 이른 하원 확인 화면 버튼 */
  .warnBtns{ display:flex; gap:12px; margin-top:22px; flex-wrap:wrap; justify-content:center; }
  .warnBtns button{ font-family:inherit; cursor:pointer; border-radius:16px; padding:15px 26px;
    font-size:clamp(15px,2.1vw,18px); font-weight:700; transition:transform .08s; }
  .wStay{ background:var(--blue); color:#fff; border:none; box-shadow:0 6px 16px rgba(255,159,67,.36); }
  .wGo{ background:var(--card); color:var(--sub); border:2px solid var(--line); box-shadow:var(--shadow); }
  .wStay:active,.wGo:active{ transform:scale(.96); }

  .done{ text-align:center; display:flex; flex-direction:column; align-items:center; }
  .done .photo-big{ width:clamp(104px,18vw,132px); height:clamp(104px,18vw,132px); border-radius:26px; object-fit:cover; margin:0 0 18px;
    border:5px solid var(--greenSoft); background:var(--photoBg); display:flex; align-items:center; justify-content:center; font-size:56px; color:var(--photoInk);
    box-shadow:0 10px 26px rgba(46,158,79,.22); animation:pop .45s cubic-bezier(.2,1.4,.5,1); }
  @keyframes pop{ 0%{transform:scale(.4);opacity:0;} 100%{transform:scale(1);opacity:1;} }
  .done .badge{ display:inline-flex; align-items:center; gap:6px; background:var(--greenSoft); color:var(--green);
    font-size:16px; font-weight:800; padding:8px 17px; border-radius:999px; margin-bottom:12px; }
  .done h1{ font-size:clamp(26px,4vw,34px); font-weight:800; letter-spacing:-.5px; }
  .done p{ font-size:15px; color:var(--sub); margin-top:10px; font-weight:600; }
  .done .cls2{ display:inline-block; margin-top:16px; background:var(--blueSoft); color:var(--blue);
    padding:10px 18px; border-radius:12px; font-size:14.5px; font-weight:800; }
  .backbtn{ display:block; margin:20px auto 0; background:var(--card); border:1px solid var(--line);
    border-radius:12px; color:var(--sub); font-family:inherit; font-size:15px; font-weight:800; cursor:pointer; padding:12px 24px; box-shadow:var(--shadow); }
  .shake{ animation:shake .4s; } @keyframes shake{ 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-8px);} 40%,80%{transform:translateX(8px);} }

  /* 설정/로딩 */
  .setup{ max-width:420px; margin:auto; padding:30px; background:var(--card); border-radius:24px; text-align:center; box-shadow:var(--shadow); }
  .setup img{ width:96px; margin-bottom:14px; }
  .setup h1{ font-size:23px; font-weight:800; margin-bottom:6px; }
  .setup p{ font-size:14px; color:var(--sub); margin-bottom:18px; line-height:1.6; }
  .setup input{ width:100%; padding:14px; border:1px solid var(--line); border-radius:12px; font-size:16px; font-family:inherit; text-align:center; margin-bottom:12px; }
  .setup input:focus{ outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blueSoft); }
  .setup button{ width:100%; padding:15px; background:var(--blue); color:#fff; border:none; border-radius:12px; font-size:17px; font-weight:800; font-family:inherit; cursor:pointer; }
  .setup button:active{ background:var(--blueDark); }
  .spin{ width:44px; height:44px; border:4px solid var(--line); border-top-color:var(--blue); border-radius:50%; margin:20px auto; animation:rot 1s linear infinite; }
  @keyframes rot{ to{transform:rotate(360deg);} }
  #fsBtn{ position:fixed; right:14px; bottom:14px; z-index:100; background:var(--brand); color:#fff; border:none; border-radius:16px;
    padding:11px 17px; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; box-shadow:0 5px 16px rgba(255,159,67,.38); }

  /* ════ 가로·세로 자동 대응 ════ */
  /* 가로 모드(충분히 넓고 높이 있는 화면): 키패드 화면을 2단(안내·PIN | 키패드)으로 배치 */
  @media (orientation:landscape) and (min-width:840px) and (min-height:520px){

<script>

                           k2.7 (2026-10-16): 같은 사진을 다시 누르면 하원 · '집에 갔어요' 구역
                           k2.6 (2026-10-16): 상단 오늘 수업 탭 · 구역 나누기(C안) · 미리 연락한 결석 구분 · 나눔고딕

                           k2.1 (2026-10-16): 디자인만 B안(친근 성장형)으로 교체 — 동작 코드는 k2.0 그대로.
                           k2.0 (2026-10-15, R4.453): 출석 확정 시 학부모 휴대폰 등원 알림 + 🏠 하원 화면(오늘 출석한 아이 → 누르면 하원 알림). 서버 v9 notify */
var DAY_CODE=["sun","mon","tue","wed","thu","fri","sat"];

  pending:null, undoTimer:null,
  outMap:{}, pendingOut:null   /* [k2.0] 하원 처리한 아이(오늘) · 하원 되돌리기 대기 */
};
/* ── [k2.0] 학부모 휴대폰 알림(서버 v9) — 실패해도 출석 처리에는 영향 없음 ── */
var NOTIFY_ON=false;   /* [k2.10] 학부모 휴대폰 푸시 보류(관리앱 R4.455) — 다시 쓰려면 true 로. 끈 동안은 보관도 하지 않는다 */
function kioskNotify(items, isRetry){ try{ if(!NOTIFY_ON||!S.key||!items||!items.length) return;
  var send=items.map(function(it){ var c={}; for(var k in it){ if(k.charAt(0)!=="_") c[k]=it[k]; } return c; });   /* 보관용 꼬리표(_q,_t)는 빼고 보냄 */
  fetch(GSHEET_URL,{method:"POST",body:JSON.stringify({key:S.key,action:"notify",items:send})})
    .then(function(r){ return r.text(); })
    .then(function(){ if(isRetry) notifyQueueDone(items); })
    .catch(function(){ if(!isRetry) notifyQueueAdd(items); });     /* [k2.9] 못 보냈으면 보관 → 연결되면 다시 보냄 */
}catch(e){ if(!isRetry){ try{ notifyQueueAdd(items); }catch(e2){} } } }
function nowKo(){ var d=new Date(); return d.getHours()+"시 "+p2(d.getMinutes())+"분"; }

/* ── [k2.9] 네트워크 끊김 대비 — 못 보낸 기록을 기기에 보관했다가 연결되면 자동으로 다시 보낸다 ──
   · 보관함: localStorage "naracha-kiosk-queue" = { v:1, items:[출석·되돌리기], notify:[등·하원 알림] }
   · 출석은 3초 되돌리기가 끝나 확정될 때 보관된다(그 전에는 아무것도 저장·전송하지 않음 — 기존 설계 그대로)
   · 서버 저장이 "OK"로 끝나야 보관함에서 지운다. 끊김·오류·이상 응답이면 그대로 남겨 두고 30초마다 다시 시도
   · 화면을 새로고침해도 보관함은 남는다 → 명단을 다시 받은 뒤 보관함을 다시 적용하고 전송
   · 7일 지난 항목은 버린다 */
var QUEUE_KEY="naracha-kiosk-queue", QUEUE_KEEP_MS=7*24*3600000, RETRY_MS=30000;
var Q={v:1, items:[], notify:[]};
try{ var _q=JSON.parse(localStorage.getItem(QUEUE_KEY)||"null"); if(_q&&_q.v===1){ Q.items=_q.items||[]; Q.notify=_q.notify||[]; } }catch(e){}
function saveQueue(){
  var lim=Date.now()-QUEUE_KEEP_MS;
  Q.items=Q.items.filter(function(it){ return (it.t||0)>lim; });
  Q.notify=Q.notify.filter(function(it){ return (it._t||0)>lim; });
  try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(Q)); }catch(e){}
  updateNetTag();
}
function queueAdd(it){ it.id=Date.now().toString(36)+Math.random().toString(36).slice(2,7); Q.items.push(it); saveQueue(); return it.id; }
function queueRemove(ids){ if(!ids||!ids.length) return; Q.items=Q.items.filter(function(it){ return ids.indexOf(it.id)<0; }); saveQueue(); }
function queueCount(){ return Q.items.length + (NOTIFY_ON?Q.notify.length:0); }
function notifyQueueAdd(items){ var t=Date.now(); items.forEach(function(it,i){ var c={}; for(var k in it){ if(k.charAt(0)!=="_") c[k]=it[k]; } c._q=t.toString(36)+"n"+i+Math.random().toString(36).slice(2,5); c._t=t; Q.notify.push(c); }); saveQueue(); }
function notifyQueueDone(items){ var ids=items.map(function(it){ return it._q; }); Q.notify=Q.notify.filter(function(it){ return ids.indexOf(it._q)<0; }); saveQueue(); }
function flushNotify(){ if(!NOTIFY_ON){ if(Q.notify.length){ Q.notify=[]; saveQueue(); } return; } if(!Q.notify.length||!S.key) return; kioskNotify(Q.notify.slice(0,20), true); }
/* 새로고침 뒤 명단을 다시 받으면 보관함의 출석을 다시 적용한다 (서버에 더 새 기록이 있으면 서버 우선) */
function replayQueue(){
  if(!Q.items.length) return 0;
  var n=0;
  Q.items.forEach(function(it){
    try{
      if(!S.weeks[it.wk]) S.weeks[it.wk]={t:0, cells:{}};
      var w=S.weeks[it.wk]; if(!w.cells) w.cells={};
      (it.slots||[]).forEach(function(slot){
        if(!w.cells[slot]) w.cells[slot]={lv:[[],[],[]], marks:{}};
        var cell=w.cells[slot]; if(!cell.marks) cell.marks={};
        var prev=cell.marks[it.name]||{};
        if((prev.t||0)>=it.t) return;                                  /* 서버 쪽이 같거나 더 새 기록 → 그대로 둠 */
        if(it.kind==="mark"){
          var was=prev.s==="출석";
          cell.marks[it.name]={ s:"출석", k:prev.k, m:prev.m||"", t:it.t, by:"self" };
          if(!was){ if(!S.accMap) S.accMap={}; S.accMap[it.name]=(S.accMap[it.name]||0)+1; }
          n++;
        } else if(it.kind==="unmark"){
          if(prev.s!=="출석" || prev.by!=="self") return;              /* 본인 출석만 되돌린다 */
          cell.marks[it.name]={ s:"", k:prev.k, m:prev.m||"", t:it.t, by:"" };
          if(S.accMap && S.accMap[it.name]) S.accMap[it.name]=Math.max(0, S.accMap[it.name]-1);
          n++;
        }
      });
      w.t=Math.max(w.t||0, it.t);
    }catch(e){}
  });
  return n;
}
/* 상단 상태 띠 — 끊겼거나 못 보낸 기록이 있을 때만 보인다 */
function updateNetTag(){
  var el=document.getElementById("netTag"); if(!el) return;
  var n=queueCount(), off=(navigator.onLine===false);
  if(!n && !off){ el.hidden=true; return; }
  el.hidden=false; el.className="nettag"+(off?" off":"");
  if(off) el.textContent="📴 인터넷이 끊겼어요 — 출석은 이 기기에 잘 보관돼요"+(n?(" · 보관 "+n+"건 · 연결되면 자동으로 보내요"):"");
  else el.textContent="⏳ 서버로 보내는 중 · 아직 못 보낸 기록 "+n+"건 — 자동으로 다시 시도해요";
}
function retryQueue(){
  if(!S.key) return;
  if(!S.loaded){ if(S.screen==="setup" && navigator.onLine!==false) loadAll(); return; }   /* 끊긴 채 켜졌다면 명단부터 다시 */

}

function todayAttended(){

}

/* [k2.6] 수련생 카드 한 장 */
function stuCard(nm, wcell, EXT){
  var ph=getPhoto(nm), gr=gradeOf(nm), bc=beltColorOf(gr);
  var mk=(wcell&&wcell.marks&&wcell.marks[nm])||null;
  var st=mk?(mk.s||""):"";

  var absent=(st==="결석" && !planned);
  var late=att && isLateTap(mk.t);
  var gone=!!(S.outMap && S.outMap[nm]);
  var ex=!!EXT[nm];
  var cls=(att?' att':'')+(late?' late':'')+(byCoach?' bycoach':'')+
          (planned?' rest':'')+(absent?' absent':'')+(gone?' gone':'')+(ex?' exam':'');

  return '<div class="stu'+cls+'" onclick="tapStu(\''+q+'\')"'+hold+'>'+

    (ph?'<img src="'+ph+'" alt="">':'<div class="noimg">'+firstChar(nm)+'</div>')+

    '<div class="gr"><i class="bbar" style="background:'+bc+'"></i>'+(gr||'&nbsp;')+'</div>'+
  '</div>';
}

function todayClasses(){
  var dc=DAY_CODE[new Date().getDay()];
  var cells=(S.schedule&&S.schedule.cells)||{};
  var out=[];
  for(var k in cells){
    var pr=k.split("-");
    if(pr[0]!==dc) continue;
    if(!cells[k] || !cells[k].l) continue;
    out.push({ key:k, h:parseInt(pr[1],10), label:String(cells[k].l) });
  }
  out.sort(function(a,b){ return a.h-b.h; });
  return out;
}

function viewSlot(){ return S.pickSlot || S.curSlot || null; }
window.pickClass = function(key){

};
function esc2(t){ return String(t==null?"":t).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* [k2.4] 늦게 도착 판정 — 수업 시작 시각보다 LATE_MIN 분 넘겨 누른 경우.
   ※ 기록에 '지각'이라는 값은 없습니다. 화면에만 보여 주는 표시입니다. */
function isLateTap(ms){
  try{
    var vs=viewSlot();
    if(!ms || !vs) return false;
    var hh=parseInt(vs.split("-")[1],10);
    if(isNaN(hh)) return false;
    var d=new Date(ms), start=new Date(d.getFullYear(),d.getMonth(),d.getDate(),hh,0,0,0);
    return (ms - start.getTime()) > LATE_MIN*60000;
  }catch(e){ return false; }
}

/* [k2.3] 이번달 심사 대상(관리앱에서 '심사확정' 체크한 수련생)
   출석 창고(att)의 examConfirm.map 을 그대로 읽는다 — 추가 통신 없음.
   심사를 마치면 관리앱이 확정을 자동 해제하므로 따로 지울 필요 없다. */
function examTargets(){
  try{
    var m=(S.attRaw && S.attRaw.examConfirm && S.attRaw.examConfirm.map) || {};
    var out={};

    return out;
  }catch(e){ return {}; }
}

/* [k2.2] 오늘 출석 도장을 찍은 시각(ms). 없으면 0 */
function attendedAtMs(name){
  var wk=curWeek(), w=S.weeks[wk]; if(!w||!w.cells) return 0;
  var dc=DAY_CODE[new Date().getDay()], best=0;
  Object.keys(w.cells).forEach(function(key){
    if(key.split("-")[0]!==dc) return;
    var mk=(w.cells[key].marks||{})[name];
    if(mk && mk.s==="출석" && mk.t && mk.t>best) best=mk.t;
  });
  return best;
}
/* 아직 이르면 '남은 분', 괜찮으면 0 */
function leaveTooSoon(name){
  var t=attendedAtMs(name); if(!t) return 0;
  var mins=(Date.now()-t)/60000;
  return (mins < LEAVE_WARN_MIN) ? Math.max(1, Math.round(LEAVE_WARN_MIN-mins)) : 0;
}

/* ── 날짜 유틸 ── */
function p2(n){ return String(n).padStart(2,"0"); }
function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
function fmtYmd(d){ return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
function mondayOf(dstr){ var d=new Date(dstr+"T00:00:00"); var w=d.getDay(); var diff=(w===0?-6:1-w); d.setDate(d.getDate()+diff); return fmtYmd(d); }
function curWeek(){ return mondayOf(todayStr()); }

/* ── 데이터 로드 (att + photo 창고) ── */

function parseRows(rows){
  if(!rows || rows.length<2) return null;

    }

}

/* ── 뒷4자리 색인 (빠른 검색) ── */
function isActive(name){ return !(S.closedMap&&S.closedMap[name]) && !(S.quitMap&&S.quitMap[name]&&!S.quitMap[name].del); }
function buildIndex(){
  S.tailIndex={};
  S.students.forEach(function(s){
    if(!isActive(s.n)) return;
    var tails={};
    (s.gd||[]).forEach(function(g){
      var digits=(g.p||"").replace(/[^0-9]/g,"");
      if(digits.length>=4){ tails[digits.slice(-4)]=1; }
    });
    // 본인 폰도 색인에 (있으면)
    var sp=(s.sp||"").replace(/[^0-9]/g,"");
    if(sp.length>=4) tails[sp.slice(-4)]=1;
    Object.keys(tails).forEach(function(t){
      if(!S.tailIndex[t]) S.tailIndex[t]=[];
      S.tailIndex[t].push(s.n);
    });
  });
}

/* ── 지금 시간 수업 슬롯 자동 감지 ── */
function updateClass(){
  var now=new Date();
  var dayCode=DAY_CODE[now.getDay()];
  var nowMin=now.getHours()*60+now.getMinutes();   // 지금을 '분'으로
  var cells=(S.schedule&&S.schedule.cells)||{};
  /* 수업 시작 40분 전 ~ 30분 후 안에 들어오는 수업 중, 시작시각이 가장 가까운 것 */
  var best=null, bestDiff=1e9, bestH=-1;
  for(var k in cells){
    var parts=k.split("-");
    if(parts[0]!==dayCode) continue;
    if(!cells[k] || !cells[k].l) continue;
    var kh=parseInt(parts[1],10);
    var startMin=kh*60;
    var diff=nowMin-startMin;             // 양수=수업 시작 지남, 음수=아직 전
    if(diff>=-40 && diff<=30){            // 40분 전 ~ 30분 후
      var absd=Math.abs(diff);
      if(absd<bestDiff){ bestDiff=absd; best=k; bestH=kh; }
    }
  }
  if(best){
    S.curSlot=best; S.curClassLabel=cells[best].l;
  } else {
    S.curSlot=null; S.curClassLabel="";
  }
  var bar=document.getElementById("classbar");
  if(bar){
    if(best){
      bar.className="classbar";
      bar.textContent="📍 지금 수업 — "+bestH+":00 "+cells[best].l;
    } else {
      bar.className="classbar off";
      bar.textContent="⚠️ 지금은 수업 시간이 아니에요";
    }
  }
}
/* 그 아이가 지금 배치된 '연속' 수업 슬롯들 찾기 (지도진이 배치한 인접 칸) */
function findAttendSlots(name){
  var vs=viewSlot();
  if(!vs) return [];
  var wk=curWeek();
  var w=S.weeks[wk]; if(!w) w={cells:{}};
  var parts=vs.split("-");
  var day=parts[0], baseH=parseInt(parts[1],10);
  var cells=(S.schedule&&S.schedule.cells)||{};
  /* 이 아이가 배치된 칸인지 확인: 시간표 명단(schedule)이 아니라
     주간 배치(weeks.cells.lv)에 이름이 있는지로 판단 (지도진이 배치한 것) */
  function placedIn(h){
    var key=day+"-"+h;
    var c=w.cells&&w.cells[key];
    if(!c || !c.lv) return false;
    for(var i=0;i<3;i++){ if(c.lv[i] && c.lv[i].indexOf(name)>-1) return true; }
    return false;
  }
  var slots=[];
  /* 지금 수업 칸에 지도진이 배치했을 때만 출석 가능.
     배치 안 됐으면 빈 배열 → 출석 거절 (신규 배치는 만들지 않음) */
  var anyPlaced=placedIn(baseH);
  if(anyPlaced){
    /* 위·아래로 연속으로 배치된 칸 모두 모음 */
    slots.push(day+"-"+baseH);
    for(var h=baseH+1; h<=23; h++){ if(placedIn(h)) slots.push(day+"-"+h); else break; }
    for(var h2=baseH-1; h2>=0; h2--){ if(placedIn(h2)) slots.unshift(day+"-"+h2); else break; }
  }
  /* 배치 안 된 아이 → 빈 배열 (choose에서 거절 처리) */
  return slots;
}

/* 이미 출석했는지 확인 (같은 수업 기준) — 배치된 슬롯 중 하나라도 이미 출석이면 true */
/* 본인이 이미 단말기로 눌렀는지 확인 (지도진 출석은 차단 대상 아님)
   → 아이가 눌렀을 때 by:"self"로 저장. 그게 이미 있으면 진짜 중복. */
function alreadyAttended(name){
  var slots=findAttendSlots(name);
  if(!slots.length) return false;
  var wk=curWeek(); var w=S.weeks[wk]; if(!w) return false;
  for(var i=0;i<slots.length;i++){
    var c=w.cells&&w.cells[slots[i]];
    var mk=c&&c.marks&&c.marks[name];
    // '본인이 직접 누른(self)' 출석이 이미 있을 때만 중복으로 봄
    if(mk && mk.s==="출석" && mk.by==="self") return true;
  }
  return false;
}
/* ── 출석 처리: 배치된 연속 수업 모두 한 번에 출석 ── */
function markAttendance(name){
  var wk=curWeek();
  if(!S.weeks[wk]) S.weeks[wk]={t:0, cells:{}};
  var w=S.weeks[wk];
  /* 지도진이 배치한 슬롯만 반환됨. 배치 없으면 choose에서 이미 거절되어
     여기까지 오지 않지만, 방어적으로 한 번 더 확인 */
  var slots=findAttendSlots(name);
  if(!slots.length){ return 0; }
  var markedCount=0, tnow=Date.now();   /* [k2.9] 모든 칸에 같은 시각 — 보관함과 맞추기 위해 */
  slots.forEach(function(slot){
    /* 배치된 칸은 이미 존재함. 방어적으로 없으면 생성하되 lv는 지도진 배치를 존중 */
    if(!w.cells[slot]) w.cells[slot]={lv:[[],[],[]], marks:{}};
    var cell=w.cells[slot];
    if(!cell.marks) cell.marks={};
    var prev=cell.marks[name]||{};
    var wasAttended=prev.s==="출석";   // 이미 출석 상태였나 (지도진이든 본인이든)
    /* 본인이 눌렀음을 표시(by:self). 지도진이 미리 찍었어도 self로 승격.
       lv(배치)는 건드리지 않음 — 지도진이 이미 배치한 상태이므로 그대로 둠 */
    cell.marks[name]={ s:"출석", k:prev.k, m:prev.m||"", t:tnow, by:"self" };
    /* 누적 횟수 +1 (심사용) — 이 수업에 '출석' 상태가 아예 없었을 때만.
       지도진이 이미 출석 찍어둔 칸이면 누적은 그대로 (이중 카운트 방지) */
    if(!wasAttended){
      if(!S.accMap) S.accMap={};
      S.accMap[name]=(S.accMap[name]||0)+1;
      markedCount++;
    }
  });
  queueAdd({kind:"mark", name:name, wk:wk, slots:slots.slice(), t:tnow});   /* [k2.9] 기기 보관함에 먼저 남김 */
  w.t=Date.now();
  S.lastMarkedSlots=slots;   // 완료화면 표시용
  schedulePush();
  return markedCount;
}

/* [k2.8] 출석 되돌리기 — 길게 눌러 '아직 안 온 친구'로 되돌림
   · 본인이 누른 출석(by:self)만 되돌린다. 사범님이 찍은 출석·결석은 건드리지 않는다.
   · 누적 횟수(심사용)도 같이 1 내린다.
   · 하원 기록이 있으면 함께 지운다. */
function unmarkAttendance(name){
  var wk=curWeek(); var w=S.weeks[wk];
  if(!w || !w.cells) return 0;
  var slots=findAttendSlots(name);
  if(!slots.length) return 0;
  var n=0, tnow=Date.now();
  slots.forEach(function(slot){
    var cell=w.cells[slot]; if(!cell || !cell.marks) return;
    var prev=cell.marks[name]; if(!prev) return;
    if(prev.s!=="출석" || prev.by!=="self") return;      /* 본인 출석만 */
    cell.marks[name]={ s:"", k:prev.k, m:prev.m||"", t:tnow, by:"" };
    if(S.accMap && S.accMap[name]) S.accMap[name]=Math.max(0, S.accMap[name]-1);
    n++;
  });
  if(n){
    if(S.outMap && S.outMap[name]){ delete S.outMap[name]; saveOutMap(); }
    queueAdd({kind:"unmark", name:name, wk:wk, slots:slots.slice(), t:tnow});   /* [k2.9] 되돌리기도 보관 */
    w.t=Date.now();
    schedulePush();
  }
  return n;
}

/* 여러 명이 몰릴 때: 마지막 출석 후 살짝 모아서 한 번에 push */
function schedulePush(){
  clearTimeout(S.pushTimer);
  S.pushTimer=setTimeout(pushAtt, 1200);
}
function pushAtt(){
  if(!S.key || !S.attRaw) return;
  if(S.pushing){ S.pushAgain=true; return; }               /* [k2.9] 한 번에 하나씩 — 끝나면 다시 */
  S.pushing=true; S.pushAgain=false;
  var sentIds=Q.items.map(function(it){ return it.id; });  /* 이번 전송에 실린 보관 항목 */
  function endPush(ok){
    S.pushing=false;
    if(ok){ queueRemove(sentIds); flushNotify(); }           /* OK일 때만 보관함에서 지운다. 실패면 30초 뒤 자동 재시도 */
    updateNetTag();
    if(ok && S.pushAgain){ S.pushAgain=false; schedulePush(); }
  }
  // att 원본에 갱신된 weeks·acc 반영
  S.attRaw.weeks=S.weeks;
  if(S.accMap){ if(!S.attRaw.acc) S.attRaw.acc={map:{},t:0}; S.attRaw.acc.map=S.accMap; S.attRaw.acc.t=Date.now(); }
  S.attRaw.savedAt=Date.now();
  // 서버 것 먼저 합치기(다른 기기 출석 유실 방지)는 관리 프로그램이 처리.
  // 키오스크는 안전하게: 서버 pull → 병합 → push
  fetch(GSHEET_URL+"?key="+encodeURIComponent(S.key)+"&store=att")
    .then(function(r){ return r.json(); })
    .then(function(rows){
      var remote=parseRows(rows);
      /* [k2.9] fail-closed — 서버 자료를 제대로 못 받으면 절대 덮어쓰지 않는다 (보관함이 남아 있으니 다음에 다시) */
      if(!remote || !remote.attV || !remote.weeks){ throw new Error("bad-remote"); }
      if(remote && remote.weeks){
        // 주간 marks 병합: 서버 것 + 내 것 (t 큰 쪽 우선)
        mergeWeeksInto(remote.weeks, S.weeks);
        S.weeks=remote.weeks;
        S.attRaw=remote;
        S.attRaw.weeks=S.weeks;
        if(S.accMap){ if(!S.attRaw.acc)S.attRaw.acc={map:{},t:0};
          // 누적은 서버와 이름별 최대
          var sm=(remote.acc&&remote.acc.map)||{}, base=S.accBase||{};
          /* [k2.9] 되돌리기로 내린 누적이 '최대값 합치기'에 밀려 되살아나던 문제 —
             마지막 동기화 이후 이 기기에서 바뀐 만큼(±)을 서버 값에 더한다. 바뀐 게 없는 이름은 예전처럼 최대값 */
          for(var nm in S.accMap){ var d=(S.accMap[nm]||0)-(base[nm]||0);
            sm[nm]= d ? Math.max(0,(sm[nm]||0)+d) : Math.max(sm[nm]||0, S.accMap[nm]||0); }
          S.attRaw.acc.map=sm; S.accMap=sm; S.accBase=JSON.parse(JSON.stringify(sm));
        }
      }
      var s=JSON.stringify(S.attRaw);
      var rows2=[["JSON"]];
      for(var i=0;i<s.length;i+=45000) rows2.push([s.slice(i,i+45000)]);
      return fetch(GSHEET_URL,{method:"POST",body:JSON.stringify({key:S.key,store:"att",rows:rows2})});
    })
    .then(function(r){ return r.text(); })
    .then(function(txt){ endPush(/^OK/.test(String(txt||""))); })
    .catch(function(){ endPush(false); /* 오프라인·오류 — 보관함에 남아 있고 30초마다 재시도 */ });
}
/* 주간 marks 병합: src의 각 셀 marks를 dst에 t 우선으로 */
function mergeWeeksInto(dst, src){
  for(var wk in src){
    if(!dst[wk]){ dst[wk]=src[wk]; continue; }
    var sc=src[wk].cells||{}, dc=dst[wk].cells||{};
    if(!dst[wk].cells) dst[wk].cells={};
    for(var ck in sc){
      if(!dc[ck]){ dst[wk].cells[ck]=sc[ck]; continue; }
      var sm=sc[ck].marks||{}, dm=dc[ck].marks||{};
      for(var nm in sm){ if(!dm[nm] || (sm[nm].t||0)>(dm[nm].t||0)) dm[nm]=sm[nm]; }
      // lv 합치기 — [k2.11] 서버 셀에 lv가 없으면 만들어 병합 중단(TypeError→재시도 반복) 방지
      if(!dc[ck].lv) dc[ck].lv=[[],[],[]];
      for(var i=0;i<3;i++){ if(!dc[ck].lv[i]) dc[ck].lv[i]=[]; (sc[ck].lv&&sc[ck].lv[i]||[]).forEach(function(n){ if(dc[ck].lv[i].indexOf(n)<0) dc[ck].lv[i].push(n); }); }
    }
    dst[wk].t=Math.max(dst[wk].t||0, src[wk].t||0);
  }
}

/* ── 소리 ── */
function playChime(){
  try{ var AC=window.AudioContext||window.webkitAudioContext; var ctx=window.__ac||(window.__ac=new AC()); if(ctx.state==="suspended")ctx.resume();
    [{f:880,t:0},{f:1318,t:0.13}].forEach(function(n){ var o=ctx.createOscillator(),g=ctx.createGain(); o.type="sine"; o.frequency.value=n.f; o.connect(g); g.connect(ctx.destination);
      var st=ctx.currentTime+n.t; g.gain.setValueAtTime(0,st); g.gain.linearRampToValueAtTime(0.35,st+0.02); g.gain.exponentialRampToValueAtTime(0.001,st+0.45); o.start(st); o.stop(st+0.5); });

/* ══════ [사진 출석] ══════ */
var UNDO_SEC = 3;               /* 되돌릴 수 있는 시간(초) */
var LEAVE_WARN_MIN = 10;        /* [k2.2] 출석 후 이 시간(분) 안에 하원을 누르면 한 번 확인 — 막지는 않음 */
var LATE_MIN = 10;              /* [k2.4] 수업 시작 후 이 시간(분)을 넘겨 누르면 '늦게 도착' 표시 (표시 전용) */
var GRID_MAX = 40;              /* 한 화면 최대 인원 */

/* 지금 수업에 '지도진이 배치한' 학생 명단 (가나다순) */
function classRoster(){
  var vs=viewSlot();
  if(!vs) return [];
  var w=S.weeks[curWeek()]; if(!w||!w.cells) return [];
  var c=w.cells[vs]; if(!c||!c.lv) return [];
  var out=[], seen={};
  for(var i=0;i<3;i++){
    var arr=c.lv[i]||[];
    for(var j=0;j<arr.length;j++){
      var n=(arr[j]||"").trim();
      if(!n || seen[n]) continue;
      if(!isActive(n)) continue;
      seen[n]=1; out.push(n);
    }
  }
  /* [k2.5] 정렬 — ① 높은 급수 ② 이번달 심사 대상 ③ 가나다 */
  var EXT=examTargets();
  out.sort(function(a,b){
    var ra=gradeRank(gradeOf(a)), rb=gradeRank(gradeOf(b));
    if(ra!==rb) return ra-rb;
    var ea=EXT[a]?0:1, eb=EXT[b]?0:1;
    if(ea!==eb) return ea-eb;
    return a.localeCompare(b,'ko');
  });
  return out.slice(0, GRID_MAX);
}
/* 급수 순위 — 숫자가 작을수록 높은 급. 품·단은 급보다 위 (4품 → -4 로 맨 앞) */
function gradeRank(g){
  g=String(g||"");
  var pm=g.match(/(\d+)\s*[품단]/);
  if(pm) return -Number(pm[1]);
  if(/[품단]/.test(g)) return -1;
  var m=g.match(/(\d+)\s*급/);
  if(m) return Number(m[1]);
  return 99;
}
function gradeOf(name){
  var s=S.students.find(function(x){ return x.n===name; });
  return (s && s.grade) ? s.grade : "";
}
/* 급수 → 띠 색 — [k2.11] 실제 띠 체계(9흰·8노·7주황·6초록·5파랑·4보라·3밤·2빨강·1보띠)로 교정.
   종전 4단계 구간이라 9급 흰띠가 노란색, 7급 주황이 초록으로 보였다(전면 점검 팀E 발견). */
function beltColorOf(g){
  g=String(g||"");
  if(/[품단]/.test(g)) return "#111111";
  var m=g.match(/(\d+)\s*급/);
  if(!m) return "#E8EAED";                       /* 무급·미지정 = 흰띠 */
  var C={9:"#E8EAED",8:"#F3C614",7:"#F08A24",6:"#1E8E3E",5:"#2B5FB8",4:"#7A4CA8",3:"#6B4A2B",2:"#C8342A",1:"#C8342A"};
  return C[parseInt(m[1],10)]||"#E8EAED";
}
function firstChar(name){ return String(name||"?").charAt(0); }

/* [k2.8] 길게 누르기(1.2초) → 출석 되돌리기 확인 */
var LONGPRESS_MS = 1200;
window.holdStart = function(ev, name){
  try{ if(ev && ev.type==="mousedown" && ev.button!==0) return; }catch(e){}
  clearTimeout(S.holdTimer);
  S.holdName=name; S.holdFired=false;
  S.holdTimer=setTimeout(function(){
    S.holdFired=true;
    var mk=null;
    try{
      var c=S.weeks[curWeek()].cells[viewSlot()];
      mk=c && c.marks && c.marks[name];
    }catch(e){}
    if(!(mk && mk.s==="출석" && mk.by==="self")) return;   /* 되돌릴 게 없음 */
    S.chosen=name; S.screen="undoAsk"; render(); playError();
  }, LONGPRESS_MS);
};
window.holdEnd = function(){ clearTimeout(S.holdTimer); };
window.undoAskNo = function(){ S.chosen=null; S.screen="grid"; render(); };
window.undoAskYes = function(){
  var nm=S.chosen;
  if(nm) unmarkAttendance(nm);
  S.chosen=null; S.screen="grid"; render();
};

/* 그리드에서 얼굴을 눌렀을 때 — 아직 출석 처리하지 않고 되돌리기 창을 연다 */
window.tapStu = function(name){
  if(S.holdFired){ S.holdFired=false; return; }   /* [k2.8] 길게 누른 것은 탭으로 치지 않음 */
  if(!S.curSlot){
    S.chosen=name;
    S.rejectMsg="지금은 수업 시간이 아니에요";
    S.rejectSub="수업 시작 40분 전부터 출석할 수 있어요";
    S.screen="reject"; render(); playError(); return;
  }
  var slots=findAttendSlots(name);
  if(!slots.length){
    S.chosen=name;
    S.rejectMsg="오늘 이 수업에 배치되어 있지 않아요";
    S.rejectSub="사범님께 말씀해 주세요";
    S.screen="reject"; render(); playError(); return;
  }
  /* [k2.7] 이미 출석한 아이가 같은 사진을 다시 누르면 → 하원 처리
     (하원까지 끝난 아이는 안내만. 하원 흐름 안에 10분 확인이 그대로 들어 있다) */
  if(alreadyAttended(name)){
    if(S.outMap && S.outMap[name]){
      S.chosen=name; S.screen="already"; render(); playAlreadyDone(); return;
    }
    return tapLeave(name);
  }
  /* 되돌리기 대기 — 이 시점엔 아직 저장하지 않는다 */
  S.chosen=name;
  S.pending=name;
  S.screen="pending";
  render();
  playDone();
  startUndoCountdown();
};

function clearUndoTimer(){ if(S.undoTimer){ clearInterval(S.undoTimer); S.undoTimer=null; } }

function startUndoCountdown(){
  clearUndoTimer();
  var left = UNDO_SEC*10;
  S.undoTimer = setInterval(function(){
    left--;
    var bar=document.getElementById("cdBar"), txt=document.getElementById("cdTxt");
    if(bar) bar.style.width = Math.max(0, left/(UNDO_SEC*10)*100)+"%";
    if(txt) txt.textContent = Math.max(0,Math.ceil(left/10))+"초 뒤 저장됩니다";
    if(left<=0){ clearUndoTimer(); commitPending(); }
  }, 100);
}

/* 확정 — 이때 비로소 출석 처리 + 서버 전송 */
function commitPending(){
  clearUndoTimer();
  var nm=S.pending; S.pending=null;
  if(!nm){ goHome(); return; }
  var cnt=markAttendance(nm);        /* 내부에서 schedulePush() 호출 */
  if(cnt>0) kioskNotify([{kind:"attend", names:[nm], title:"✅ 등원 알림", body:nm+" 수련생이 "+nowKo()+"에 나라차태권도장에 도착했습니다."}]);   /* [k2.0] 학부모 휴대폰 등원 알림 */
  goHome();
}
window.confirmNow = function(){ commitPending(); };

/* 취소 — 아무것도 저장하지 않았으므로 되돌릴 것이 없다 */
window.undoPending = function(){
  clearUndoTimer();
  S.pending=null; S.chosen=null;

};

    var hl='<div class="glead"><h1>🏠 집에 가요 · 본인 사진을 눌러주세요</h1><p>누르면 <b>집에 갔어요</b>로 기록돼요</p></div>';
    if(!lst.length) hl+='<div class="gempty">오늘 출석한 뒤 아직 하원하지 않은 친구가 없어요</div>';
    else hl+='<div class="grid">'+lst.map(function(nm){ var ph=getPhoto(nm), gr=gradeOf(nm), bc=beltColorOf(gr);
      return '<div class="stu" onclick="tapLeave(\''+nm.replace(/'/g,"\\'")+'\')">'+(ph?'<img src="'+ph+'" alt="">':'<div class="noimg">'+firstChar(nm)+'</div>')+'<div class="nm">'+nm+'</div><div class="gr"><i class="bbar" style="background:'+bc+'"></i>'+(gr||'&nbsp;')+'</div></div>'; }).join('')+'</div>';
    hl+='<button class="altbtn" onclick="goHome()">← 출석 화면으로</button>';
    p.innerHTML=hl;
  }
  else if(S.screen==="undoAsk"){   /* [k2.8] 출석 되돌리기 확인 */
    var nmU=S.chosen||"", phU=getPhoto(nmU);
    p.innerHTML='<div class="done">'+
      (phU?'<img class="photo-big" src="'+phU+'" style="border-color:#FFE2B8">':'<div class="photo-big">'+firstChar(nmU)+'</div>')+
      '<div class="badge" style="background:#FFF0E2;color:#8A4F12">↩ 출석 되돌리기</div>'+
      '<h1>'+nmU+'</h1>'+
      '<p>출석을 지우고 <b>아직 안 온 친구</b>로 되돌릴까요?</p>'+
      '<div class="warnBtns">'+
        '<button class="wStay" onclick="undoAskNo()">아니요 · 그대로 둘래요</button>'+
        '<button class="wGo" onclick="undoAskYes()">네, 되돌릴게요</button>'+
      '</div></div>';
  }
  else if(S.screen==="leaveWarn"){   /* [k2.2] 출석 직후 하원 — 막지 않고 한 번 확인 */
    var nmW=S.pendingOut||"", phW=getPhoto(nmW);
    p.innerHTML='<div class="done">'+
      (phW?'<img class="photo-big" src="'+phW+'" style="border-color:#FFE2B8">':'<div class="photo-big">'+firstChar(nmW)+'</div>')+
      '<div class="badge" style="background:#FFF0E2;color:#8A4F12">⏳ 아직 수련 중이에요</div>'+
      '<h1>'+nmW+'</h1>'+
      '<p>출석한 지 얼마 되지 않았어요.<br>정말 집에 가나요?</p>'+
      '<div class="warnBtns">'+
        '<button class="wStay" onclick="cancelLeaveWarn()">아니에요 · 더 수련할래요</button>'+
        '<button class="wGo" onclick="leaveAnyway()">그래도 집에 가요</button>'+
      '</div></div>';
  }
  else if(S.screen==="leavePending"){
    var nmL=S.pendingOut||S.chosen||"", phL=getPhoto(nmL);
    p.innerHTML='<div class="done">'+(phL?'<img class="photo-big" src="'+phL+'">':'<div class="photo-big">'+firstChar(nmL)+'</div>')+
      '<div class="badge" style="background:#FFF1C9;color:#8A6416">🏠 하원</div><h1>'+nmL+'</h1><p>오늘도 수고했어요! 조심히 가요 👋</p>'+
      '<button class="undoBtn" onclick="undoLeave()">↩ 내가 아니에요 · 취소</button>'+
      '<div class="cdWrap"><div class="cdBar" id="cdBar"></div></div><div class="cdTxt" id="cdTxt">'+UNDO_SEC+'초 뒤 저장됩니다</div>'+
      '<button class="backbtn" onclick="confirmLeaveNow()">다음 사람 →</button></div>';
  }
  else if(S.screen==="leaveDone"){
    var nmD=S.chosen||"", phD=getPhoto(nmD);
    p.innerHTML='<div class="done">'+(phD?'<img class="photo-big" src="'+phD+'">':'<div class="photo-big">👤</div>')+
      '<div class="badge" style="background:#FFF1C9;color:#8A6416">✓ 하원 완료 · '+(S.outMap[nmD]||nowKo())+'</div><h1>'+nmD+'</h1><p>오늘도 수고했어요! 조심히 가요 👋</p></div>';
  }
  else if(S.screen==="pending"){
    var nmP=S.pending||S.chosen||"";
    var phP=getPhoto(nmP);
    var slotLabelP=(S.curSlot?S.curSlot.split("-")[1]+":00 ":"")+(S.curClassLabel||"");
    p.innerHTML='<div class="done">'+
      (phP?'<img class="photo-big" src="'+phP+'">':'<div class="photo-big">'+firstChar(nmP)+'</div>')+
      '<div class="badge">✓ 출석 완료</div>'+
      '<h1>'+nmP+'</h1>'+
      '<p>오늘도 반가워요! 열심히 수련해요 🥋</p>'+
      (isExamTarget(nmP)?'<div class="exline">🎖 이번달 심사 대상이에요!</div>':'')+
      (slotLabelP.trim()?'<div class="cls2">'+slotLabelP+'</div>':'')+
      '<button class="undoBtn" onclick="undoPending()">↩ 내가 아니에요 · 취소</button>'+
      '<div class="cdWrap"><div class="cdBar" id="cdBar"></div></div>'+
      '<div class="cdTxt" id="cdTxt">'+UNDO_SEC+'초 뒤 저장됩니다</div>'+
      '<button class="backbtn" onclick="confirmNow()">다음 사람 →</button>'+
    '</div>';
  }
  else if(S.screen==="pad"){
    var dots=""; for(var i=0;i<4;i++){ var v=S.pin[i]||""; dots+='<div class="dot'+(v?" filled":"")+'">'+(v?"•":"")+'</div>'; }
    p.innerHTML='<div class="lead"><h1>출석 체크</h1><p>부모님 휴대폰 <b>뒤 4자리</b>를 눌러주세요</p></div>'+
      '<div class="pin'+(S.err?" shake":"")+'">'+dots+'</div>'+
      '<div class="pad">'+
        [1,2,3,4,5,6,7,8,9].map(function(n){return '<button class="key" onclick="press('+n+')">'+n+'</button>';}).join('')+
        '<button class="key del" onclick="del()">⌫</button>'+
        '<button class="key" onclick="press(0)">0</button>'+
        '<button class="key clr" onclick="clearAll()">정정</button>'+
      '</div><div class="errmsg">'+(S.err||"")+'</div>';
    S.err="";
  }
  else if(S.screen==="confirm"){
    p.innerHTML='<div class="confirm-lead"><h1>본인이 맞으면 눌러주세요</h1><p>사진과 이름을 확인하고 누르면 출석돼요</p></div>'+
      '<div class="facegrid">'+
        S.matches.map(function(nm,i){
          var ph=getPhoto(nm);
          return '<div class="facecard" onclick="choose('+i+')">'+
            (ph?'<img class="photo" src="'+ph+'">':'<div class="photo">👤</div>')+
            '<div class="info"><div class="nm">'+nm+'</div><div class="cls">'+(S.curClassLabel||"")+'</div></div>'+
            '<div class="tap">출석</div></div>';
        }).join('')+
      '</div><button class="backbtn" onclick="reset()">← 다시 입력</button>';
  }
  else if(S.screen==="done"){
    var nm=S.chosen; var ph=getPhoto(nm);
    // 연속 수업이면 여러 시간 표시 (예: "15:00·16:00")
    var slotLabel="";
    if(S.lastMarkedSlots && S.lastMarkedSlots.length){
      var hrs=S.lastMarkedSlots.map(function(sl){ return sl.split("-")[1]+":00"; });
      slotLabel=hrs.join(" · ")+" "+(S.curClassLabel||"");
    } else if(S.curClassLabel){
      slotLabel=(S.curSlot?S.curSlot.split("-")[1]+":00 ":"")+S.curClassLabel;
    }
    var multi=(S.lastMarkedSlots && S.lastMarkedSlots.length>1);
    p.innerHTML='<div class="done">'+
      (ph?'<img class="photo-big" src="'+ph+'">':'<div class="photo-big">👤</div>')+
      '<div class="badge">✓ 출석 완료'+(multi?' ('+S.lastMarkedSlots.length+'교시)':'')+'</div><h1>'+nm+'</h1>'+
      '<p>'+(multi?'연속 수련 모두 출석했어요 🥋':'오늘도 힘차게 수련해요 🥋')+'</p>'+
      (slotLabel?'<div class="cls2">'+slotLabel+'</div>':'')+
      '</div>';
    clearTimeout(window.__t); window.__t=setTimeout(reset,3500);
  }
  else if(S.screen==="already"){
    var nm2=S.chosen; var ph2=getPhoto(nm2);
    p.innerHTML='<div class="done">'+
      (ph2?'<img class="photo-big" src="'+ph2+'" style="border-color:#FFE0B2">':'<div class="photo-big">👤</div>')+
      '<div class="badge" style="background:#FFF3E0;color:#B45309">⚠️ 이미 출석했어요</div><h1>'+nm2+'</h1>'+
      '<p>이미 출석 처리되었습니다</p>'+
      (S.curClassLabel?'<div class="cls2" style="background:#FFF3E0;color:#B45309">'+(S.curSlot?S.curSlot.split("-")[1]+":00 ":"")+S.curClassLabel+'</div>':'')+
      '</div>';
    clearTimeout(window.__t); window.__t=setTimeout(reset,3000);
  }
  else if(S.screen==="reject"){
    var nm3=S.chosen; var ph3=getPhoto(nm3);
    p.innerHTML='<div class="done">'+
      (ph3?'<img class="photo-big" src="'+ph3+'" style="border-color:#FFCDD2">':'<div class="photo-big">👤</div>')+
      '<div class="badge" style="background:#FFEBEE;color:#C62828">🚫 출석할 수 없어요</div><h1>'+nm3+'</h1>'+
      '<p>'+(S.rejectMsg||"출석할 수 없어요")+'</p>'+
      (S.rejectSub?'<div class="cls2" style="background:#FFEBEE;color:#C62828">'+S.rejectSub+'</div>':'')+
      '</div>';
    clearTimeout(window.__t); window.__t=setTimeout(reset,3200);
  }
}

/* ── 동작 ── */
window.submitKey=function(){
  var v=document.getElementById("keyIn").value.trim();
  if(!v){ S.err="접속키를 입력해주세요"; render(); return; }
  S.key=v; try{ localStorage.setItem("naracha-kiosk-key", v); }catch(e){}
  S.err=""; loadAll();
};
window.press=function(n){ if(S.pin.length>=4)return; S.pin+=n; render(); if(S.pin.length===4){ submitPin(); } };
window.del=function(){ S.pin=S.pin.slice(0,-1); render(); };
window.clearAll=function(){ S.pin=""; S.err=""; render(); };
window.reset=function(){ clearUndoTimer(); S.pending=null; S.pin=""; S.screen=(S.mode==="pad"?"pad":"grid"); S.matches=null; S.chosen=null; S.err=""; S.rejectMsg=""; S.rejectSub=""; updateClass(); render(); };
window.submitPin=function(){
  var names=S.tailIndex[S.pin]||[];
  if(names.length===0){ S.err="일치하는 수련생이 없어요. 다시 확인해주세요"; S.pin=""; render(); return; }
  S.matches=names; S.screen="confirm"; render();
};
window.choose=function(i){
  var nm=S.matches[i];
  S.chosen=nm;
  // 1) 지금이 수업 시간(40분전~30분후)이 아니면 거절
  if(!S.curSlot){
    S.rejectMsg="지금은 수업 시간이 아니에요";
    S.rejectSub="수업 시작 40분 전부터 출석할 수 있어요";
    S.screen="reject";
    render(); playError();
    return;
  }
  // 2) 지도진이 이 수업에 배치하지 않은 아이면 거절
  var slots=findAttendSlots(nm);
  if(!slots.length){
    S.rejectMsg="오늘 이 수업에 배치되어 있지 않아요";
    S.rejectSub="사범님께 말씀해 주세요";
    S.screen="reject";
    render(); playError();
    return;
  }
  // 3) 이미 출석했으면 중복 차단 (같은 수업 기준)
  if(alreadyAttended(nm)){
    S.screen="already";
    render();
    playAlreadyDone();
    return;
  }
  markAttendance(nm);   // 즉시 로컬 반영 (연속 수업 모두)
  S.screen="done";
  render();
  playDone();
};

/* ── 전체화면·시계 ── */
function goFullscreen(){ var el=document.documentElement; var r=el.requestFullscreen||el.webkitRequestFullscreen; if(r){ r.call(el).then(function(){ unlockOrientation(); }).catch(function(){ unlockOrientation(); }); } else { unlockOrientation(); } }
document.addEventListener("click",function o(){ goFullscreen(); document.removeEventListener("click",o); },{once:true});
function tick(){
  var d=new Date();
  var c=document.getElementById("clock"); if(c) c.textContent=p2(d.getHours())+":"+p2(d.getMinutes());
  var dl=document.getElementById("dateLbl"); if(dl) dl.textContent=(d.getMonth()+1)+"월 "+d.getDate()+"일 ("+DAY_KO[DAY_CODE[d.getDay()]]+")";
}
setInterval(tick,1000); tick();
setInterval(function(){ if(S.loaded && (S.screen==="pad"||S.screen==="grid")){ updateClass(); if(S.screen==="grid") render(); } }, 60000);  // 1분마다 수업 갱신

/* 화면을 가로↔세로로 돌리면 레이아웃 다시 계산 */
window.addEventListener("orientationchange", function(){ setTimeout(function(){ if(typeof render==="function") render(); }, 200); });
window.addEventListener("resize", function(){ if(typeof render==="function") render(); });

/* ── 시작 ── */
if(S.key){ loadAll(); } else { render(); }
updateNetTag();
</script>
