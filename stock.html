<style>
:root{
  --navy:#1D2E5C; --navy2:#2A3F7A; --red:#B5273A; --cream:#F4F2ED; --paper:#fff;
  --ink:#1b1d24; --mute:#6b6f7a; --line:#e3e0da; --line2:#cfcbc2;
  --ok:#2e8b57; --warn:#d98b12; --bad:#c0392b; --info:#2b6cb0;
  --sh:0 1px 2px rgba(20,25,40,.06),0 6px 20px rgba(20,25,40,.06);
  --r:14px; --nav-h:60px; --top-h:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--cream);color:var(--ink);
  font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
a{color:var(--navy)}
.hide{display:none!important}

/* ── 상단 ── */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);height:var(--top-h);
  display:flex;align-items:center;gap:10px;padding:0 14px;padding-top:env(safe-area-inset-top)}
.top img{height:32px;width:auto}
.top .ttl{font-weight:900;color:var(--navy);font-size:17px;letter-spacing:-.2px;line-height:1.1}
.top .sub{font-size:11px;color:var(--mute);font-weight:500;white-space:nowrap}
@media(max-width:480px){.top .sub{display:none}.top .ttl{font-size:16px}}
.top .sp{flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);padding:6px 10px;border-radius:999px;background:var(--cream);border:1px solid var(--line);max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync .dot{width:9px;height:9px;border-radius:50%;background:#bbb;flex:none}
.sync.ok .dot{background:var(--ok)} .sync.wait .dot{background:var(--warn);animation:pulse 1s infinite} .sync.err .dot{background:var(--bad)} .sync.busy .dot{background:var(--info);animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.3}}
.who{font-size:12px;color:var(--navy);font-weight:700;padding:6px 10px;border-radius:999px;background:#eef1f8}

/* ── 탭 ── */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);
  display:flex;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mute);font-weight:500}
.tabs button .ic{font-size:20px;line-height:1}
.tabs button.on{color:var(--navy);font-weight:800}
.tabs button .badge{position:absolute;margin-left:28px;margin-top:-30px;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px}
main{padding:12px 12px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));max-width:1180px;margin:0 auto}
@media(min-width:900px){
  .tabs{position:sticky;top:var(--top-h);bottom:auto;border-top:0;border-bottom:1px solid var(--line);height:46px;padding:0 14px;justify-content:flex-start;gap:4px}
  .tabs button{flex:0 0 auto;flex-direction:row;padding:0 16px;font-size:14px;gap:6px;border-bottom:3px solid transparent}
  .tabs button.on{border-bottom-color:var(--red)}
  .tabs button .ic{font-size:16px}
  .tabs button .badge{position:static;margin:0}
  main{padding:18px 20px 60px}
}

/* ── 공통 부품 ── */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.card>.hd .nm{font-weight:800;color:var(--navy);font-size:15px}
.card>.hd .sb{font-size:12px;color:var(--mute);font-weight:400;margin-left:4px}
.card>.hd .sp{flex:1}
.card>.hd .sum{font-size:12px;color:var(--mute);white-space:nowrap}
.card>.hd .arrow{color:var(--line2);font-size:12px;transition:transform .15s}
.card.open>.hd .arrow{transform:rotate(90deg)}
.card>.bd{padding:12px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line2);background:var(--paper);font-size:13px;font-weight:600;color:var(--mute)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.red.on{background:var(--red);border-color:var(--red)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;font-size:14px;min-height:42px;border:1px solid var(--navy)}
.btn.sec{background:var(--paper);color:var(--navy);border-color:var(--line2)}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.ghost{background:transparent;color:var(--mute);border-color:transparent}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13px;border-radius:8px}
.btn.xs{padding:3px 8px;min-height:28px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:default}
.btn.full{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--mute);font-weight:700;margin-bottom:4px}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#fff;font-size:15px;min-height:42px}
.inp:focus{outline:2px solid var(--navy2);outline-offset:-1px}
textarea.inp{min-height:70px;resize:vertical}
.note{font-size:12px;color:var(--mute);line-height:1.5}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:#eef1f8;color:var(--navy)}
.tag.red{background:#fbe9ec;color:var(--red)} .tag.ok{background:#e6f4ec;color:var(--ok)} .tag.warn{background:#fdf1dc;color:#9a5f05} .tag.gray{background:#efeeea;color:var(--mute)}
.empty{padding:26px 12px;text-align:center;color:var(--mute);font-size:14px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .sp{flex:1}
.search{position:relative;flex:1;min-width:140px}
.search .inp{padding-left:34px}
.search::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6}
.banner{background:#fff8e6;border:1px solid #f1dfb0;color:#7a4b00;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
.banner.err{background:#fdecec;border-color:#f3c3c3;color:#8a1d1d}
.banner .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .v{font-size:22px;font-weight:900;color:var(--navy);line-height:1.1}
.kpi .l{font-size:11px;color:var(--mute);font-weight:600}
.kpi.red .v{color:var(--red)}
h2.sec{font-size:14px;color:var(--mute);font-weight:800;margin:18px 0 8px;letter-spacing:.2px}

/* ── 재고표 ── */
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st th{font-size:11px;color:var(--mute);font-weight:700;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.st th:first-child{text-align:left}
table.st td{padding:0;border-bottom:1px solid #f0eee9;text-align:right;height:42px}
table.st td:first-child{text-align:left;font-weight:800;color:var(--navy);padding-left:6px}
table.st tr.short td{background:#fff7f7}
table.st tr:last-child td{border-bottom:0}
table.st td .cell{display:block;width:100%;height:42px;line-height:42px;padding:0 6px;text-align:right;border-radius:6px}
table.st td .cell.ed{cursor:text}
table.st td .cell.ed:hover{background:#eef1f8}
table.st td .cell.z{color:#c9c6bf}
table.st td input.cell{border:2px solid var(--navy2);background:#fff;line-height:normal;font-weight:700;padding:0 6px}
table.st td.tot{font-weight:900}
table.st td .lack{color:var(--red);font-weight:900}
table.st td .over{color:var(--mute);font-weight:500;font-size:12px}
table.st td .base{color:var(--mute);font-weight:600}
table.st tr.tap td{cursor:pointer}
.pc{display:none}
@media(min-width:900px){.pc{display:table-cell}.mob{display:none}}
tr.hidden-item td{opacity:.45}

/* ── 모달 ── */
.ov{position:fixed;inset:0;background:rgba(20,25,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--paper);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.2)}
.md .mh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.md .mh .t{font-weight:900;color:var(--navy);font-size:17px}
.md .mh .s{font-size:12px;color:var(--mute)}
.md .mh .x{margin-left:auto;font-size:22px;color:var(--mute);padding:4px 8px}
.md .mf{display:flex;gap:8px;margin-top:14px}
.md .mf .btn{flex:1}
@media(min-width:700px){.ov{align-items:center}.md{max-width:560px;border-radius:18px;max-height:88vh}}
.qrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0eee9}
.qrow .ln{flex:1;font-weight:700}
.qrow .ln small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.step{display:flex;align-items:center;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.step button{width:42px;height:42px;font-size:22px;font-weight:800;color:var(--navy);background:#f6f5f1}
.step input{width:64px;height:42px;text-align:center;border:0;font-weight:800;font-size:17px;background:#fff}
.step.chg input{color:var(--red)}
.diff{font-size:12px;color:var(--red);font-weight:800;width:40px;text-align:right}
.lines{margin:8px 0}
.line{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.line .n{flex:1}
.line .q{font-weight:900;color:var(--navy)}
.olist .card .bd{padding-top:8px}
.oc{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.oc .dt{font-weight:800;color:var(--navy)}
.oc .wh{font-size:12px;color:var(--mute)}
.ol{font-size:13px;color:#333;margin:2px 0;padding-left:4px}
.ol b{color:var(--navy)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.log{padding:10px 0;border-bottom:1px solid #f0eee9}
.log:last-child{border-bottom:0}
.log .h{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mute)}
.log .h b{color:var(--ink)}
.log .b{font-size:13px;margin-top:3px}
.log .b div{padding:1px 0}
.log .m{font-size:12px;color:var(--mute);margin-top:2px}
.log.rv{opacity:.55;text-decoration:line-through}
pre.txt{white-space:pre-wrap;background:#f7f6f2;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13px;margin:0;max-height:40vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1b1d24;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:.95}
@media(min-width:900px){.toast{bottom:30px}}
.setrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0eee9}
.setrow .n{flex:1;font-weight:700}
.setrow .n small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.setrow.off .n{opacity:.45;text-decoration:line-through}
.lock{position:fixed;inset:0;background:var(--cream);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.lock .box{background:#fff;border:1px solid var(--line);border-radius:20px;padding:26px 22px;max-width:380px;width:100%;text-align:center;box-shadow:var(--sh)}
.lock img{width:120px}
.lock h1{font-size:20px;color:var(--navy);margin:8px 0 2px}
.lock p{color:var(--mute);font-size:13px;margin:0 0 14px}
@media print{.top,.tabs,.toolbar,.banner,.kpis{display:none!important}main{padding:0}.card{box-shadow:none;break-inside:avoid}}
</style>

<script>
/* ═══════════════════════════════════════════════════════════════
   나라차 물품관리 (stock.html)
   - 도복·띠·티셔츠 재고 파악 · 주문 · 중계도장 출고 · 이력
   - 단일 HTML 파일. 데이터는 이 기기(localStorage) + 구글 시트(Apps Script 「물품창고」)
   - 여러 기기 동시 수정: 값 하나하나에 수정시각(t)을 붙여 "더 최근 것"이 이기는 방식으로
     서버·기기 모두 같은 규칙으로 병합. 삭제는 del 표시(묘비)로 남기고 버리지 않는다.
   - 서버 응답이 조금이라도 이상하면(형식·인증·오류) 절대 저장하지 않는다(fail-closed).
   ═══════════════════════════════════════════════════════════════ */
var APP_VER = "v1.1";   /* R1.1: 긴팔T-B=검정 확정, 초기값 이름 수정 · R1.0: 최초 제작 2026-09-09 */

var LS_DB='naracha_stock_db', LS_CFG='naracha_stock_cfg', LS_DIRTY='naracha_stock_dirty', LS_UI='naracha_stock_ui';
var CATS=[{id:'dobok',name:'도복',unit:'벌',ic:'🥋'},{id:'belt',name:'띠',unit:'개',ic:'🎗️'},{id:'tee',name:'티셔츠',unit:'장',ic:'👕'}];
var LOGTYPES={sale:'판매',in:'입고',adj:'조정',move:'이동',count:'실사',jg:'중계출고',undo:'되돌림',seed:'초기값',order:'주문'};
var SEED_T = 1788800000000;  /* 초기값 전용 고정 시각(2026-09-07) — 사람이 고친 값(더 최근)이 항상 이기도록 */

var DB={rev:0,recs:{}};  var DIRTY={};  var CFG={url:'',key:'',who:''};
var UI={tab:'stock',cat:'dobok',q:'',open:{},logF:'',count:false,orderExtra:[],logN:80,showHidden:false};

/* ─────────── 저장/불러오기 ─────────── */
function loadLocal(){
  try{var d=JSON.parse(localStorage.getItem(LS_DB)||'null'); if(d&&d.recs&&typeof d.recs==='object'){DB=d;}}catch(e){}
  try{var c=JSON.parse(localStorage.getItem(LS_CFG)||'null'); if(c){CFG.url=c.url||'';CFG.key=c.key||'';CFG.who=c.who||'';}}catch(e){}
  try{var x=JSON.parse(localStorage.getItem(LS_DIRTY)||'null'); if(x&&typeof x==='object')DIRTY=x;}catch(e){}
  try{var u=JSON.parse(localStorage.getItem(LS_UI)||'null'); if(u){UI.cat=u.cat||UI.cat;UI.open=u.open||{};UI.tab=u.tab||UI.tab;}}catch(e){}
  if(!DB.recs)DB.recs={}; if(typeof DB.rev!=='number')DB.rev=0;
}
var _svT=null;
function saveLocal(){ clearTimeout(_svT); _svT=setTimeout(function(){
  try{localStorage.setItem(LS_DB,JSON.stringify(DB)); localStorage.setItem(LS_DIRTY,JSON.stringify(DIRTY));}catch(e){toast('이 기기 저장 실패: '+e.message);}
},150);}
function saveCfg(){ try{localStorage.setItem(LS_CFG,JSON.stringify(CFG));}catch(e){} }
function saveUI(){ try{localStorage.setItem(LS_UI,JSON.stringify({cat:UI.cat,open:UI.open,tab:UI.tab}));}catch(e){} }

/* ─────────── 레코드(값+수정시각) ─────────── */
function now(){return Date.now();}
function rec(id){return DB.recs[id];}
function fv(id,f,def){var r=DB.recs[id]; if(!r||!r.f||!r.f[f])return def; var v=r.f[f].v; return (v===undefined||v===null)?def:v;}
function alive(id){return !!DB.recs[id] && !fv(id,'del',false);}
/* 값 저장: 바뀐 항목만 새 시각을 찍고 전송 대기(DIRTY)에 넣는다 */
function setF(id,kind,fields,fixedT){
  var r=DB.recs[id]; if(!r){r={id:id,kind:kind,f:{}};DB.recs[id]=r;}
  if(!r.f)r.f={}; var t=fixedT||now(), ch=false;
  for(var k in fields){ var cur=r.f[k]; var nv=fields[k];
    if(cur && JSON.stringify(cur.v)===JSON.stringify(nv)) continue;
    var tt=t; if(!fixedT && cur && cur.t>=tt) tt=cur.t+1;
    if(fixedT && cur) continue;                 /* 초기값은 이미 있는 값을 절대 덮지 않는다 */
    r.f[k]={v:nv,t:tt}; ch=true; }
  if(ch){DIRTY[id]=now(); saveLocal(); schedulePush();}
  return ch;
}
/* 병합: 들어온 값의 시각이 더 최근일 때만 바꾼다(서버도 같은 규칙) */
function mergeRec(inc){
  if(!inc||typeof inc.id!=='string'||!inc.f||typeof inc.f!=='object')return false;
  var r=DB.recs[inc.id], ch=false;
  if(!r){r={id:inc.id,kind:inc.kind||'',f:{}};DB.recs[inc.id]=r;ch=true;}
  if(!r.kind&&inc.kind)r.kind=inc.kind;
  for(var k in inc.f){var a=r.f[k],b=inc.f[k]; if(!b||typeof b!=='object'||typeof b.t!=='number')continue;
    if(!a||b.t>a.t){r.f[k]={v:b.v,t:b.t};ch=true;}}
  return ch;
}
function recsOf(kind,all){var o=[];for(var id in DB.recs){var r=DB.recs[id];if(r.kind===kind&&(all||alive(id)))o.push(r);}return o;}
function bySeq(a,b){return (fv(a.id,'seq',0)-fv(b.id,'seq',0))||(a.id<b.id?-1:1);}
function num(v){v=Number(v);return isFinite(v)?v:0;}
function uid(p){return p+'_'+now().toString(36)+'_'+Math.random().toString(36).slice(2,6);}

/* ─────────── 도메인 ─────────── */
function locs(all){return recsOf('loc',all).sort(bySeq);}
function groups(cat,all){return recsOf('grp',all).filter(function(r){return !cat||fv(r.id,'cat')===cat;}).sort(bySeq);}
function sizeNum(s){var m=String(s).match(/\d+/);return m?Number(m[0]):9999;}
function items(gid,all){return recsOf('item',all).filter(function(r){return fv(r.id,'grp')===gid;}).sort(function(a,b){return (sizeNum(fv(a.id,'size'))-sizeNum(fv(b.id,'size')))||bySeq(a,b);});}
function qty(it,loc){return num(fv('q_'+it,loc,0));}
function total(it){var s=0;locs().forEach(function(l){s+=qty(it,l.id);});return s;}
function base(it){return num(fv(it,'base',0));}
function lack(it){var b=base(it);return b>0?Math.max(0,b-total(it)):0;}
function catOf(id){return CATS.filter(function(c){return c.id===id;})[0]||CATS[0];}
function grpName(g){return fv(g,'name','?');}
function grpUnit(g){return fv(g,'unit','')||catOf(fv(g,'cat')).unit;}
function itemName(it){var g=fv(it,'grp');return grpName(g)+' '+fv(it,'size','');}
function locName(l){return fv(l,'name',l);}
function fmtD(t){var d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtT(t){var d=new Date(t);return fmtD(t)+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function won(n){return num(n).toLocaleString('ko-KR')+'원';}

function addLog(type,lines,memo,extra){
  var id=uid('lg'); var f={t:now(),who:CFG.who||'',type:type,lines:lines||[],memo:memo||''};
  if(extra)for(var k in extra)f[k]=extra[k];
  setF(id,'log',f); return id;
}
/* 수량 여러 칸을 한 번에 바꾸고 이력 1건으로 남긴다. changes:[{it,loc,to}] */
function applyQty(changes,type,memo,extra){
  var lines=[];
  changes.forEach(function(c){var from=qty(c.it,c.loc);var to=Math.max(0,Math.round(num(c.to)));if(from===to)return;
    var f={};f[c.loc]=to;setF('q_'+c.it,'qty',f);lines.push({it:c.it,loc:c.loc,d:to-from,from:from,to:to});});
  if(lines.length)addLog(type,lines,memo,extra);
  return lines.length;
}

var SY={busy:false,again:false,state:'off',msg:'',last:0,timer:null};
function setState(s,msg){SY.state=s;SY.msg=msg||'';var p=document.getElementById('syncPill');if(!p)return;p.className='sync '+s;
  var n=Object.keys(DIRTY).length; var tx={off:'미연결(이 기기만)',ok:'동기화됨'+(SY.last?' '+new Date(SY.last).toTimeString().slice(0,5):''),wait:'저장 대기 '+n+'건',busy:'동기화 중…',err:'오류: '+SY.msg}[s];
  document.getElementById('syncTxt').textContent=tx;}
function schedulePush(){ if(!CFG.url||!CFG.key){setState('off');return;} setState('wait'); clearTimeout(SY.timer); SY.timer=setTimeout(function(){sync();},1500); }
function parseResp(txt){var j;try{j=JSON.parse(txt);}catch(e){throw new Error('응답 해석 실패(시트 주소·배포 확인)');}
  if(!j||typeof j!=='object')throw new Error('응답 형식 이상');
  if(j.ok!==true){var er=String(j.error||'');
    if(er==='AUTH')throw new Error('접속키가 맞지 않습니다'); throw new Error('서버: '+(er||'알 수 없음')+(j.msg?' '+j.msg:''));}
  if(typeof j.rev!=='number'||!Array.isArray(j.recs))throw new Error('응답 형식 이상(rev/recs)');
  return j;}
function applyServer(j){var ch=false;j.recs.forEach(function(r){if(mergeRec(r))ch=true;}); if(j.rev>DB.rev||ch){DB.rev=Math.max(DB.rev,j.rev);saveLocal();} if(ch)renderSoon(); return ch;}
async function pull(){
  var u=CFG.url+(CFG.url.indexOf('?')>0?'&':'?')+'key='+encodeURIComponent(CFG.key)+'&rev='+DB.rev+'&_='+now();
  var res=await fetch(u,{method:'GET',cache:'no-store'}); if(!res.ok)throw new Error('HTTP '+res.status);
  var j=parseResp(await res.text()); applyServer(j); SY.last=now();
}
async function push(ids){
  var started=now(); var recs=ids.map(function(id){return DB.recs[id];}).filter(Boolean);
  var res=await fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:CFG.key,rev:DB.rev,recs:recs,app:APP_VER,who:CFG.who})});
  if(!res.ok)throw new Error('HTTP '+res.status);
  var j=parseResp(await res.text()); applyServer(j);
  ids.forEach(function(id){if(DIRTY[id]<=started)delete DIRTY[id];}); saveLocal(); SY.last=now();
}
async function sync(manual){
  if(!CFG.url||!CFG.key){setState('off');if(manual)toast('설정에서 시트 주소와 접속키를 넣어 주세요');return;}
  if(SY.busy){SY.again=true;return;} SY.busy=true; setState('busy');
  try{ var ids=Object.keys(DIRTY); if(ids.length)await push(ids); else await pull();
       if(Object.keys(DIRTY).length)setState('wait'); else setState('ok'); if(manual)toast('동기화 완료');
  }catch(e){ setState('err',e.message||String(e)); if(manual)toast('동기화 실패: '+(e.message||e)); }
  finally{ SY.busy=false; if(SY.again){SY.again=false;setTimeout(sync,300);} }
}

/* PC: 칸을 눌러 바로 숫자 입력 */
function editCell(el,it,field){
  if(el.tagName==='INPUT')return;

  var inp=document.createElement('input');inp.type='number';inp.inputMode='numeric';inp.className='cell';inp.value=cur;inp.min=0;
  el.replaceWith(inp);inp.focus();inp.select();
  var done=false;function commit(){if(done)return;done=true;var v=Math.max(0,Math.round(num(inp.value)));
    if(field==='base'){setF(it,'item',{base:v});}
    else{applyQty([{it:it,loc:field,to:v}],UI.count?'count':'adj','');}
    render();}
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();commit();}if(e.key==='Escape'){done=true;render();}
    if(e.key==='Tab'){e.preventDefault();commit();}});
  inp.addEventListener('blur',commit);
}

function openAddGroup(){

  h+='<div class="field"><label>분류</label><div class="chips" id="ncat">'+CATS.map(function(c){return '<button class="chip '+(UI.cat===c.id?'on':'')+'" data-t="'+c.id+'" onclick="pickChip(this)">'+c.ic+' '+c.name+'</button>';}).join('')+'</div></div>';
  h+='<div class="field"><label>이름</label><input class="inp" id="nname" placeholder="예: 겨루기 도복"></div>';
  h+='<div class="field"><label>설명(선택)</label><input class="inp" id="nsub" placeholder="예: 9oz 트윌"></div>';
  h+='<div class="field"><label>사이즈 목록 (쉼표 구분)</label><input class="inp" id="nsizes" placeholder="예: 150,160,170,180"></div>';
  h+='<div class="mf"><button class="btn sec" onclick="closeModal()">취소</button><button class="btn" onclick="saveNewGroup()">추가</button></div>';
  openModal(h);
}
function saveNewGroup(){var cat=(document.querySelector('#ncat .chip.on')||{}).dataset;cat=cat&&cat.t||'dobok';var nm=document.getElementById('nname').value.trim();if(!nm){toast('이름을 입력하세요');return;}
  var seq=groups(cat,true).length*10+100; var g=uid('g'); setF(g,'grp',{cat:cat,name:nm,sub:document.getElementById('nsub').value.trim(),seq:seq,unit:'',price:0,del:false});
  document.getElementById('nsizes').value.split(/[,\s]+/).filter(Boolean).forEach(function(sz){var id='it_'+g.replace(/^g_/,'')+'_'+sz.replace(/[^A-Za-z0-9가-힣]/g,'');setF(id,'item',{grp:g,size:sz,seq:sizeNum(sz),base:0,del:false});});
  UI.cat=cat;closeModal();render();toast('품목군 추가됨');}

/* ═══════════ 주문 탭 ═══════════ */
function shortageList(){var o=[];groups().forEach(function(g){items(g.id).forEach(function(it){var l=lack(it.id);if(l>0)o.push({it:it.id,g:g.id,q:l});});});return o;}
function rOrder(){
  var h=banner(); var sl=shortageList();
  h+='<h2 class="sec">주문이 필요한 항목 (기준수량 − 보유)</h2>';
  h+='<div class="card"><div class="bd">';
  if(!sl.length&&!UI.orderExtra.length)h+='<div class="empty">부족한 항목이 없습니다. 기준수량이 비어 있으면 부족 계산을 하지 않으니, 재고 탭에서 기준수량을 넣어 주세요.</div>';
  var lastG='';
  sl.forEach(function(s){if(s.g!==lastG){lastG=s.g;h+='<div style="font-weight:800;color:var(--navy);margin:8px 0 2px">'+esc(grpName(s.g))+'</div>';}
    h+='<div class="line"><input type="checkbox" class="ochk" data-it="'+s.it+'" checked style="width:20px;height:20px"><div class="n">'+esc(fv(s.it,'size'))+' <small style="color:var(--mute)">보유 '+total(s.it)+' / 기준 '+base(s.it)+'</small></div><div class="step" style="transform:scale(.85);transform-origin:right"><button onclick="stepO(this,-1)">−</button><input type="number" inputmode="numeric" class="oq" data-it="'+s.it+'" value="'+s.q+'"><button onclick="stepO(this,1)">＋</button></div></div>';});
  if(UI.orderExtra.length){h+='<div style="font-weight:800;color:var(--navy);margin:8px 0 2px">직접 추가</div>';UI.orderExtra.forEach(function(x,i){h+='<div class="line"><input type="checkbox" class="ochk" data-it="'+x.it+'" checked style="width:20px;height:20px"><div class="n">'+esc(itemName(x.it))+' <small style="color:var(--mute)">보유 '+total(x.it)+'</small></div><div class="step" style="transform:scale(.85);transform-origin:right"><button onclick="stepO(this,-1)">−</button><input type="number" inputmode="numeric" class="oq" data-it="'+x.it+'" value="'+x.q+'"><button onclick="stepO(this,1)">＋</button></div><button class="btn xs ghost" onclick="UI.orderExtra.splice('+i+',1);render()">✕</button></div>';});}
  h+='<div class="acts"><button class="btn sec sm" onclick="openPick(\'order\')">＋ 항목 직접 추가</button><span class="sp" style="flex:1"></span><button class="btn sm" onclick="makeOrder()" '+(sl.length||UI.orderExtra.length?'':'disabled')+'>선택 항목으로 주문서 만들기</button></div>';
  h+='</div></div>';
  h+='<h2 class="sec">주문서 목록</h2><div class="olist">';
  var os=recsOf('order').sort(function(a,b){return fv(b.id,'t',0)-fv(a.id,'t',0);});
  if(!os.length)h+='<div class="empty">아직 주문서가 없습니다.</div>';
  os.forEach(function(o){var st=fv(o.id,'status','ready');var tag={ready:'<span class="tag warn">작성됨</span>',sent:'<span class="tag">발주함</span>',done:'<span class="tag ok">입고 완료</span>'}[st];
    var ls=fv(o.id,'lines',[]);var n=0;ls.forEach(function(l){n+=num(l.q);});
    h+='<div class="card"><div class="bd"><div class="oc"><span class="dt">'+fmtD(fv(o.id,'t'))+'</span>'+tag+'<span class="wh">'+esc(fv(o.id,'who',''))+' · 총 '+n+'</span></div>';
    h+=orderLinesHtml(ls,st==='done');
    if(fv(o.id,'memo'))h+='<div class="note">메모: '+esc(fv(o.id,'memo'))+'</div>';
    h+='<div class="acts"><button class="btn xs sec" onclick="showOrderText(\''+o.id+'\')">📋 주문 문구</button>';
    if(st==='ready')h+='<button class="btn xs" onclick="setF(\''+o.id+'\',\'order\',{status:\'sent\',sentAt:now()});render()">발주 완료로 표시</button>';
    if(st!=='done')h+='<button class="btn xs" style="background:var(--ok);border-color:var(--ok)" onclick="openReceive(\''+o.id+'\')">📥 입고 처리</button>';
    if(st!=='done')h+='<button class="btn xs ghost" onclick="if(confirm(\'이 주문서를 삭제할까요?\')){setF(\''+o.id+'\',\'order\',{del:true});render();}">삭제</button>';
    h+='</div></div></div>';});
  h+='</div>';return h;
}
function orderLinesHtml(ls,done){var byG={};ls.forEach(function(l){var g=fv(l.it,'grp');(byG[g]=byG[g]||[]).push(l);});
  return Object.keys(byG).map(function(g){return '<div class="ol"><b>'+esc(grpName(g))+'</b> '+byG[g].map(function(l){return esc(fv(l.it,'size'))+'×'+num(l.q)+(done&&l.rq!==undefined&&num(l.rq)!==num(l.q)?'<span style="color:var(--red)">(입고 '+num(l.rq)+')</span>':'');}).join(', ')+'</div>';}).join('');}
function stepO(btn,d){var i=btn.parentNode.querySelector('input');i.value=Math.max(0,Math.round(num(i.value))+d);}
function makeOrder(){var lines=[];var chk={};[].forEach.call(document.querySelectorAll('.ochk'),function(c){if(c.checked)chk[c.dataset.it]=true;});
  [].forEach.call(document.querySelectorAll('.oq'),function(i){var q=Math.round(num(i.value));if(chk[i.dataset.it]&&q>0)lines.push({it:i.dataset.it,q:q});});
  if(!lines.length){toast('선택된 항목이 없습니다');return;}
  var id=uid('od');setF(id,'order',{t:now(),who:CFG.who||'',status:'ready',lines:lines,memo:'',del:false});UI.orderExtra=[];render();showOrderText(id);}
function orderText(id){var ls=fv(id,'lines',[]);var byG={};ls.forEach(function(l){var g=fv(l.it,'grp');(byG[g]=byG[g]||[]).push(l);});var n=0;
  var s='[나라차태권도 분당도장 주문서] '+fmtD(fv(id,'t'))+'\n';
  Object.keys(byG).forEach(function(g){s+='\n■ '+grpName(g)+(fv(g,'sub')?' ('+fv(g,'sub')+')':'')+'\n';byG[g].forEach(function(l){s+=' - '+fv(l.it,'size')+' : '+num(l.q)+grpUnit(g)+'\n';n+=num(l.q);});});
  s+='\n합계 '+n+' · 담당 '+(fv(id,'who')||CFG.who||'')+(fv(id,'memo')?'\n메모: '+fv(id,'memo'):'');return s;}
function showOrderText(id){var t=orderText(id);
  openModal('<div class="mh"><div class="t">주문 문구</div><button class="x" onclick="closeModal()">✕</button></div><pre class="txt" id="otxt">'+esc(t)+'</pre>'
   +'<div class="field" style="margin-top:10px"><label>메모(공급처 전달용)</label><input class="inp" id="omemo" value="'+esc(fv(id,'memo',''))+'" onchange="setF(\''+id+'\',\'order\',{memo:this.value.trim()});document.getElementById(\'otxt\').textContent=orderText(\''+id+'\')"></div>'
   +'<div class="mf"><button class="btn sec" onclick="closeModal()">닫기</button><button class="btn" onclick="copyText(document.getElementById(\'otxt\').textContent)">📋 복사</button></div>');}
function copyText(t){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('복사됨 — 카톡·문자에 붙여넣기');},function(){fallbackCopy(t);});}else fallbackCopy(t);}
function fallbackCopy(t){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('복사됨');}catch(e){toast('복사 실패 — 길게 눌러 복사하세요');}document.body.removeChild(ta);}
function openReceive(id){var ls=fv(id,'lines',[]);var L=locs();
  var h='<div class="mh"><div><div class="t">입고 처리</div><div class="s">실제 들어온 수량을 확인하고 저장하면 재고에 더해집니다</div></div><button class="x" onclick="closeModal()">✕</button></div>';
  h+='<div class="field"><label>넣을 위치</label><select class="inp" id="rloc">'+L.map(function(l){return '<option value="'+l.id+'">'+esc(locName(l.id))+'</option>';}).join('')+'</select></div>';
  h+=ls.map(function(l,i){return '<div class="qrow"><div class="ln">'+esc(itemName(l.it))+'<small>주문 '+num(l.q)+'</small></div><div class="step"><button onclick="stepO(this,-1)">−</button><input type="number" inputmode="numeric" class="rq" data-i="'+i+'" value="'+(l.rq!==undefined?num(l.rq):num(l.q))+'"><button onclick="stepO(this,1)">＋</button></div></div>';}).join('');
  h+='<div class="field" style="margin-top:10px"><label>메모</label><input class="inp" id="rmemo" placeholder="예: 9/20 택배 도착"></div>';
  h+='<div class="mf"><button class="btn sec" onclick="closeModal()">취소</button><button class="btn" style="background:var(--ok);border-color:var(--ok)" onclick="saveReceive(\''+id+'\')">입고 확정</button></div>';openModal(h);}
function saveReceive(id){var ls=fv(id,'lines',[]).map(function(l){return {it:l.it,q:l.q,rq:l.rq};});var loc=document.getElementById('rloc').value;var memo=document.getElementById('rmemo').value.trim();
  [].forEach.call(document.querySelectorAll('.rq'),function(i){ls[num(i.dataset.i)].rq=Math.max(0,Math.round(num(i.value)));});
  var ch=ls.filter(function(l){return l.rq>0;}).map(function(l){return {it:l.it,loc:loc,to:qty(l.it,loc)+l.rq};});
  applyQty(ch,'in',memo||('주문서 '+fmtD(fv(id,'t'))+' 입고'),{ref:id});
  setF(id,'order',{status:'done',doneAt:now(),lines:ls,recvLoc:loc});closeModal();render();toast('입고 완료 — 재고에 반영됨');}

/* 항목 고르기(주문 직접 추가 · 중계 주문 공용) */
var PICK={mode:'',cat:'dobok',g:'',lines:[]};
function openPick(mode,keep){PICK.mode=mode;if(!keep){PICK.lines=[];PICK.g='';}renderPick();}
function renderPick(){
  var gs=groups(PICK.cat);if(!PICK.g||fv(PICK.g,'cat')!==PICK.cat)PICK.g=gs.length?gs[0].id:'';
  var h='<div class="mh"><div><div class="t">'+(PICK.mode==='jg'?'중계도장 주문 접수':'항목 추가')+'</div><div class="s">분류 → 품목군 → 사이즈를 누르면 담깁니다</div></div><button class="x" onclick="closeModal()">✕</button></div>';
  h+='<div class="chips" style="margin-bottom:8px">'+CATS.map(function(c){return '<button class="chip '+(PICK.cat===c.id?'on':'')+'" onclick="PICK.cat=\''+c.id+'\';PICK.g=\'\';renderPick()">'+c.ic+' '+c.name+'</button>';}).join('')+'</div>';
  h+='<select class="inp" onchange="PICK.g=this.value;renderPick()">'+gs.map(function(g){return '<option value="'+g.id+'" '+(PICK.g===g.id?'selected':'')+'>'+esc(grpName(g.id))+(fv(g.id,'sub')?' — '+esc(fv(g.id,'sub')):'')+'</option>';}).join('')+'</select>';
  h+='<div class="chips" style="margin:10px 0">'+(PICK.g?items(PICK.g).map(function(it){return '<button class="chip" onclick="pickAdd(\''+it.id+'\')">'+esc(fv(it.id,'size'))+' <small style="opacity:.6">('+total(it.id)+')</small></button>';}).join(''):'')+'</div>';
  h+='<div class="lines">'+(PICK.lines.length?PICK.lines.map(function(l,i){return '<div class="line"><div class="n">'+esc(itemName(l.it))+' <small style="color:var(--mute)">보유 '+total(l.it)+'</small></div><div class="step" style="transform:scale(.85);transform-origin:right"><button onclick="PICK.lines['+i+'].q=Math.max(1,PICK.lines['+i+'].q-1);renderPick()">−</button><input type="number" inputmode="numeric" value="'+l.q+'" onchange="PICK.lines['+i+'].q=Math.max(1,Math.round(num(this.value)))"><button onclick="PICK.lines['+i+'].q++;renderPick()">＋</button></div><button class="btn xs ghost" onclick="PICK.lines.splice('+i+',1);renderPick()">✕</button></div>';}).join(''):'<div class="note">아직 담긴 항목이 없습니다.</div>')+'</div>';
  if(PICK.mode==='jg')h+='<div class="field"><label>요청자 / 메모</label><input class="inp" id="jgmemo" placeholder="예: 중계 김사범 요청, 9/12 필요"></div>';
  h+='<div class="mf"><button class="btn sec" onclick="closeModal()">취소</button><button class="btn" onclick="pickDone()" '+(PICK.lines.length?'':'disabled')+'>'+(PICK.mode==='jg'?'접수':'담기')+'</button></div>';
  openModal(h);
}
function pickAdd(it){var f=PICK.lines.filter(function(l){return l.it===it;})[0];if(f)f.q++;else PICK.lines.push({it:it,q:1});renderPick();}
function pickDone(){
  if(PICK.mode==='jg'){var memo=(document.getElementById('jgmemo')||{}).value||'';var id=uid('jg');setF(id,'jg',{t:now(),who:CFG.who||'',status:'req',lines:PICK.lines.map(function(l){return {it:l.it,q:l.q};}),memo:memo.trim(),del:false});closeModal();render();toast('중계 주문 접수됨');}
  else{PICK.lines.forEach(function(l){var f=UI.orderExtra.filter(function(x){return x.it===l.it;})[0];if(f)f.q+=l.q;else UI.orderExtra.push({it:l.it,q:l.q});});closeModal();render();}
}

/* ═══════════ 중계 탭 ═══════════ */
function rJg(){
  var h=banner();
  h+='<div class="banner" style="background:#eef1f8;border-color:#d5dcec;color:var(--navy)">🚚 <span class="sp"><b>중계도장</b>은 판매처입니다. 주문이 들어오면 접수하고, 보낼 때 [출고]를 누르면 분당 재고에서 빠지고 판매 기록이 남습니다.</span></div>';
  h+='<div class="toolbar"><button class="btn" onclick="openPick(\'jg\')">＋ 중계 주문 접수</button></div>';
  var js=recsOf('jg').sort(function(a,b){return fv(b.id,'t',0)-fv(a.id,'t',0);});
  var m0=new Date();m0=new Date(m0.getFullYear(),m0.getMonth(),1).getTime();var mn=0,mw=0,tn=0,tw=0;
  js.forEach(function(j){if(fv(j.id,'status')!=='done')return;fv(j.id,'lines',[]).forEach(function(l){var q=num(l.q),p=num(fv(fv(l.it,'grp'),'price',0));tn+=q;tw+=q*p;if(fv(j.id,'doneAt',0)>=m0){mn+=q;mw+=q*p;}});});
  h+='<div class="kpis"><div class="kpi"><div class="v">'+js.filter(function(j){return fv(j.id,'status')==='req';}).length+'</div><div class="l">출고 대기 주문</div></div><div class="kpi"><div class="v">'+mn+'</div><div class="l">이번 달 출고 수량'+(mw?' · '+won(mw):'')+'</div></div><div class="kpi"><div class="v">'+tn+'</div><div class="l">누적 출고 수량'+(tw?' · '+won(tw):'')+'</div></div></div>';
  h+='<div class="olist">';
  if(!js.length)h+='<div class="empty">중계 주문이 없습니다.</div>';
  js.forEach(function(j){var st=fv(j.id,'status');var ls=fv(j.id,'lines',[]);var n=0,w=0;ls.forEach(function(l){n+=num(l.q);w+=num(l.q)*num(fv(fv(l.it,'grp'),'price',0));});
    h+='<div class="card"><div class="bd"><div class="oc"><span class="dt">'+fmtD(fv(j.id,'t'))+'</span>'+(st==='done'?'<span class="tag ok">출고 완료 '+fmtD(fv(j.id,'doneAt'))+'</span>':'<span class="tag warn">출고 대기</span>')+'<span class="wh">'+esc(fv(j.id,'who',''))+' · 총 '+n+(w?' · '+won(w):'')+'</span></div>';
    h+=orderLinesHtml(ls);
    if(fv(j.id,'memo'))h+='<div class="note">'+esc(fv(j.id,'memo'))+'</div>';
    h+='<div class="acts"><button class="btn xs sec" onclick="copyText(jgText(\''+j.id+'\'))">📋 문구 복사</button>';
    if(st==='req')h+='<button class="btn xs" onclick="openShip(\''+j.id+'\')">🚚 출고 처리</button><button class="btn xs ghost" onclick="if(confirm(\'이 접수를 삭제할까요?\')){setF(\''+j.id+'\',\'jg\',{del:true});render();}">삭제</button>';
    h+='</div></div></div>';});
  return h+'</div>';
}
function jgText(id){var ls=fv(id,'lines',[]);var s='[나라차 분당 → 중계도장 '+(fv(id,'status')==='done'?'출고':'주문')+'] '+fmtD(fv(id,'t'))+'\n';var n=0,w=0;
  ls.forEach(function(l){var g=fv(l.it,'grp'),p=num(fv(g,'price',0));s+=' - '+itemName(l.it)+' : '+num(l.q)+grpUnit(g)+(p?' ('+won(p*num(l.q))+')':'')+'\n';n+=num(l.q);w+=p*num(l.q);});
  s+='합계 '+n+(w?' · '+won(w):'')+(fv(id,'memo')?'\n'+fv(id,'memo'):'');return s;}
function openShip(id){var ls=fv(id,'lines',[]);var L=locs();
  var h='<div class="mh"><div><div class="t">중계 출고</div><div class="s">어느 위치 재고에서 뺄지 고르세요</div></div><button class="x" onclick="closeModal()">✕</button></div>';
  h+='<div class="field"><label>출고 위치(재고에서 빠지는 곳)</label><select class="inp" id="sloc" onchange="shipCheck(\''+id+'\')">'+L.map(function(l,i){return '<option value="'+l.id+'" '+(i===0?'selected':'')+'>'+esc(locName(l.id))+'</option>';}).join('')+'</select></div>';
  h+='<div id="shipLines"></div><div class="field" style="margin-top:10px"><label>메모</label><input class="inp" id="smemo" placeholder="예: 9/12 직접 전달"></div>';
  h+='<div class="mf"><button class="btn sec" onclick="closeModal()">취소</button><button class="btn" onclick="saveShip(\''+id+'\')">출고 확정</button></div>';openModal(h);shipCheck(id);}
function shipCheck(id){var loc=document.getElementById('sloc').value;var ls=fv(id,'lines',[]);
  document.getElementById('shipLines').innerHTML=ls.map(function(l,i){var have=qty(l.it,loc),q=num(l.q);return '<div class="qrow"><div class="ln">'+esc(itemName(l.it))+'<small>'+esc(locName(loc))+' 보유 '+have+(have<q?' <span style="color:var(--red)">부족 '+(q-have)+'</span>':'')+'</small></div><div class="step"><button onclick="stepO(this,-1)">−</button><input type="number" inputmode="numeric" class="sq" data-i="'+i+'" value="'+q+'"><button onclick="stepO(this,1)">＋</button></div></div>';}).join('');}
function saveShip(id){var loc=document.getElementById('sloc').value;var memo=document.getElementById('smemo').value.trim();var ls=fv(id,'lines',[]).map(function(l){return {it:l.it,q:l.q};});
  [].forEach.call(document.querySelectorAll('.sq'),function(i){ls[num(i.dataset.i)].q=Math.max(0,Math.round(num(i.value)));});
  var short=ls.filter(function(l){return qty(l.it,loc)<l.q;});
  if(short.length&&!confirm(short.map(function(l){return itemName(l.it)+' '+qty(l.it,loc)+'→'+l.q;}).join('\n')+'\n\n'+locName(loc)+' 재고보다 많습니다. 재고는 0까지만 줄어듭니다. 그래도 출고할까요?'))return;
  var ch=ls.filter(function(l){return l.q>0;}).map(function(l){return {it:l.it,loc:loc,to:qty(l.it,loc)-l.q};});
  applyQty(ch,'jg',memo||'중계도장 출고',{ref:id});setF(id,'jg',{status:'done',doneAt:now(),lines:ls,loc:loc});closeModal();render();toast('출고 완료 — 재고에서 차감됨');}

function rLog(){
  var h=banner();
  var ts=[['','전체'],['sale','판매'],['in','입고'],['jg','중계출고'],['adj','조정'],['move','이동'],['count','실사'],['undo','되돌림'],['seed','초기값']];
  h+='<div class="toolbar"><div class="chips">'+ts.map(function(t){return '<button class="chip '+(UI.logF===t[0]?'on':'')+'" onclick="UI.logF=\''+t[0]+'\';UI.logN=80;render()">'+t[1]+'</button>';}).join('')+'</div><span class="sp"></span><button class="btn sm sec" onclick="dlCsv(\'log\')">⬇ 이력 CSV</button></div>';
  var ls=recsOf('log').filter(function(r){return !UI.logF||fv(r.id,'type')===UI.logF;}).sort(function(a,b){return fv(b.id,'t',0)-fv(a.id,'t',0);});
  h+='<div class="card"><div class="bd" style="padding-top:2px">';
  if(!ls.length)h+='<div class="empty">기록이 없습니다.</div>';
  ls.slice(0,UI.logN).forEach(function(r){var id=r.id,ty=fv(id,'type'),rv=fv(id,'reverted',false);
    h+='<div class="log '+(rv?'rv':'')+'"><div class="h"><span class="tag '+({sale:'red',in:'ok',jg:'red',count:'warn',undo:'gray',seed:'gray'}[ty]||'')+'">'+(LOGTYPES[ty]||ty)+'</span><b>'+fmtT(fv(id,'t'))+'</b><span>'+esc(fv(id,'who',''))+'</span>'
      +(ty!=='undo'&&ty!=='seed'&&!rv?'<button class="btn xs ghost" style="margin-left:auto" onclick="undoLog(\''+id+'\')">되돌리기</button>':'')+'</div><div class="b">';
    var lines=fv(id,'lines',[]);var sh=lines.slice(0,12);
    h+=sh.map(function(l){return '<div>'+esc(itemName(l.it))+' · '+esc(locName(l.loc))+' <b style="color:'+(l.d>0?'var(--ok)':'var(--red)')+'">'+(l.d>0?'+':'')+l.d+'</b> <span style="color:var(--mute)">('+l.from+'→'+l.to+')</span></div>';}).join('');
    if(lines.length>12)h+='<div class="note">외 '+(lines.length-12)+'건</div>';
    h+='</div>'+(fv(id,'memo')?'<div class="m">'+esc(fv(id,'memo'))+'</div>':'')+'</div>';});
  if(ls.length>UI.logN)h+='<div style="text-align:center;padding:10px"><button class="btn sm sec" onclick="UI.logN+=100;render()">더 보기 ('+(ls.length-UI.logN)+'건 남음)</button></div>';
  return h+'</div></div>';
}
function undoLog(id){var lines=fv(id,'lines',[]);if(!confirm('이 기록의 수량 변화('+lines.length+'칸)를 반대로 적용해 되돌릴까요?'))return;
  var ch=lines.map(function(l){return {it:l.it,loc:l.loc,to:qty(l.it,l.loc)-l.d};});applyQty(ch,'undo','되돌림: '+(LOGTYPES[fv(id,'type')]||'')+' '+fmtT(fv(id,'t')),{ref:id});setF(id,'log',{reverted:true});render();toast('되돌렸습니다');}

function mv(id,d,kind){var arr=(kind==='loc'?locs(true):groups(fv(id,'cat'),true));var i=arr.map(function(r){return r.id;}).indexOf(id);var j=i+d;if(j<0||j>=arr.length)return;
  arr.forEach(function(r,k){var s=(k+1)*10;if(k===i)s=(j+1)*10;else if(k===j)s=(i+1)*10;setF(r.id,kind,{seq:s});});render();}
function renameRec(id,kind){var n=prompt('새 이름',fv(id,'name',''));if(n==null)return;n=n.trim();if(!n)return;setF(id,kind,{name:n});render();}
function toggleDel(id,kind){var a=alive(id);if(a&&!confirm('「'+fv(id,'name')+'」을 숨길까요?'))return;setF(id,kind,{del:a});render();}
function addLoc(){var n=document.getElementById('nloc').value.trim();if(!n)return;setF(uid('loc'),'loc',{name:n,seq:(locs(true).length+1)*10,del:false});render();}
async function testConn(){CFG.url=document.getElementById('surl').value.trim();CFG.key=document.getElementById('skey').value.trim();saveCfg();
  if(!CFG.url||!CFG.key){toast('주소와 접속키를 모두 넣어 주세요');return;}
  try{var res=await fetch(CFG.url+(CFG.url.indexOf('?')>0?'&':'?')+'key='+encodeURIComponent(CFG.key)+'&rev='+DB.rev+'&ping=1&_='+now(),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);var j=parseResp(await res.text());toast('연결 성공 (서버 rev '+j.rev+')');sync();}
  catch(e){toast('연결 실패: '+(e.message||e));}}
function csvDl(name,rows){var s='﻿'+rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',');}).join('\r\n');dlBlob(name,s,'text/csv');}
function dlBlob(name,s,type){var b=new Blob([s],{type:type+';charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);}
function dlCsv(kind){var d=fmtD(now());
  if(kind==='stock'){var L=locs();var rows=[['분류','품목군','설명','사이즈','기준수량'].concat(L.map(function(l){return locName(l.id);})).concat(['합계','부족'])];
    CATS.forEach(function(c){groups(c.id).forEach(function(g){items(g.id).forEach(function(it){rows.push([c.name,grpName(g.id),fv(g.id,'sub',''),fv(it.id,'size'),base(it.id)||''].concat(L.map(function(l){return qty(it.id,l.id);})).concat([total(it.id),lack(it.id)||'']));});});});
    csvDl('나라차_재고표_'+d+'.csv',rows);}
  else{var rows2=[['일시','기록자','종류','품목','사이즈','위치','증감','전','후','메모']];
    recsOf('log').sort(function(a,b){return fv(b.id,'t',0)-fv(a.id,'t',0);}).forEach(function(r){var ls=fv(r.id,'lines',[]);if(!ls.length)rows2.push([fmtT(fv(r.id,'t')),fv(r.id,'who',''),LOGTYPES[fv(r.id,'type')]||'','','','','','','',fv(r.id,'memo','')]);
      ls.forEach(function(l){rows2.push([fmtT(fv(r.id,'t')),fv(r.id,'who',''),LOGTYPES[fv(r.id,'type')]||'',grpName(fv(l.it,'grp')),fv(l.it,'size'),locName(l.loc),l.d,l.from,l.to,fv(r.id,'memo','')]);});});
    csvDl('나라차_물품이력_'+d+'.csv',rows2);}
}
function dlJson(){dlBlob('나라차_물품백업_'+fmtD(now())+'.json',JSON.stringify({app:'naracha-stock',ver:APP_VER,t:now(),rev:DB.rev,recs:DB.recs}),'application/json');}
function upJson(inp){var f=inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var j=JSON.parse(rd.result);if(!j||j.app!=='naracha-stock'||!j.recs)throw new Error('물품관리 백업 파일이 아닙니다');var n=0;for(var id in j.recs){if(mergeRec(j.recs[id])){n++;DIRTY[id]=now();}}saveLocal();schedulePush();render();toast(n+'개 레코드 병합됨');}catch(e){toast('불러오기 실패: '+e.message);}};rd.readAsText(f);inp.value='';}
function wipeLocal(){if(!confirm('이 기기에 저장된 물품 데이터를 지웁니다. 시트 연결이 없으면 복구할 수 없습니다. 계속할까요?'))return;if(!confirm('정말 지울까요?'))return;localStorage.removeItem(LS_DB);localStorage.removeItem(LS_DIRTY);localStorage.removeItem(LS_UI);location.reload();}

function seedData(onlyMissing){
  var T=SEED_T, added=0, lines=[];
  SEED.locs.forEach(function(l,i){if(setF('loc_'+l[0],'loc',{name:l[1],seq:(i+1)*10,del:false},T))added++;});
  var seqByCat={};
  SEED.groups.forEach(function(g){var cat=g[0],key=g[1],gid='g_'+key;seqByCat[cat]=(seqByCat[cat]||0)+10;
    if(setF(gid,'grp',{cat:cat,name:g[2],sub:g[3],seq:seqByCat[cat],unit:'',price:SEED.prices[key]||0,del:false},T))added++;
    g[4].forEach(function(s){var sz=String(s[0]),it='it_'+key+'_'+sz;
      if(setF(it,'item',{grp:gid,size:sz,seq:sizeNum(sz),base:s[1]||0,del:false},T))added++;
      var q={};var has=false;for(var l in s[2]){q['loc_'+l]=s[2][l];has=true;}
      if(has){var before=DB.recs['q_'+it];if(setF('q_'+it,'qty',q,T)){added++;if(!before)for(var l2 in s[2])lines.push({it:it,loc:'loc_'+l2,d:s[2][l2],from:0,to:s[2][l2]});}}
    });});
  if(lines.length){var id='lg_seed_'+T; if(!DB.recs[id])setF(id,'log',{t:T,who:'',type:'seed',lines:lines,memo:'엑셀 「도복수량_띠수량 파악」 초기값 (도복 2026-06-15 · 띠 2024-01-16 · 티셔츠 2024-03-22 기준 — 실사로 갱신 필요)'},T);}
  if(onlyMissing)toast(added?added+'개 항목 채움':'채울 빈 항목이 없습니다');
  return added;
}

/* ─────────── 시작 ─────────── */
async function boot(){
  loadLocal(); render();
  if(!Object.keys(DB.recs).length){
    if(CFG.url&&CFG.key){ try{ setState('busy'); await pull(); }catch(e){ setState('err',e.message||String(e)); } }
    if(!Object.keys(DB.recs).length){ seedData(false); toast('엑셀 초기값을 넣었습니다 — 실사로 갱신해 주세요'); }
    render();
  }
  if(!CFG.who){ var n=prompt('이 기기에서 기록하는 분의 이름을 넣어 주세요 (이력에 남습니다)','');if(n&&n.trim()){CFG.who=n.trim();saveCfg();render();} }
  sync();
}
boot();
