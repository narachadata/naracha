<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>나라차X클래식리더 방학캠프 — 학부모 조회</title>
<meta name="theme-color" content="#16273F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="방학캠프 조회">
<meta name="description" content="나라차태권도 X 클래식리더영어도서관 방학캠프 학부모 조회">
<!-- 글꼴은 화면을 막지 않도록 나중에 불러옵니다 (느린 통신·카톡 브라우저 대응) -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<!-- 인성 교육 문구에만 쓰는 손글씨 글꼴 (동화책 느낌) -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
<style>
:root{
  --ink:#141E2B; --ink2:#4C5866; --ink3:#77828E; --ink4:#AEB5BE;
  --paper:#F5F3EE; --card:#FFFFFF; --line:#E7E2D9; --line2:#F0ECE4;
  --dojang:#B5343F; --navy:#16273F;
  --t-att:#2F4A6B; --t-bus:#1F6F73; --t-meal:#B07A1E; --t-eng:#2E6B4F; --t-pe:#B5343F;
  --ok:#1E7B3C; --okBg:#EAF5EE; --no:#B5343F; --noBg:#FBEDEE;
  --wait:#8A6A1F; --waitBg:#FBF4E3; --idle:#F2EFE9;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  padding-bottom:56px;
}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}

/* ══ 머리말 ══ */
.belt{display:flex;height:6px}
.belt i{flex:1}
.belt i:first-child{background:var(--dojang)}
.belt i:last-child{background:var(--navy)}
.hd{background:var(--navy);color:#fff;padding:18px 18px 20px}
.hd .brand{font-size:12px;font-weight:700;letter-spacing:.05em;color:#9AA7BC}
.hd .brand b{color:#fff;font-weight:800}
.hd .brand em{color:#E4636E;font-style:normal;font-weight:800;margin:0 3px}
.hd .ttl{font-size:22px;font-weight:800;letter-spacing:-.035em;margin-top:6px}
.hd .sub{font-size:13px;color:#8D9AB0;margin-top:5px;letter-spacing:-.01em}

.wrap{max-width:560px;margin:0 auto;padding:16px 14px 0}

/* ══ 카드 — 색 띠를 두른 책등 + 색인 탭 ══ */
.card{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:16px;margin-bottom:14px;overflow:hidden;
  box-shadow:0 1px 2px rgba(22,39,63,.05),0 8px 22px rgba(22,39,63,.05);
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--tape,var(--line))}
.card-hd{display:flex;align-items:center;gap:10px;padding:16px 17px 0 21px;flex-wrap:wrap}
.eyebrow{
  font-size:11.5px;font-weight:800;letter-spacing:.14em;color:#fff;
  background:var(--tape,var(--ink3));border-radius:8px;padding:5px 9px 5px 11px;flex:0 0 auto;
}
.card-hd h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.035em;flex:0 0 auto}
.card-hd .when{
  margin-left:auto;font-size:12.5px;font-weight:700;color:var(--ink2);
  background:var(--idle);border-radius:99px;padding:5px 11px;
}
.card-bd{padding:13px 17px 17px 21px}
.note{
  font-size:13.5px;line-height:1.8;color:var(--ink2);
  border-top:1px solid var(--line2);margin-top:14px;padding-top:12px;
}
.note b{color:var(--ink)}

/* ══ 로그인 ══ */
.login{padding:22px 19px 19px}
.login h2{margin:0 0 5px;font-size:20px;font-weight:800;letter-spacing:-.035em}
.login p{margin:0 0 18px;font-size:14px;line-height:1.8;color:var(--ink2)}
.lab{display:block;font-size:12px;font-weight:800;letter-spacing:.13em;color:var(--ink3);margin-bottom:8px}
.code-in{
  width:100%;padding:17px 12px;border:1.5px solid var(--line);border-radius:13px;
  background:#FCFBF9;font-family:inherit;font-size:24px;font-weight:800;
  letter-spacing:.34em;text-align:center;text-transform:uppercase;color:var(--ink);
}
.code-in::placeholder{color:var(--ink4);letter-spacing:.2em;font-weight:600}
.code-in:focus{outline:none;border-color:var(--navy);background:#fff;box-shadow:0 0 0 4px rgba(22,39,63,.08)}
.btn{
  width:100%;padding:16px;border:none;border-radius:13px;background:var(--navy);color:#fff;
  font-size:16px;font-weight:800;letter-spacing:-.02em;transition:transform .12s,opacity .12s;
}
.btn:active{transform:scale(.985);opacity:.9}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);font-size:14.5px;font-weight:700;padding:13px}
.hint{font-size:13px;line-height:1.75;color:var(--ink3);margin-top:10px}
.msg{display:none;font-size:14px;line-height:1.75;margin-top:13px;padding:13px 15px;border-radius:12px}
.msg.err{display:block;background:var(--noBg);color:var(--no);font-weight:600}
.msg.info{display:block;background:#EEF2F8;color:var(--navy);font-weight:600}

/* ══ 형제 탭 ══ */
.kids{display:flex;gap:7px;margin-bottom:13px;overflow-x:auto;padding-bottom:2px}
.kids button{
  flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:99px;
  padding:10px 18px;font-size:15px;font-weight:800;color:var(--ink2);letter-spacing:-.02em;
}
.kids button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.kids button i{display:block;font-size:11px;font-style:normal;opacity:.75;margin-top:2px;font-weight:600}

/* ══ 오늘 — 첫 화면의 결론 ══ */
.hero{
  position:relative;background:var(--navy);color:#fff;border-radius:16px;
  padding:19px 18px 18px 24px;margin-bottom:14px;overflow:hidden;
}
.hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--dojang)}
.hero::after{
  content:"";position:absolute;right:-34px;top:-34px;width:140px;height:140px;
  border-radius:50%;background:rgba(255,255,255,.04);
}
.hero .nm{font-size:28px;font-weight:800;letter-spacing:-.045em;line-height:1.12}
.hero .meta{font-size:13.5px;color:#98A5BA;margin-top:5px;letter-spacing:-.01em}
.hero .st{
  position:relative;display:flex;align-items:center;gap:10px;margin-top:15px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);
  border-radius:13px;padding:13px 15px;
}
.hero .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.hero .stx{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.hero .stx small{display:block;font-size:12.5px;font-weight:500;color:#98A5BA;margin-top:3px;letter-spacing:0}

/* ══ 날짜 선택 ══ */
.datebar{display:flex;align-items:stretch;gap:8px;margin-bottom:13px}
.datebar button{
  width:48px;background:#fff;border:1px solid var(--line);border-radius:13px;
  font-size:20px;color:var(--ink2);font-weight:700;
}
.datebar button:disabled{opacity:.3}
.datebar .mid{
  flex:1;background:#fff;border:1px solid var(--line);border-radius:13px;
  padding:11px;text-align:center;
}
.datebar .d1{font-size:17px;font-weight:800;letter-spacing:-.03em}
.datebar .d2{font-size:11.5px;font-weight:700;letter-spacing:.09em;color:var(--ink3);margin-top:3px}
.datebar .d2.today{color:var(--dojang)}

/* ══ 출석 ══ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line2);
       border-radius:13px;overflow:hidden;margin-bottom:15px}
.stat{background:#fff;padding:13px 4px;text-align:center}
.stat .n{font-size:25px;font-weight:800;letter-spacing:-.04em;line-height:1}
.stat .l{font-size:12px;font-weight:700;color:var(--ink3);margin-top:5px}
.stat.a .n{color:var(--ok)} .stat.b .n{color:var(--no)} .stat.c .n{color:var(--t-att)}

.calhd{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}
.calhd span{text-align:center;font-size:11.5px;font-weight:800;color:var(--ink3);letter-spacing:.08em}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cal .c{border-radius:10px;padding:9px 2px 8px;text-align:center;background:#FBFAF8;border:1px solid var(--line2)}
.cal .c .d{font-size:14px;font-weight:800;letter-spacing:-.03em;color:var(--ink2)}
.cal .c .s{font-size:11px;font-weight:800;margin-top:3px;color:var(--ink4)}
.cal .c.pad{background:transparent;border-color:transparent}
.cal .c.on{background:var(--okBg);border-color:#BFE0CB}
.cal .c.on .d{color:#155F2E} .cal .c.on .s{color:var(--ok)}
.cal .c.no{background:var(--noBg);border-color:#EFC9CD}
.cal .c.no .d{color:#8E2A33} .cal .c.no .s{color:var(--no)}
.cal .c.will{background:#fff;border-color:var(--line)}
.cal .c.will .s{color:var(--t-att)}
.cal .c.off{opacity:.5}
.cal .c.hol{background:#F1EEE8}
.cal .c.mk{box-shadow:inset 0 0 0 2px var(--wait)}
.cal .c.tod{box-shadow:0 0 0 2px var(--navy)}
.cal .c.mk.tod{box-shadow:inset 0 0 0 2px var(--wait),0 0 0 2px var(--navy)}
.legend{display:flex;flex-wrap:wrap;gap:11px;margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips b{background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 12px;
         font-size:13.5px;font-weight:700;color:var(--ink2)}
.chips b.mk{border-color:var(--wait);background:var(--waitBg);color:var(--wait)}
.callout{border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.75;margin-top:13px}
.callout.warn{background:var(--noBg);color:#8E2A33}
.callout.wait{background:var(--waitBg);color:var(--wait)}
.callout b{font-weight:800}

/* ══ 차량 ══ */
.ride{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line2)}
.ride:last-of-type{border-bottom:none}
.ride .ic{width:46px;height:46px;border-radius:13px;flex:0 0 auto;display:flex;
          align-items:center;justify-content:center;font-size:21px}
.ride .ic.go{background:#E9F1F1} .ride .ic.back{background:var(--okBg)} .ride .ic.off{background:var(--idle)}
.ride .tm{font-size:26px;font-weight:800;letter-spacing:-.045em;line-height:1.1}
.ride .kind{font-size:12px;font-weight:800;letter-spacing:.07em;margin-left:8px}
.ride .pl{font-size:14.5px;color:var(--ink2);margin-top:4px;line-height:1.5}
.ride.dim .tm{font-size:16px;color:var(--ink3)}
.stoplist{margin-top:14px;border-top:1px solid var(--line2);padding-top:13px}
.stoplist .t{font-size:12px;font-weight:800;letter-spacing:.11em;color:var(--ink3);margin-bottom:9px}
.stop{display:flex;gap:12px;align-items:baseline;padding:7px 9px;border-radius:9px}
.stop.now{background:var(--okBg)}
.stop .tt{font-size:15.5px;font-weight:800;width:56px;flex:0 0 auto;letter-spacing:-.03em}
.stop .pp{font-size:14.5px;color:var(--ink2);line-height:1.55}
.stop .tag{font-size:11px;font-weight:800;background:var(--ok);color:#fff;border-radius:99px;padding:2px 8px;margin-left:6px}

/* ══ 식단 ══ */
.menu{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.menu:last-of-type{border-bottom:none}
.menu .k{font-size:12.5px;font-weight:800;letter-spacing:.02em;color:var(--ink3);
         flex:0 0 auto;min-width:104px;white-space:nowrap;padding-top:3px}
.menu .v{font-size:16.5px;font-weight:700;letter-spacing:-.025em;line-height:1.5}
.menu .kc{font-size:12.5px;font-weight:700;color:var(--t-meal);margin-left:8px;white-space:nowrap}
.kcsum{display:flex;justify-content:space-between;align-items:baseline;margin-top:13px;
       padding-top:12px;border-top:1px solid var(--line2)}
.kcsum .a{font-size:13px;font-weight:700;color:var(--ink3)}
.kcsum .b{font-size:18px;font-weight:800;color:var(--t-meal);letter-spacing:-.03em}

/* ══ 특식 ══ */
.sp{
  background:linear-gradient(135deg,#FFF6E3 0%,#FDF0D5 100%);
  border:1.5px solid #E8C87A;border-radius:14px;padding:18px 18px 19px;text-align:center;
}
.sp .t{font-size:12px;font-weight:800;letter-spacing:.13em;color:#9A7318}
.sp .v{font-size:22px;font-weight:800;letter-spacing:-.035em;color:#6B4E0C;margin-top:7px;
       line-height:1.4;word-break:keep-all}

/* ══ 영어 ══ */
.level{background:#EFF5F1;border-radius:14px;padding:17px 18px;position:relative;overflow:hidden}
.level .v{font-size:34px;font-weight:800;letter-spacing:-.05em;color:var(--t-eng);line-height:1}
.level .c{font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.65}
.level .tape{position:absolute;right:0;top:0;bottom:0;width:8px;background:var(--t-eng);opacity:.55}
.pane{border-radius:13px;padding:14px 16px;margin-top:11px}
.pane .t{font-size:12px;font-weight:800;letter-spacing:.11em;margin-bottom:7px}
.pane .c{font-size:15px;line-height:1.85;white-space:pre-wrap}
.pane.an{background:var(--waitBg)} .pane.an .t{color:var(--wait)}
.pane.gd{background:var(--okBg)} .pane.gd .t{color:var(--ok)}
.pane.pe{background:#EEF2F8} .pane.pe .t{color:var(--t-att)}
.lvlog{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;border-top:1px dashed var(--line)}
.lvimg{width:100%;border-radius:13px;border:1px solid var(--line);margin-top:12px;cursor:zoom-in}
.cap{font-size:12.5px;color:var(--ink3);text-align:center;margin-top:7px}
.srnote{background:#FAF8F4;border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-top:13px}
.srnote .t{font-size:12px;font-weight:800;letter-spacing:.11em;color:var(--ink3);margin-bottom:9px}
.srnote ul{margin:0;padding-left:17px}
.srnote li{font-size:13.5px;line-height:1.85;color:var(--ink2)}
.srnote li b{color:var(--ink)}
.srnote .more{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
              font-size:13.5px;line-height:1.8;color:var(--ink2)}

/* ══ 공통 ══ */
.empty{text-align:center;color:var(--ink3);font-size:14.5px;line-height:1.8;padding:22px 10px}
.empty .big{font-size:30px;margin-bottom:8px}
details{margin-top:11px}
summary{font-size:13.5px;font-weight:700;color:var(--tape,var(--ink2));cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"＋ ";font-weight:800}
details[open] summary::before{content:"－ "}
/* ══ 인성 교육 — 동화책 한 쪽처럼 ══ */
.story-card{background:#FCFAF4}
.blob{
  position:relative;background:#E6F0DE;margin:2px 0 0;padding:28px 22px 22px;
  border-radius:52% 48% 46% 54% / 9% 8% 10% 9%;
}
.blob::before,.blob::after{
  content:"";position:absolute;top:-5px;width:9px;height:9px;border-radius:50%;
  background:#BFD6B2;box-shadow:0 -6px 0 -2px #BFD6B2;
}
.blob::before{left:24px} .blob::after{left:44px;top:-1px}
.blob .ko{
  font-family:'Gaegu','Pretendard',sans-serif;
  font-size:23px;line-height:1.72;font-weight:700;color:#243024;letter-spacing:.005em;
  word-break:keep-all;
}
.blob .en{
  font-family:'Gaegu','Pretendard',sans-serif;
  font-size:16.5px;line-height:1.65;color:#C4573C;margin-top:14px;letter-spacing:.02em;
}
.blob .who{
  text-align:right;font-family:'Gaegu','Pretendard',sans-serif;
  font-size:16px;font-weight:700;color:#4A5A46;margin-top:12px;
}
.talk{
  background:#fff;border:1px dashed #D9CFBB;border-radius:14px;padding:15px 17px;margin-top:15px;
}
.talk .t{font-size:12px;font-weight:800;letter-spacing:.11em;color:#A08A5F;margin-bottom:8px}
.talk .c{font-size:15px;line-height:1.9;color:var(--ink2);white-space:pre-wrap}
.shelf{margin-top:16px;border-top:1px solid var(--line2);padding-top:13px}
.shelfT{font-size:11.5px;font-weight:800;letter-spacing:.12em;color:#A08A5F;margin-bottom:9px}
.story-item{display:flex;gap:12px;padding:10px 11px;border-radius:12px;cursor:pointer;align-items:flex-start}
.story-item:active{background:#F2F6EE}
.story-item.on{background:#EDF4E8;box-shadow:inset 0 0 0 1.5px #BFD6B2}
.si-d{flex:0 0 auto;width:50px;font-size:14px;font-weight:800;color:#3E5138;letter-spacing:-.03em;padding-top:1px}
.si-d span{display:block;font-size:11px;font-weight:700;color:#9AA894;margin-top:2px}
.si-c{min-width:0}
.si-t{font-size:14px;line-height:1.7;color:var(--ink2);word-break:keep-all}
.story-item.on .si-t{color:var(--ink);font-weight:600}
.si-w{font-size:12.5px;color:#A0A89A;margin-top:3px}
.pelist{display:flex;flex-direction:column;gap:3px}
.pe-day{display:flex;gap:13px;padding:12px 11px;border-radius:11px;align-items:flex-start}
.pe-day.sel{background:#FBF1F2;box-shadow:inset 0 0 0 1px #F0D6D9}
.pe-d{flex:0 0 auto;width:58px;font-size:15px;font-weight:800;letter-spacing:-.03em;color:var(--ink);padding-top:1px}
.pe-d span{display:block;font-size:11.5px;font-weight:700;color:var(--ink3);margin-top:2px}
.pe-d em{display:inline-block;font-style:normal;font-size:10.5px;font-weight:800;color:#fff;
         background:var(--t-pe);border-radius:99px;padding:2px 7px;margin-top:4px}
.pe-c{flex:1;min-width:0}
.pe-line{font-size:15px;line-height:1.75;color:var(--ink2);margin-bottom:4px}
.pe-line:last-child{margin-bottom:0}
.pe-line b{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.04em;
           border-radius:99px;padding:3px 9px;margin-right:8px;vertical-align:1px}
.pe-line b.jump{background:#EEF2F8;color:var(--t-att)}
.pe-line b.gym{background:var(--waitBg);color:var(--wait)}
.log{border-left:2px solid var(--line);padding:2px 0 10px 12px;margin-top:10px}
.log .d{font-size:13.5px;font-weight:800}
.log .c{font-size:13.5px;line-height:1.8;color:var(--ink2);margin-top:4px;white-space:pre-wrap}
.foot{text-align:center;font-size:12.5px;line-height:1.95;color:var(--ink3);margin-top:20px;padding-bottom:10px}
.foot b{color:var(--ink2)}
.spin{text-align:center;padding:48px 20px;color:var(--ink3);font-size:15px}
#newsBar{position:fixed;left:0;right:0;top:0;z-index:950;background:#1E7B3C;color:#fff;
         font-size:13.5px;font-weight:600;text-align:center;padding:11px 12px;letter-spacing:-.01em;
         cursor:pointer;box-shadow:0 3px 12px rgba(0,0,0,.16)}
#newsBar b{font-weight:800;margin-right:6px}
#newsBar .x{display:inline-block;margin-left:9px;font-size:11.5px;font-weight:700;opacity:.75;
            border:1px solid rgba(255,255,255,.5);border-radius:99px;padding:2px 8px}
#busyBar{position:fixed;left:0;right:0;top:0;z-index:900;background:var(--navy);color:#fff;

<body>
<div class="belt"><i></i><i></i></div>
<header class="hd">
  <div class="brand"><b>나라차태권도</b> <em>✕</em> <b>클래식리더영어도서관</b></div>
  <div class="ttl">방학캠프 학부모 조회</div>
  <div class="sub" id="hdSub">우리 아이의 캠프 하루를 확인하세요</div>
</header>
<main class="wrap" id="app"><div class="spin">불러오는 중…</div></main>

<script>
/* ══ 서버 주소 (관리 프로그램과 같은 주소) ══ */
var APP_VER = "v20260729.7"   /* .7: 안내 문자 링크로 자동 로그인 + 버전 갱신 중에도 코드 유지 */;
var GSHEET_URL = "https://script.google.com/macros/s/AKfycbwauy3dqK7YSM892fZ7aVhBaVFQunbvFq8oREPLEwsJN9FbdZHvAkQYovz_QUTSb_KH/exec";

var ST = { data:null, kid:null, idx:0, date:"", loading:false, imgs:null, imgLoading:false, linkCode:"" };
var LS = "naracha_parent_login";
var DOW = ["일","월","화","수","목","금","토"];

function esc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function ymd(d){ var m=d.getMonth()+1, x=d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x; }
function today(){ return ymd(new Date()); }
function fmtD(s){ var d=new Date(s+"T00:00:00");
  return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+DOW[d.getDay()]+")"; }
function shortD(s){ var d=new Date(s+"T00:00:00"); return (d.getMonth()+1)+"/"+d.getDate(); }
function dowOf(s){ return new Date(s+"T00:00:00").getDay(); }

/* ══ 저장·캐시 ══ */
function saved(){ try{ return JSON.parse(localStorage.getItem(LS)||"null"); }catch(e){ return null; } }
/* ══ 자동 로그인 ══════════════════════════════════════════
   안내 문자의 주소 뒤에 코드를 붙여 보내면(…/campparent.html#7KMD3P)
   학부모가 아무것도 입력하지 않아도 바로 열립니다.
   «#» 뒤는 인터넷 서버로 전송되지 않으므로 «?» 보다 안전합니다.
   (혹시 ?code= 형태로 보내진 링크도 함께 받아 줍니다) */
function codeFromUrl(){
  try{
    var v=String(location.hash||"").replace(/^#/,"");
    if(!v){
      var m=String(location.search||"").match(/[?&]code=([^&]+)/i);
      v = m ? decodeURIComponent(m[1]) : "";
    }
    v=v.toUpperCase().replace(/[^A-Z0-9]/g,"");
    return v.length>=4 ? v : "";
  }catch(e){ return ""; }
}
/* 주소창에서 코드를 지웁니다 — 화면을 남에게 보이거나 사진을 찍어도 코드가 남지 않게 */
function wipeUrl(){
  try{ if(history && history.replaceState) history.replaceState(null,"",location.pathname); }catch(e){}
}
function saveLogin(code){ try{ localStorage.setItem(LS, JSON.stringify({code:code})); }catch(e){} }
function cacheKey(code){ return "naracha_pcache_"+code; }
function cacheGet(code){
  try{ var o=JSON.parse(localStorage.getItem(cacheKey(code))||"null");
       return (o && o.j) ? o : null; }catch(e){ return null; }
}
function cacheSet(code,j){
  try{ localStorage.setItem(cacheKey(code), JSON.stringify({ at:Date.now(), j:j })); }catch(e){}
}
function setBusy(on,txt){
  var el=document.getElementById("busyBar");
  if(!el){
    if(!on) return;
    el=document.createElement("div"); el.id="busyBar"; document.body.appendChild(el);
  }
  if(on){ el.textContent=txt||"최신 내용으로 새로 고치는 중…"; el.style.display="block"; }
  else el.style.display="none";
}
function logout(){
  if(!confirm("조회를 마칠까요?")) return;
  try{ localStorage.removeItem(LS); }catch(e){}
  ST.data=null; ST.kid=null; ST.imgs=null; render();
}

/* ══ 조회 ══ */
function doLogin(){
  var c=String((document.getElementById("pCode")||{}).value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(c.length<4){ showMsg("err","캠프에서 안내해 드린 <b>로그인 코드</b>를 넣어 주세요."); return; }
  fetchKid(c,true);
}
function showMsg(kind,txt){
  var m=document.getElementById("pMsg"); if(!m) return;
  m.className="msg "+kind; m.innerHTML=txt;
}
function fetchKid(code,fromForm){
  ST.loading=true; ST.lastFetch=Date.now();
  var prevJ = ST.data || (cacheGet(code)||{}).j || null;
  /* ① 전에 본 내용이 있으면 먼저 보여 드립니다 */
  var cached=cacheGet(code);
  if(cached && !ST.data){
    ST.data=cached.j; ST.idx=0; ST.kid=cached.j.kids[0];
    pickDate(); render();
    setBusy(true,"최신 내용으로 새로 고치는 중…");
  } else if(fromForm){
    showMsg("info","확인 중입니다… 처음 여실 때는 몇 초 걸릴 수 있습니다.");
  }
  /* ② 서버에서 최신 내용 */
  var ctrl = (window.AbortController ? new AbortController() : null);
  var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 25000);
  var opt = { cache:"no-store" };            /* 카톡 브라우저가 옛 내용을 쥐고 있지 않게 */
  if(ctrl) opt.signal = ctrl.signal;
  fetch(GSHEET_URL+"?p=find&code="+encodeURIComponent(code)+"&t="+Date.now(), opt)
    .then(function(r){ clearTimeout(timer); return r.json(); })
    .then(function(j){
      ST.loading=false; setBusy(false);
      if(!j || j.error){
        var t = j&&j.error==="NOTFOUND"
              ? "일치하는 로그인 코드가 없습니다.<br>· 캠프에서 보내 드린 <b>코드 그대로</b> 넣어 주세요.<br>· 코드를 잊으셨다면 캠프 카카오톡으로 문의해 주세요."
              : j&&j.error==="NODATA" ? "아직 캠프 자료가 준비되지 않았습니다. 잠시 후 다시 확인해 주세요."
              : j&&j.error==="BAD" ? "로그인 코드를 다시 확인해 주세요."
              : "잠시 후 다시 시도해 주세요.";
        if(fromForm){ showMsg("err",t); }
        else {
          /* 저장해 둔 코드로 자동 조회하다 실패했을 때만 저장을 지웁니다.
             링크로 들어온 코드가 틀렸다고 기존 로그인까지 지우면 안 됩니다. */
          var sv=saved();
          if(sv && sv.code===code){ try{ localStorage.removeItem(LS); }catch(e){} }
          render(); showMsg("err",t);   /* 코드가 채워진 로그인 화면 + 안내 */
        }
        return;
      }
      /* 무엇이 새로 올라왔는지 견주어 봅니다 */
      var news = whatsNew(prevJ, j);
      var same = prevJ && JSON.stringify(prevJ)===JSON.stringify(j);

      var keep = (!fromForm && ST.kid) ? ST.idx : 0;
      ST.data=j;
      ST.idx = (j.kids && j.kids[keep]) ? keep : 0;
      ST.kid = j.kids[ST.idx];
      saveLogin(code); cacheSet(code,j);
      if(!ST.date || (j.camp.dates||[]).indexOf(ST.date)<0) pickDate();

      if(same) return;                       /* 달라진 게 없으면 화면을 건드리지 않습니다 */
      var sy = window.scrollY||0;
      render();
      if(!fromForm) window.scrollTo(0,sy);   /* 읽던 자리를 지켜 드립니다 */
      showNews(news);
    })
    .catch(function(){
      clearTimeout(timer);
      ST.loading=false; setBusy(false);
      if(ST.data) return;
      if(fromForm) showMsg("err","연결이 느리거나 끊겼습니다.<br>잠시 후 <b>확인하기</b>를 다시 눌러 주세요.");
      else {
        render();
        if(ST.linkCode) showMsg("err","연결이 느리거나 끊겼습니다.<br>코드를 미리 넣어 두었으니 <b>확인하기</b>를 눌러 주세요.");
      }
    });
}
function loadImgs(){
  var sv=saved(); if(!sv || !sv.code) return;
  ST.imgLoading=true; render();
  setBusy(true,"결과지를 불러오는 중…");
  fetch(GSHEET_URL+"?p=img&code="+encodeURIComponent(sv.code))
    .then(function(r){ return r.json(); })
    .then(function(j){ ST.imgLoading=false; setBusy(false);
      if(j && j.ok){ ST.imgs=j.imgs||{}; render(); } })
    .catch(function(){ ST.imgLoading=false; setBusy(false); render(); });
}
/* 지난번 자료와 견주어 새로 올라온 것 추리기 */
function whatsNew(a,b){
  if(!a||!b) return [];
  var out=[], cnt=function(o){ return o?Object.keys(o).length:0; }, d;
  d=cnt(b.charLog)-cnt(a.charLog); if(d>0) out.push("인성 교육 "+d+"편");
  d=cnt(b.peLog)-cnt(a.peLog);     if(d>0) out.push("체육 활동 "+d+"일");
  d=cnt(b.meals)-cnt(a.meals);     if(d>0) out.push("식단 "+d+"일");
  var ka=a.kids||[], att=0, eng=0, bus=0;
  (b.kids||[]).forEach(function(k){
    var o=null; ka.forEach(function(x){ if(x.n===k.n) o=x; });
    if(!o) return;
    var oa=o.att||{}, na=k.att||{};
    Object.keys(na).forEach(function(x){ if(oa[x]!==na[x]) att++; });
    if((o.lv||"")!==(k.lv||"")||(o.an||"")!==(k.an||"")||
       (o.gd||"")!==(k.gd||"")||(o.pub||"")!==(k.pub||"")) eng++;
    ["bus","pick","skip","skipAll"].forEach(function(f){
      if(JSON.stringify(o[f]||{})!==JSON.stringify(k[f]||{})) bus++;
    });
  });
  if(att) out.push("출결 "+att+"건");
  if(eng) out.push("영어 지도 내용");
  if(bus) out.push("차량 안내");
  return out;
}
/* 새 소식 띠 — 눌러서 닫습니다 */
function showNews(list){
  if(!list||!list.length) return;
  var el=document.getElementById("newsBar");
  if(!el){
    el=document.createElement("div"); el.id="newsBar";
    el.onclick=function(){ el.style.display="none"; };
    document.body.appendChild(el);
  }
  el.innerHTML='<b>새로 올라왔습니다</b> '+esc(list.join(" · "))+
               '<span class="x">닫기</span>';
  el.style.display="block";
  clearTimeout(showNews._t);
  showNews._t=setTimeout(function(){ el.style.display="none"; }, 9000);
}
/* 저절로 새로 고치기 — 화면을 다시 볼 때·열어 둔 채로 3분마다 */
function autoRefresh(force){
  var s=saved(); if(!s||!s.code) return;
  if(ST.loading) return;
  if(!force && Date.now()-(ST.lastFetch||0) < 30000) return;
  fetchKid(s.code,false);
}
/* 새 화면판이 올라왔으면 조용히 바꿔 답니다 (열자마자 한 번만) */
function checkFileUpdate(){
  if(!/^https?:/.test(location.protocol)) return;
  fetch(location.origin+location.pathname+"?chk="+Date.now(),{cache:"no-store"})
    .then(function(r){ return r.text(); })
    .then(function(t){
      var m=t.match(/APP_VER\s*=\s*"([^"]+)"/);
      if(m && m[1]!==APP_VER){
        /* 새 버전으로 바꿔 여는 중에도 «링크로 받은 로그인 코드»를 잃지 않도록 다시 붙여 줍니다.
           (이게 없으면 새 버전을 받은 그 한 번은 로그인 화면이 떠 버립니다) */
        var keep = ST.linkCode ? ("#"+ST.linkCode) : "";
        location.replace(location.pathname+"?v="+Date.now()+keep);
      }
    }).catch(function(){});
}
function pickDate(){
  var ds=(ST.data.camp.dates)||[]; if(!ds.length) return;
  var t=today();
  if(ds.indexOf(t)>=0){ ST.date=t; return; }
  var next=null;
  for(var i=0;i<ds.length;i++){ if(ds[i]>=t){ next=ds[i]; break; } }
  ST.date = next || ds[ds.length-1];
}
function moveDate(step){
  var ds=ST.data.camp.dates, i=ds.indexOf(ST.date);
  if(i<0) return;
  var j=i+step; if(j<0||j>=ds.length) return;
  ST.date=ds[j]; render();
}
function pickKid(i){
  if(!ST.data || !ST.data.kids[i]) return;
  ST.idx=i; ST.kid=ST.data.kids[i];
  render(); window.scrollTo(0,0);
}
function reload(){
  var s=saved(); if(!s) return;
  document.getElementById("app").innerHTML='<div class="spin">불러오는 중…</div>';
  fetchKid(s.code, false);
}

/* ══ 화면 ══ */
function render(){
  var app=document.getElementById("app"), sub=document.getElementById("hdSub");
  if(!ST.data){
    app.innerHTML=vLogin();
    sub.textContent="우리 아이의 캠프 하루를 확인하세요";
    return;
  }
  sub.textContent=ST.data.camp.name;
  app.innerHTML = vKids()+vHero()+vAtt()+vDate()+vBus()+vMeal()+vEng()+vPe()+vChar()+vHist()+vFoot();
}

function vLogin(){
  return '<div class="card" style="--tape:var(--navy)"><div class="login">'+
    '<h2>우리 아이 조회하기</h2>'+
    '<p>캠프에서 안내해 드린 <b>로그인 코드</b>를 넣어 주세요.<br>'+
    '형제·자매는 한 코드로 함께 보이고, 다음 캠프에도 같은 코드를 쓰십니다.</p>'+
    '<span class="lab">로그인 코드</span>'+
    /* 안내 문자의 링크로 들어오셨다면 코드를 미리 채워 둡니다 — 누르기만 하시면 됩니다 */
    '<input class="code-in" id="pCode" maxlength="10" value="'+esc(ST.linkCode||"")+'" placeholder="7KMD3P" autocomplete="off" '+
      'inputmode="latin" oninput="this.value=this.value.toUpperCase()">'+
    (ST.linkCode
      ? '<div class="hint" style="color:var(--navy);font-weight:700">안내 문자의 코드를 미리 넣어 두었습니다. 아래 <b>확인하기</b>만 눌러 주세요.</div>'
      : '<div class="hint">코드에는 헷갈리는 <b>0 · 1 · I · O · S · B</b> 가 들어가지 않습니다.</div>')+
    '<div style="height:15px"></div>'+
    '<button class="btn" onclick="doLogin()">확인하기</button>'+
    '<div class="msg" id="pMsg"></div>'+
    '</div></div>'+
    '<div class="foot">이 화면은 <b>본인 자녀의 정보만</b> 보여 드립니다.<br>'+
    '문의는 기존에 상담하시던 <b>캠프 카카오톡</b>으로 부탁드립니다.</div>';
}

function vKids(){
  var ks=ST.data.kids||[];
  if(ks.length<2) return "";
  return '<div class="kids">'+ks.map(function(k,i){
    return '<button class="'+(i===ST.idx?"on":"")+'" onclick="pickKid('+i+')">'+esc(k.n)+
           '<i>'+esc(k.cn||k.g||"")+'</i></button>';
  }).join("")+'</div>';
}

/* 오늘 하루의 결론 — 이 앱이 가장 먼저 답해야 할 것 */
function vHero(){
  var k=ST.kid, t=today();
  var isPlan=(k.plan||[]).indexOf(t)>=0 || (k.mk||[]).indexOf(t)>=0;
  var att=(k.att||{})[t];
  var dot="#93A0B6", line="오늘은 캠프에 오지 않는 날입니다", sub="";

  if(isPlan && att===2){ dot="#E0616C"; line="오늘은 결석으로 기록되어 있습니다"; sub="보강은 카카오톡으로 잡아 주세요"; }
  else if(isPlan && att===1){ dot="#5BC47F"; line="오늘 출석했습니다"; sub=fmtD(t); }
  else if(isPlan){
    dot="#7FB2E8"; line="오늘 캠프에 가는 날입니다"; sub=fmtD(t);
    /* 오늘 등원 차량이 있으면 시각·장소까지 한 줄로 */
    var b=(k.bus||{}).go||[], pk=(k.pick||{})[t+"|go"];
    var st=null;
    if(b.length===1) st=b[0];
    else if(pk) b.forEach(function(x){ if(x.k===pk) st=x; });
    if(st && !((k.skipAll||{})[t]) && !((k.skip||{})[t+"|"+st.k]))
      sub=(st.t||"")+" · "+(st.place||"");
  } else {
    var ds=ST.data.camp.dates||[], next=null;
    (k.plan||[]).forEach(function(d){ if(!next && d>=t) next=d; });
    if(next){ line="다음 출석일은 "+fmtD(next)+"입니다"; sub=""; }
    else { dot="#93A0B6"; line="캠프 일정을 모두 마쳤습니다"; sub="함께해 주셔서 감사합니다"; }
  }
  return '<div class="hero">'+
    '<div class="nm">'+esc(k.n)+'</div>'+
    '<div class="meta">'+esc(k.g||"")+(k.cn?' · 반번호 '+esc(k.cn):'')+
      ' · <span style="cursor:pointer;text-decoration:underline" onclick="logout()">나가기</span></div>'+
    '<div class="st"><span class="dot" style="background:'+dot+'"></span>'+
      '<span class="stx">'+esc(line)+(sub?'<small>'+esc(sub)+'</small>':'')+'</span></div>'+
    '</div>';
}

/* ① 출석 현황 */
function vAtt(){
  var k=ST.kid, ds=ST.data.camp.dates, hol=ST.data.hol||{};
  var plan=k.plan||[], att=k.att||{}, mk=k.mk||[];
  var ok=0, ab=0, left=0, t=today(), upcoming=[];
  plan.forEach(function(d){
    if(att[d]===1) ok++;
    else if(att[d]===2) ab++;
    else if(d>=t){ left++; upcoming.push(d); }
  });
  mk.forEach(function(d){ if(d>=t && upcoming.indexOf(d)<0) upcoming.push(d); });
  upcoming.sort();

  var h='<section class="card" style="--tape:var(--t-att)">'+
    '<div class="card-hd"><span class="eyebrow">출결</span><h2>출석 현황</h2>'+
      '<span class="when">전체 '+ds.length+'일 중 '+plan.length+'일</span></div>'+
    '<div class="card-bd">'+
    '<div class="stats">'+
      '<div class="stat"><div class="n">'+plan.length+'</div><div class="l">등록일수</div></div>'+
      '<div class="stat a"><div class="n">'+ok+'</div><div class="l">출석</div></div>'+
      '<div class="stat b"><div class="n">'+ab+'</div><div class="l">결석</div></div>'+
      '<div class="stat c"><div class="n">'+left+'</div><div class="l">남은일수</div></div>'+
    '</div>'+
    '<div class="calhd"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span></div>'+
    '<div class="cal">';

  /* 첫 주 앞부분 비우기 */
  if(ds.length){
    var pad=dowOf(ds[0])-1; if(pad<0) pad=0;
    for(var i=0;i<pad;i++) h+='<div class="c pad"></div>';
  }
  ds.forEach(function(d){
    var isPlan=plan.indexOf(d)>=0, isMk=mk.indexOf(d)>=0, isHol=!!hol[d];
    var cls, s;
    if(isHol){ cls="hol"; s="휴일"; }
    else if(!isPlan && !isMk){ cls="off"; s="—"; }
    else if(att[d]===1){ cls="on"; s="출석"; }
    else if(att[d]===2){ cls="no"; s="결석"; }
    else if(d<t){ cls="will"; s="—"; }
    else { cls="will"; s="예정"; }
    h+='<div class="c '+cls+(isMk?' mk':'')+(d===t?' tod':'')+'"><div class="d">'+shortD(d)+'</div><div class="s">'+s+'</div></div>';
  });
  h+='</div>'+
    '<div class="legend">'+
      '<span><i style="background:var(--okBg);box-shadow:inset 0 0 0 1px #BFE0CB"></i>출석</span>'+
      '<span><i style="background:var(--noBg);box-shadow:inset 0 0 0 1px #EFC9CD"></i>결석</span>'+
      '<span><i style="background:#fff;box-shadow:inset 0 0 0 1px var(--line)"></i>예정</span>'+
      '<span><i style="background:#fff;box-shadow:inset 0 0 0 2px var(--wait)"></i>보강</span>'+
      '<span><i style="background:#fff;box-shadow:0 0 0 2px var(--navy)"></i>오늘</span>'+
    '</div>';

  if(upcoming.length){
    h+='<div style="margin-top:14px"><span class="lab">앞으로 출석하는 날 · '+upcoming.length+'일</span>'+
       '<div class="chips">'+upcoming.map(function(d){
         return '<b class="'+(mk.indexOf(d)>=0?'mk':'')+'">'+shortD(d)+'('+DOW[dowOf(d)]+')'+
                (mk.indexOf(d)>=0?' 보강':'')+'</b>';
       }).join("")+'</div></div>';
  }
  if(ab) h+='<div class="callout warn">결석 <b>'+ab+'일</b>이 있습니다. 캠프 기간 안에는 보강이 가능하니 '+
     '카카오톡으로 날짜를 잡아 주세요.</div>';
  h+='<div class="note">출석일이 실제와 다르면 캠프 카카오톡으로 알려 주세요.</div>'+
    '</div></section>';
  return h;
}

/* ② 우리 아이 차량 */
function vBus(){
  var k=ST.kid, b=k.bus||{go:[],back:[]};
  var go=(b.go||[]), back=(b.back||[]);
  if(!go.length && !back.length) return "";

  var d=ST.date;
  var isPlanDay=(k.plan||[]).indexOf(d)>=0 || (k.mk||[]).indexOf(d)>=0;
  var absent=(k.att||{})[d]===2;
  var skip=k.skip||{}, skipAll=k.skipAll||{}, pick=k.pick||{};

  var pickOne=function(list,key){
    if(!list.length) return { none:true };
    if(list.length===1) return { st:list[0] };
    var want=pick[d+"|"+key];
    if(!want) return { undecided:true };
    var hit=null; list.forEach(function(x){ if(x.k===want) hit=x; });
    return hit ? { st:hit } : { undecided:true };
  };
  var g=pickOne(go,"go"), bk=pickOne(back,"back");
  var offOf=function(r){ return (r&&r.st) ? (!!skipAll[d] || !!skip[d+"|"+r.st.k]) : false; };
  var goOff=offOf(g), backOff=offOf(bk);

  var h='<section class="card" style="--tape:var(--t-bus)">'+
    '<div class="card-hd"><span class="eyebrow">차량</span><h2>우리 아이 차량</h2>'+
      '<span class="when">'+esc(fmtD(d))+'</span></div><div class="card-bd">';

  var why = !isPlanDay ? "이 날은 등원일이 아닙니다"
          : absent ? "결석으로 기록되어 차량에서 빠졌습니다"
          : (skipAll[d] || (goOff && backOff && !g.none && !bk.none)) ? "이 날은 차량을 이용하지 않습니다"
          : "";

  if(why){
    h+='<div class="empty"><div class="big">🚏</div>'+esc(why)+'</div>';
  } else {
    var row=function(r,isGo,off){
      if(r.none) return "";
      if(r.undecided){
        return '<div class="ride dim"><div class="ic off">❓</div><div>'+
          '<div class="tm" style="color:var(--wait)">'+(isGo?"승차":"하차")+' 장소 미정</div>'+
          '<div class="pl">아래 장소 중 한 곳입니다. 캠프 카카오톡으로 확인해 주세요.</div></div></div>';
      }
      if(off){
        return '<div class="ride dim"><div class="ic off">✕</div><div>'+
          '<div class="tm">'+(isGo?"등원":"하원")+' 차량 이용 안 함</div>'+
          '<div class="pl">'+esc(r.st.place||"")+'</div></div></div>';
      }
      var st=r.st, col=isGo?"var(--t-bus)":"var(--ok)";
      return '<div class="ride"><div class="ic '+(isGo?"go":"back")+'">'+(isGo?"🚌":"🏠")+'</div><div>'+
        '<div class="tm">'+esc(st.t||"시간 미정")+
          '<span class="kind" style="color:'+col+'">'+(isGo?"등원 승차":"하원 하차")+'</span></div>'+
        '<div class="pl">'+esc(st.place||"장소 미정")+'</div></div></div>';
    };
    var body=row(g,true,goOff)+row(bk,false,backOff);
    h+= body || '<div class="empty"><div class="big">🚏</div>이 날은 차량 운행이 없습니다.</div>';
  }

  var fix=function(list,isGo){
    if(!list.length) return "";
    var many=list.length>1;
    var out='<div class="t">'+(isGo?"등원 승차":"하원 하차")+(many?' — 날마다 달라집니다':'')+'</div>';
    list.forEach(function(st){
      var now = isGo ? (g.st&&g.st.k===st.k) : (bk.st&&bk.st.k===st.k);
      out+='<div class="stop'+(many&&now?' now':'')+'">'+
        '<div class="tt" style="color:'+(isGo?"var(--t-bus)":"var(--ok)")+'">'+esc(st.t||"–")+'</div>'+
        '<div class="pp">'+esc(st.place||"장소 미정")+
        (many&&now?'<span class="tag">이 날</span>':'')+'</div></div>';
    });
    return out;
  };
  h+='<div class="stoplist">'+fix(go,true)+fix(back,false)+'</div>';

  if(go.length>1 || back.length>1)
    h+='<div class="callout wait">이 아이는 <b>날짜에 따라 타고 내리는 곳이 달라집니다.</b> '+
       '위 날짜를 바꾸면 그날 장소가 표시되고, <b>「이 날」</b> 표시가 그날의 장소입니다.</div>';

  h+='<div class="note">차량은 <b>버스정류장·아파트 입구</b>에서 타고 내립니다. '+
     '시간은 교통 상황에 따라 5분 내외 차이가 날 수 있습니다.<br>'+
     '시간과 장소가 실제와 다르면 꼭 캠프 카카오톡으로 알려 주세요.</div>'+
     '</div></section>';
  return h;
}

      '</span><span class="b">'+m.kc+' kcal</span></div>';

     '</div></section>';
  return h;

/* ⑤ 체육 활동 기록 — 날짜별로 올라오는 그날의 활동이 기본입니다 */
function vPe(){

/* 하루치 활동 한 줄 */

/* ⑥ 오늘의 인성 교육 — 동화책 한 쪽처럼 */
function vChar(){
  var cl=ST.data.charLog||{};
  var days=Object.keys(cl).filter(function(x){ var v=cl[x]; return v && (v.ko||v.en||v.talk); }).sort();

  var head='<section class="card story-card" style="--tape:#5C7A52">'+
    '<div class="card-hd"><span class="eyebrow">인성</span><h2>오늘의 인성 교육</h2>';

  if(!days.length){
    return head+'</div><div class="card-bd"><div class="empty"><div class="big">💌</div>'+
      '아직 인성 교육 기록이 올라오지 않았습니다.<br>'+
      '수업이 끝나면 그날 함께 읽은 글을 올려 드립니다.</div></div></section>';
  }

  /* 고른 날짜에 기록이 있으면 그날, 없으면 그 이전 가장 가까운 날 */
  var d=null;
  for(var i=0;i<days.length;i++){ if(days[i]<=ST.date) d=days[i]; }
  if(!d) d=days[0];
  var c=cl[d];

  var h=head+'<span class="when">'+esc(fmtD(d))+'</span></div><div class="card-bd">'+
    '<div class="blob">'+
      (c.ko?'<div class="ko">'+esc(c.ko)+'</div>':'')+
      (c.en?'<div class="en">'+esc(c.en)+'</div>':'')+
      (c.who?'<div class="who">— '+esc(c.who)+' —</div>':'')+
    '</div>';

  if(c.talk) h+='<div class="talk"><div class="t">선생님 한마디</div><div class="c">'+esc(c.talk)+'</div></div>';

  /* 지난 글 목록 — 눌러서 그날 글로 넘어갑니다 */
  var others=days.slice().reverse();
  if(others.length>1){
    var show=others.slice(0,5), rest=others.slice(5);
    h+='<div class="shelf"><div class="shelfT">지난 글 '+others.length+'편</div>'+
       show.map(storyRow).join("");
    if(rest.length){
      h+='<details><summary>이전 글 더 보기 ('+rest.length+'편)</summary>'+
         '<div style="margin-top:7px">'+rest.map(storyRow).join("")+'</div></details>';
    }
    h+='</div>';
  }

  h+='<div class="note">캠프에서는 매일 짧은 글 한 편을 함께 읽고 이야기를 나눕니다. '+
     '집에서도 아이와 한 번 더 나눠 보시면 좋겠습니다.</div>'+
     '</div></section>';
  return h;
}
/* 지난 글 한 줄 */
function storyRow(d){
  var c=(ST.data.charLog||{})[d]||{};
  var cur=null, days=Object.keys(ST.data.charLog||{}).sort();
  for(var i=0;i<days.length;i++){ if(days[i]<=ST.date) cur=days[i]; }
  var on=(d===cur);
  var txt=String(c.ko||c.en||"");
  return '<div class="story-item'+(on?' on':'')+'" onclick="goStory(\''+d+'\')">'+
    '<div class="si-d">'+shortD(d)+'<span>'+DOW[dowOf(d)]+'</span></div>'+
    '<div class="si-c"><div class="si-t">'+esc(txt.slice(0,58))+(txt.length>58?'…':'')+'</div>'+
    (c.who?'<div class="si-w">'+esc(c.who)+'</div>':'')+'</div></div>';
}
function goStory(d){ ST.date=d; render(); }

  return h;
}

function vFoot(){
  var at=ST.data.at?new Date(ST.data.at):null;
  var w=at?(at.getMonth()+1)+"/"+at.getDate()+" "+
    ("0"+at.getHours()).slice(-2)+":"+("0"+at.getMinutes()).slice(-2):"—";
  return '<button class="btn ghost" onclick="reload()">최신 내용 불러오기</button>'+
    '<div class="foot">자료 기준 '+esc(w)+'<br>'+
    '문의는 기존에 상담하시던 <b>캠프 카카오톡</b>으로 부탁드립니다.<br>'+
    '<span style="color:var(--ink4)">나라차태권도 ✕ 클래식리더영어도서관 · 화면판 v2</span></div>';
}

/* ══ 시작 ══ */
(function(){
  var link=codeFromUrl();      /* 안내 문자 링크로 들어오셨나? */
  var s=saved();
  if(link){
    ST.linkCode=link;          /* 실패하면 로그인칸에 미리 채워 드리기 위해 기억 */
    wipeUrl();                 /* 주소창에서 코드 지우기 */
    fetchKid(link, false);
  }
  else if(s && s.code) fetchKid(s.code, false);
  else render();
  document.addEventListener("keydown", function(e){
    if(e.key==="Enter" && document.getElementById("pCode")) doLogin();
  });
  checkFileUpdate();
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden) autoRefresh();
  });
  window.addEventListener("pageshow", function(e){ if(e.persisted) autoRefresh(true); });
  setInterval(function(){ if(!document.hidden) autoRefresh(); }, 180000);
})();
</script>
