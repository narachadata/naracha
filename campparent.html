<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>나라차X클래식리더 방학캠프 — 학부모 조회</title>
<meta name="theme-color" content="#16273F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="방학캠프 조회">
<meta name="description" content="나라차태권도 X 클래식리더영어도서관 방학캠프 학부모 조회">
<!-- 글꼴은 화면을 막지 않도록 나중에 불러옵니다 (느린 통신·카톡 브라우저 대응) -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<!-- 인성 교육 문구에만 쓰는 손글씨 글꼴 (동화책 느낌) -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
<style>
:root{
  /* 잉크 */
  --ink:#16202E; --ink2:#57626F; --ink3:#8E97A2; --ink4:#B6BCC4;
  /* 종이 */
  --paper:#F5F3EE; --card:#FFFFFF; --line:#E7E2D9; --line2:#F0ECE4;
  /* 도장·도서관 */
  --dojang:#B5343F; --navy:#16273F;
  /* 항목 띠 — 도서관 레벨 색테이프에서 가져온 색 */
  --t-att:#2F4A6B; --t-bus:#1F6F73; --t-meal:#B07A1E; --t-eng:#2E6B4F; --t-pe:#B5343F;
  /* 상태 */
  --ok:#1E7B3C; --okBg:#EAF5EE; --no:#B5343F; --noBg:#FBEDEE;
  --wait:#8A6A1F; --waitBg:#FBF4E3; --idle:#F2EFE9;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  padding-bottom:52px;
}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}

/* ══ 머리말 ══ */
.belt{display:flex;height:5px}
.belt i{flex:1}
.belt i:first-child{background:var(--dojang)}
.belt i:last-child{background:var(--navy)}
.hd{background:var(--navy);color:#fff;padding:16px 18px 18px}
.hd .brand{font-size:11px;font-weight:700;letter-spacing:.06em;color:#9AA7BC}
.hd .brand b{color:#fff;font-weight:800}
.hd .brand em{color:var(--dojang);font-style:normal;font-weight:800;margin:0 3px}
.hd .ttl{font-size:20px;font-weight:800;letter-spacing:-.035em;margin-top:5px}
.hd .sub{font-size:12px;color:#8D9AB0;margin-top:4px;letter-spacing:-.01em}

.wrap{max-width:560px;margin:0 auto;padding:14px 13px 0}

/* ══ 카드 — 색 띠를 두른 책등 ══ */
.card{
  position:relative;background:var(--card);border:1px solid var(--line);
  border-radius:15px;margin-bottom:12px;overflow:hidden;
  box-shadow:0 1px 2px rgba(22,39,63,.04),0 6px 18px rgba(22,39,63,.045);
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--tape,var(--line))}
.card-hd{display:flex;align-items:baseline;gap:9px;padding:15px 16px 0 20px;flex-wrap:wrap}
.eyebrow{
  font-size:10.5px;font-weight:800;letter-spacing:.16em;color:var(--tape,var(--ink3));
  text-transform:none;flex:0 0 auto;
}
.card-hd h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.035em;flex:0 0 auto}
.card-hd .when{
  margin-left:auto;font-size:11.5px;font-weight:700;color:var(--ink2);
  background:var(--idle);border-radius:99px;padding:4px 10px;
}
.card-bd{padding:12px 16px 16px 20px}
.note{
  font-size:12px;line-height:1.75;color:var(--ink2);
  border-top:1px solid var(--line2);margin-top:13px;padding-top:11px;
}
.note b{color:var(--ink)}

/* ══ 로그인 ══ */
.login{padding:20px 18px 18px}
.login h2{margin:0 0 4px;font-size:19px;font-weight:800;letter-spacing:-.035em}
.login p{margin:0 0 16px;font-size:13px;line-height:1.75;color:var(--ink2)}
.lab{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--ink3);margin-bottom:7px}
.code-in{
  width:100%;padding:16px 12px;border:1.5px solid var(--line);border-radius:12px;
  background:#FCFBF9;font-family:inherit;font-size:23px;font-weight:800;
  letter-spacing:.34em;text-align:center;text-transform:uppercase;color:var(--ink);
}
.code-in::placeholder{color:var(--ink4);letter-spacing:.2em;font-weight:600}
.code-in:focus{outline:none;border-color:var(--navy);background:#fff;box-shadow:0 0 0 4px rgba(22,39,63,.07)}
.btn{
  width:100%;padding:15px;border:none;border-radius:12px;background:var(--navy);color:#fff;
  font-size:15px;font-weight:800;letter-spacing:-.02em;transition:transform .12s,opacity .12s;
}
.btn:active{transform:scale(.985);opacity:.9}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);font-size:13.5px;font-weight:700;padding:12px}
.hint{font-size:11.5px;line-height:1.7;color:var(--ink3);margin-top:9px}
.msg{display:none;font-size:13px;line-height:1.7;margin-top:12px;padding:12px 14px;border-radius:11px}
.msg.err{display:block;background:var(--noBg);color:var(--no);font-weight:600}
.msg.info{display:block;background:#EEF2F8;color:var(--navy);font-weight:600}

/* ══ 형제 탭 ══ */
.kids{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.kids button{
  flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:99px;
  padding:9px 16px;font-size:14px;font-weight:700;color:var(--ink2);letter-spacing:-.02em;
}
.kids button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.kids button i{display:block;font-size:10px;font-style:normal;opacity:.7;margin-top:1px;font-weight:600}

/* ══ 오늘 — 첫 화면의 결론 ══ */
.hero{
  position:relative;background:var(--navy);color:#fff;border-radius:15px;
  padding:17px 18px;margin-bottom:12px;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;
  border-radius:50%;background:rgba(255,255,255,.035);
}
.hero .nm{font-size:23px;font-weight:800;letter-spacing:-.04em;line-height:1.15}
.hero .meta{font-size:12px;color:#93A0B6;margin-top:4px;letter-spacing:-.01em}
.hero .st{
  display:flex;align-items:center;gap:8px;margin-top:13px;padding-top:13px;
  border-top:1px solid rgba(255,255,255,.13);position:relative;
}
.hero .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.hero .stx{font-size:14.5px;font-weight:700;letter-spacing:-.02em}
.hero .stx small{display:block;font-size:11.5px;font-weight:500;color:#93A0B6;margin-top:2px;letter-spacing:0}

/* ══ 날짜 선택 ══ */
.datebar{display:flex;align-items:stretch;gap:7px;margin-bottom:12px}
.datebar button{
  width:46px;background:#fff;border:1px solid var(--line);border-radius:12px;
  font-size:18px;color:var(--ink2);font-weight:700;
}
.datebar button:disabled{opacity:.3}
.datebar .mid{
  flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:10px;text-align:center;
}
.datebar .d1{font-size:15.5px;font-weight:800;letter-spacing:-.03em}
.datebar .d2{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--ink3);margin-top:2px}
.datebar .d2.today{color:var(--dojang)}

/* ══ 출석 ══ */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line2);
       border-radius:12px;overflow:hidden;margin-bottom:14px}
.stat{background:#fff;padding:11px 4px;text-align:center}
.stat .n{font-size:22px;font-weight:800;letter-spacing:-.04em;line-height:1}
.stat .l{font-size:10.5px;font-weight:700;color:var(--ink3);margin-top:4px}
.stat.a .n{color:var(--ok)} .stat.b .n{color:var(--no)} .stat.c .n{color:var(--t-att)}

.calhd{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:5px}
.calhd span{text-align:center;font-size:10.5px;font-weight:800;color:var(--ink3);letter-spacing:.08em}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cal .c{border-radius:9px;padding:7px 2px 6px;text-align:center;background:#FBFAF8;border:1px solid var(--line2)}
.cal .c .d{font-size:12.5px;font-weight:800;letter-spacing:-.03em;color:var(--ink2)}
.cal .c .s{font-size:9.5px;font-weight:800;margin-top:2px;color:var(--ink4)}
.cal .c.pad{background:transparent;border-color:transparent}
.cal .c.on{background:var(--okBg);border-color:#BFE0CB}
.cal .c.on .d{color:#155F2E} .cal .c.on .s{color:var(--ok)}
.cal .c.no{background:var(--noBg);border-color:#EFC9CD}
.cal .c.no .d{color:#8E2A33} .cal .c.no .s{color:var(--no)}
.cal .c.will{background:#fff;border-color:var(--line)}
.cal .c.will .s{color:var(--t-att)}
.cal .c.off{opacity:.5}
.cal .c.hol{background:#F1EEE8}
.cal .c.mk{box-shadow:inset 0 0 0 2px var(--wait)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:11px}
.legend span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink2)}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chips b{background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 11px;
         font-size:12px;font-weight:700;color:var(--ink2)}
.chips b.mk{border-color:var(--wait);background:var(--waitBg);color:var(--wait)}
.callout{border-radius:11px;padding:11px 13px;font-size:12.5px;line-height:1.7;margin-top:12px}
.callout.warn{background:var(--noBg);color:#8E2A33}
.callout.wait{background:var(--waitBg);color:var(--wait)}
.callout b{font-weight:800}

/* ══ 차량 ══ */
.ride{display:flex;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line2)}
.ride:last-of-type{border-bottom:none}
.ride .ic{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:flex;
          align-items:center;justify-content:center;font-size:19px}
.ride .ic.go{background:#E9F1F1} .ride .ic.back{background:var(--okBg)} .ride .ic.off{background:var(--idle)}
.ride .tm{font-size:24px;font-weight:800;letter-spacing:-.045em;line-height:1.1}
.ride .kind{font-size:11px;font-weight:800;letter-spacing:.08em;margin-left:7px}
.ride .pl{font-size:13px;color:var(--ink2);margin-top:3px;line-height:1.45}
.ride.dim .tm{font-size:15px;color:var(--ink3)}
.stoplist{margin-top:13px;border-top:1px solid var(--line2);padding-top:12px}
.stoplist .t{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--ink3);margin-bottom:8px}
.stop{display:flex;gap:11px;align-items:baseline;padding:6px 8px;border-radius:8px}
.stop.now{background:var(--okBg)}
.stop .tt{font-size:14px;font-weight:800;width:52px;flex:0 0 auto;letter-spacing:-.03em}
.stop .pp{font-size:13px;color:var(--ink2);line-height:1.5}
.stop .tag{font-size:10px;font-weight:800;background:var(--ok);color:#fff;border-radius:99px;padding:2px 7px;margin-left:5px}

/* ══ 식단 ══ */
.menu{display:flex;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.menu:last-of-type{border-bottom:none}
.menu .k{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--ink3);width:74px;flex:0 0 auto;padding-top:3px}
.menu .v{font-size:15px;font-weight:700;letter-spacing:-.025em}
.menu .kc{font-size:11.5px;font-weight:700;color:var(--t-meal);margin-left:7px}
.kcsum{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;
       padding-top:11px;border-top:1px solid var(--line2)}
.kcsum .a{font-size:12px;font-weight:700;color:var(--ink3)}
.kcsum .b{font-size:17px;font-weight:800;color:var(--t-meal);letter-spacing:-.03em}

/* ══ 영어 ══ */
.level{background:#EFF5F1;border-radius:13px;padding:15px 16px;position:relative;overflow:hidden}
.level .v{font-size:30px;font-weight:800;letter-spacing:-.05em;color:var(--t-eng);line-height:1}
.level .c{font-size:11.5px;color:var(--ink2);margin-top:6px;line-height:1.6}
.level .tape{position:absolute;right:0;top:0;bottom:0;width:7px;background:var(--t-eng);opacity:.55}
.pane{border-radius:12px;padding:13px 15px;margin-top:10px}
.pane .t{font-size:11px;font-weight:800;letter-spacing:.12em;margin-bottom:6px}
.pane .c{font-size:13.5px;line-height:1.8;white-space:pre-wrap}
.pane.an{background:var(--waitBg)} .pane.an .t{color:var(--wait)}
.pane.gd{background:var(--okBg)} .pane.gd .t{color:var(--ok)}
.pane.pe{background:#EEF2F8} .pane.pe .t{color:var(--t-att)}
.lvlog{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-top:1px dashed var(--line)}
.lvimg{width:100%;border-radius:12px;border:1px solid var(--line);margin-top:11px;cursor:zoom-in}
.cap{font-size:11.5px;color:var(--ink3);text-align:center;margin-top:6px}
.srnote{background:#FAF8F4;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-top:12px}
.srnote .t{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--ink3);margin-bottom:8px}
.srnote ul{margin:0;padding-left:16px}
.srnote li{font-size:12.5px;line-height:1.85;color:var(--ink2)}
.srnote li b{color:var(--ink)}
.srnote .more{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);
              font-size:12.5px;line-height:1.75;color:var(--ink2)}

/* ══ 공통 ══ */
.empty{text-align:center;color:var(--ink3);font-size:13px;line-height:1.75;padding:20px 10px}
.empty .big{font-size:26px;margin-bottom:7px}
details{margin-top:10px}
summary{font-size:12.5px;font-weight:700;color:var(--t-pe);cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"＋ ";font-weight:800}
details[open] summary::before{content:"－ "}
/* ══ 인성 교육 — 동화책 한 쪽처럼 ══ */
.story-card{background:#FCFAF4}
.blob{
  position:relative;background:#E6F0DE;margin:2px 0 0;padding:26px 22px 20px;
  border-radius:52% 48% 46% 54% / 9% 8% 10% 9%;
}
.blob::before,.blob::after{
  content:"";position:absolute;top:-5px;width:9px;height:9px;border-radius:50%;
  background:#BFD6B2;box-shadow:0 -6px 0 -2px #BFD6B2;
}
.blob::before{left:24px} .blob::after{left:44px;top:-1px}
.blob .ko{
  font-family:'Gaegu','Pretendard',sans-serif;
  font-size:21px;line-height:1.72;font-weight:700;color:#243024;letter-spacing:.005em;
  word-break:keep-all;
}
.blob .en{
  font-family:'Gaegu','Pretendard',sans-serif;
  font-size:15px;line-height:1.65;color:#C4573C;margin-top:13px;letter-spacing:.02em;
}
.blob .who{
  text-align:right;font-family:'Gaegu','Pretendard',sans-serif;
  font-size:15px;font-weight:700;color:#4A5A46;margin-top:11px;
}
.talk{
  background:#fff;border:1px dashed #D9CFBB;border-radius:13px;padding:14px 16px;margin-top:14px;
}
.talk .t{font-size:11px;font-weight:800;letter-spacing:.12em;color:#A08A5F;margin-bottom:7px}
.talk .c{font-size:13.5px;line-height:1.85;color:var(--ink2);white-space:pre-wrap}
.storynav{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.storynav b{
  background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 11px;
  font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;
}
.storynav b.on{background:#5C7A52;border-color:#5C7A52;color:#fff}
.pelist{display:flex;flex-direction:column;gap:2px}
.pe-day{display:flex;gap:12px;padding:11px 10px;border-radius:10px;align-items:flex-start}
.pe-day.sel{background:#FBF1F2;box-shadow:inset 0 0 0 1px #F0D6D9}
.pe-d{flex:0 0 auto;width:56px;font-size:13.5px;font-weight:800;letter-spacing:-.03em;color:var(--ink);padding-top:1px}
.pe-d span{display:block;font-size:10.5px;font-weight:700;color:var(--ink3);margin-top:1px}
.pe-d em{display:inline-block;font-style:normal;font-size:9.5px;font-weight:800;color:#fff;
         background:var(--t-pe);border-radius:99px;padding:1px 6px;margin-top:3px}
.pe-c{flex:1;min-width:0}
.pe-line{font-size:13.5px;line-height:1.7;color:var(--ink2);margin-bottom:3px}
.pe-line:last-child{margin-bottom:0}
.pe-line b{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.04em;
           border-radius:99px;padding:2px 8px;margin-right:7px;vertical-align:1px}
.pe-line b.jump{background:#EEF2F8;color:var(--t-att)}
.pe-line b.gym{background:var(--waitBg);color:var(--wait)}
.log{border-left:2px solid var(--line);padding:2px 0 9px 11px;margin-top:9px}
.log .d{font-size:12.5px;font-weight:800}
.log .c{font-size:12.5px;line-height:1.75;color:var(--ink2);margin-top:3px;white-space:pre-wrap}
.foot{text-align:center;font-size:11.5px;line-height:1.9;color:var(--ink3);margin-top:18px;padding-bottom:8px}
.foot b{color:var(--ink2)}
.spin{text-align:center;padding:46px 20px;color:var(--ink3);font-size:14px}
#busyBar{position:fixed;left:0;right:0;top:0;z-index:900;background:var(--navy);color:#fff;
         font-size:12px;font-weight:700;text-align:center;padding:8px 10px;letter-spacing:-.01em}

/* 등장 — 조용하게 */
@media (prefers-reduced-motion:no-preference){
  .card,.hero,.datebar,.kids{animation:rise .34s cubic-bezier(.2,.7,.3,1) both}
  .card:nth-of-type(2){animation-delay:.04s}
  .card:nth-of-type(3){animation-delay:.08s}
  .card:nth-of-type(4){animation-delay:.12s}
  .card:nth-of-type(5){animation-delay:.16s}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
}
:focus-visible{outline:3px solid rgba(22,39,63,.35);outline-offset:2px}
</style>
</head>
<body>
<div class="belt"><i></i><i></i></div>
<header class="hd">
  <div class="brand"><b>나라차태권도</b> <em>✕</em> <b>클래식리더영어도서관</b></div>
  <div class="ttl">방학캠프 학부모 조회</div>
  <div class="sub" id="hdSub">우리 아이의 캠프 하루를 확인하세요</div>
</header>
<main class="wrap" id="app"><div class="spin">불러오는 중…</div></main>

<script>
/* ══ 서버 주소 (관리 프로그램과 같은 주소) ══ */
var GSHEET_URL = "https://script.google.com/macros/s/AKfycbwZmWHCEGwXoOs2omyAgWiOE3ds0zQCtRy-Ta7lLqk1lXQMNFPXCkrSvlgTTXGdlK9E/exec";

var ST = { data:null, kid:null, idx:0, date:"", loading:false, imgs:null, imgLoading:false };
var LS = "naracha_parent_login";
var DOW = ["일","월","화","수","목","금","토"];

function esc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function ymd(d){ var m=d.getMonth()+1, x=d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x; }
function today(){ return ymd(new Date()); }
function fmtD(s){ var d=new Date(s+"T00:00:00");
  return (d.getMonth()+1)+"월 "+d.getDate()+"일 ("+DOW[d.getDay()]+")"; }
function shortD(s){ var d=new Date(s+"T00:00:00"); return (d.getMonth()+1)+"/"+d.getDate(); }
function dowOf(s){ return new Date(s+"T00:00:00").getDay(); }

/* ══ 저장·캐시 ══ */
function saved(){ try{ return JSON.parse(localStorage.getItem(LS)||"null"); }catch(e){ return null; } }
function saveLogin(code){ try{ localStorage.setItem(LS, JSON.stringify({code:code})); }catch(e){} }
function cacheKey(code){ return "naracha_pcache_"+code; }
function cacheGet(code){
  try{ var o=JSON.parse(localStorage.getItem(cacheKey(code))||"null");
       return (o && o.j) ? o : null; }catch(e){ return null; }
}
function cacheSet(code,j){
  try{ localStorage.setItem(cacheKey(code), JSON.stringify({ at:Date.now(), j:j })); }catch(e){}
}
function setBusy(on,txt){
  var el=document.getElementById("busyBar");
  if(!el){
    if(!on) return;
    el=document.createElement("div"); el.id="busyBar"; document.body.appendChild(el);
  }
  if(on){ el.textContent=txt||"최신 내용으로 새로 고치는 중…"; el.style.display="block"; }
  else el.style.display="none";
}
function logout(){
  if(!confirm("조회를 마칠까요?")) return;
  try{ localStorage.removeItem(LS); }catch(e){}
  ST.data=null; ST.kid=null; ST.imgs=null; render();
}

/* ══ 조회 ══ */
function doLogin(){
  var c=String((document.getElementById("pCode")||{}).value||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(c.length<4){ showMsg("err","캠프에서 안내해 드린 <b>가정 코드</b>를 넣어 주세요."); return; }
  fetchKid(c,true);
}
function showMsg(kind,txt){
  var m=document.getElementById("pMsg"); if(!m) return;
  m.className="msg "+kind; m.innerHTML=txt;
}
function fetchKid(code,fromForm){
  ST.loading=true;
  /* ① 전에 본 내용이 있으면 먼저 보여 드립니다 */
  var cached=cacheGet(code);
  if(cached && !ST.data){
    ST.data=cached.j; ST.idx=0; ST.kid=cached.j.kids[0];
    pickDate(); render();
    setBusy(true,"최신 내용으로 새로 고치는 중…");
  } else if(fromForm){
    showMsg("info","확인 중입니다… 처음 여실 때는 몇 초 걸릴 수 있습니다.");
  }
  /* ② 서버에서 최신 내용 */
  var ctrl = (window.AbortController ? new AbortController() : null);
  var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 25000);
  fetch(GSHEET_URL+"?p=find&code="+encodeURIComponent(code), ctrl?{signal:ctrl.signal}:{})
    .then(function(r){ clearTimeout(timer); return r.json(); })
    .then(function(j){
      ST.loading=false; setBusy(false);
      if(!j || j.error){
        var t = j&&j.error==="NOTFOUND"
              ? "일치하는 가정 코드가 없습니다.<br>· 캠프에서 보내 드린 <b>코드 그대로</b> 넣어 주세요.<br>· 코드를 잊으셨다면 캠프 카카오톡으로 문의해 주세요."
              : j&&j.error==="NODATA" ? "아직 캠프 자료가 준비되지 않았습니다. 잠시 후 다시 확인해 주세요."
              : j&&j.error==="BAD" ? "가정 코드를 다시 확인해 주세요."
              : "잠시 후 다시 시도해 주세요.";
        if(fromForm) showMsg("err",t); else { try{ localStorage.removeItem(LS); }catch(e){} render(); }
        return;
      }
      ST.data=j; ST.idx=0; ST.kid=j.kids[0];
      saveLogin(code); cacheSet(code,j);
      pickDate(); render();
    })
    .catch(function(){
      clearTimeout(timer);
      ST.loading=false; setBusy(false);
      if(ST.data) return;
      if(fromForm) showMsg("err","연결이 느리거나 끊겼습니다.<br>잠시 후 <b>확인하기</b>를 다시 눌러 주세요.");
      else render();
    });
}
function loadImgs(){
  var sv=saved(); if(!sv || !sv.code) return;
  ST.imgLoading=true; render();
  setBusy(true,"결과지를 불러오는 중…");
  fetch(GSHEET_URL+"?p=img&code="+encodeURIComponent(sv.code))
    .then(function(r){ return r.json(); })
    .then(function(j){ ST.imgLoading=false; setBusy(false);
      if(j && j.ok){ ST.imgs=j.imgs||{}; render(); } })
    .catch(function(){ ST.imgLoading=false; setBusy(false); render(); });
}
function pickDate(){
  var ds=(ST.data.camp.dates)||[]; if(!ds.length) return;
  var t=today();
  if(ds.indexOf(t)>=0){ ST.date=t; return; }
  var next=null;
  for(var i=0;i<ds.length;i++){ if(ds[i]>=t){ next=ds[i]; break; } }
  ST.date = next || ds[ds.length-1];
}
function moveDate(step){
  var ds=ST.data.camp.dates, i=ds.indexOf(ST.date);
  if(i<0) return;
  var j=i+step; if(j<0||j>=ds.length) return;
  ST.date=ds[j]; render();
}
function pickKid(i){
  if(!ST.data || !ST.data.kids[i]) return;
  ST.idx=i; ST.kid=ST.data.kids[i];
  render(); window.scrollTo(0,0);
}
function reload(){
  var s=saved(); if(!s) return;
  document.getElementById("app").innerHTML='<div class="spin">불러오는 중…</div>';
  fetchKid(s.code, false);
}

/* ══ 화면 ══ */
function render(){
  var app=document.getElementById("app"), sub=document.getElementById("hdSub");
  if(!ST.data){
    app.innerHTML=vLogin();
    sub.textContent="우리 아이의 캠프 하루를 확인하세요";
    return;
  }
  sub.textContent=ST.data.camp.name;
  app.innerHTML = vKids()+vHero()+vAtt()+vDate()+vBus()+vMeal()+vEng()+vPe()+vChar()+vHist()+vFoot();
}

  return '<div class="card" style="--tape:var(--navy)"><div class="login">'+
    '<h2>우리 아이 조회하기</h2>'+
    '<p>캠프에서 안내해 드린 <b>가정 코드</b>를 넣어 주세요.<br>'+
    '형제·자매는 한 코드로 함께 보이고, 다음 캠프에도 같은 코드를 쓰십니다.</p>'+
    '<span class="lab">가정 코드</span>'+
    '<input class="code-in" id="pCode" maxlength="10" placeholder="7KMD3P" autocomplete="off" '+
      'inputmode="latin" oninput="this.value=this.value.toUpperCase()">'+
    '<div class="hint">코드에는 헷갈리는 <b>0 · 1 · I · O · S · B</b> 가 들어가지 않습니다.</div>'+
    '<div style="height:15px"></div>'+
    '<button class="btn" onclick="doLogin()">확인하기</button>'+
    '<div class="msg" id="pMsg"></div>'+
    '</div></div>'+
    '<div class="foot">이 화면은 <b>본인 자녀의 정보만</b> 보여 드립니다.<br>'+
    '문의는 기존에 상담하시던 <b>캠프 카카오톡</b>으로 부탁드립니다.</div>';
}

function vKids(){
  var ks=ST.data.kids||[];
  if(ks.length<2) return "";
  return '<div class="kids">'+ks.map(function(k,i){
    return '<button class="'+(i===ST.idx?"on":"")+'" onclick="pickKid('+i+')">'+esc(k.n)+
           '<i>'+esc(k.cn||k.g||"")+'</i></button>';
  }).join("")+'</div>';
}

/* 오늘 하루의 결론 — 이 앱이 가장 먼저 답해야 할 것 */
function vHero(){
  var k=ST.kid, t=today();
  var isPlan=(k.plan||[]).indexOf(t)>=0 || (k.mk||[]).indexOf(t)>=0;
  var att=(k.att||{})[t];
  var dot="#93A0B6", line="오늘은 캠프에 오지 않는 날입니다", sub="";

  if(isPlan && att===2){ dot="#E0616C"; line="오늘은 결석으로 기록되어 있습니다"; sub="보강은 카카오톡으로 잡아 주세요"; }
  else if(isPlan && att===1){ dot="#5BC47F"; line="오늘 출석했습니다"; sub=fmtD(t); }
  else if(isPlan){
    dot="#7FB2E8"; line="오늘 캠프에 가는 날입니다"; sub=fmtD(t);
    /* 오늘 등원 차량이 있으면 시각·장소까지 한 줄로 */
    var b=(k.bus||{}).go||[], pk=(k.pick||{})[t+"|go"];
    var st=null;
    if(b.length===1) st=b[0];
    else if(pk) b.forEach(function(x){ if(x.k===pk) st=x; });
    if(st && !((k.skipAll||{})[t]) && !((k.skip||{})[t+"|"+st.k]))
      sub=(st.t||"")+" · "+(st.place||"");
  } else {
    var ds=ST.data.camp.dates||[], next=null;
    (k.plan||[]).forEach(function(d){ if(!next && d>=t) next=d; });
    if(next){ line="다음 출석일은 "+fmtD(next)+"입니다"; sub=""; }
    else { dot="#93A0B6"; line="캠프 일정을 모두 마쳤습니다"; sub="함께해 주셔서 감사합니다"; }
  }
  return '<div class="hero">'+
    '<div class="nm">'+esc(k.n)+'</div>'+
    '<div class="meta">'+esc(k.g||"")+(k.cn?' · 반번호 '+esc(k.cn):'')+
      ' · <span style="cursor:pointer;text-decoration:underline" onclick="logout()">나가기</span></div>'+
    '<div class="st"><span class="dot" style="background:'+dot+'"></span>'+
      '<span class="stx">'+esc(line)+(sub?'<small>'+esc(sub)+'</small>':'')+'</span></div>'+
    '</div>';
}

/* ① 출석 현황 */
function vAtt(){
  var k=ST.kid, ds=ST.data.camp.dates, hol=ST.data.hol||{};
  var plan=k.plan||[], att=k.att||{}, mk=k.mk||[];
  var ok=0, ab=0, left=0, t=today(), upcoming=[];
  plan.forEach(function(d){
    if(att[d]===1) ok++;
    else if(att[d]===2) ab++;
    else if(d>=t){ left++; upcoming.push(d); }
  });
  mk.forEach(function(d){ if(d>=t && upcoming.indexOf(d)<0) upcoming.push(d); });
  upcoming.sort();

  var h='<section class="card" style="--tape:var(--t-att)">'+
    '<div class="card-hd"><span class="eyebrow">출결</span><h2>출석 현황</h2>'+
      '<span class="when">전체 '+ds.length+'일 중 '+plan.length+'일</span></div>'+
    '<div class="card-bd">'+
    '<div class="stats">'+
      '<div class="stat"><div class="n">'+plan.length+'</div><div class="l">등록일수</div></div>'+
      '<div class="stat a"><div class="n">'+ok+'</div><div class="l">출석</div></div>'+
      '<div class="stat b"><div class="n">'+ab+'</div><div class="l">결석</div></div>'+
      '<div class="stat c"><div class="n">'+left+'</div><div class="l">남은일수</div></div>'+
    '</div>'+
    '<div class="calhd"><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span></div>'+
    '<div class="cal">';

  /* 첫 주 앞부분 비우기 */
  if(ds.length){
    var pad=dowOf(ds[0])-1; if(pad<0) pad=0;
    for(var i=0;i<pad;i++) h+='<div class="c pad"></div>';
  }
  ds.forEach(function(d){
    var isPlan=plan.indexOf(d)>=0, isMk=mk.indexOf(d)>=0, isHol=!!hol[d];
    var cls, s;
    if(isHol){ cls="hol"; s="휴일"; }
    else if(!isPlan && !isMk){ cls="off"; s="—"; }
    else if(att[d]===1){ cls="on"; s="출석"; }
    else if(att[d]===2){ cls="no"; s="결석"; }
    else if(d<t){ cls="will"; s="—"; }
    else { cls="will"; s="예정"; }
    h+='<div class="c '+cls+(isMk?' mk':'')+'"><div class="d">'+shortD(d)+'</div><div class="s">'+s+'</div></div>';
  });
  h+='</div>'+
    '<div class="legend">'+
      '<span><i style="background:var(--okBg);box-shadow:inset 0 0 0 1px #BFE0CB"></i>출석</span>'+
      '<span><i style="background:var(--noBg);box-shadow:inset 0 0 0 1px #EFC9CD"></i>결석</span>'+
      '<span><i style="background:#fff;box-shadow:inset 0 0 0 1px var(--line)"></i>예정</span>'+
      '<span><i style="background:#fff;box-shadow:inset 0 0 0 2px var(--wait)"></i>보강</span>'+
    '</div>';

  if(upcoming.length){
    h+='<div style="margin-top:14px"><span class="lab">앞으로 출석하는 날 · '+upcoming.length+'일</span>'+
       '<div class="chips">'+upcoming.map(function(d){
         return '<b class="'+(mk.indexOf(d)>=0?'mk':'')+'">'+shortD(d)+'('+DOW[dowOf(d)]+')'+
                (mk.indexOf(d)>=0?' 보강':'')+'</b>';
       }).join("")+'</div></div>';
  }
  if(ab) h+='<div class="callout warn">결석 <b>'+ab+'일</b>이 있습니다. 캠프 기간 안에는 보강이 가능하니 '+
     '카카오톡으로 날짜를 잡아 주세요.</div>';
  h+='<div class="note">출석일이 실제와 다르면 캠프 카카오톡으로 알려 주세요.</div>'+
    '</div></section>';
  return h;
}

/* 날짜 선택 — 차량·식단·체육 수업이 함께 움직입니다 */
function vDate(){
  var ds=ST.data.camp.dates, i=ds.indexOf(ST.date), isT=ST.date===today();
  return '<div class="datebar">'+
    '<button onclick="moveDate(-1)"'+(i<=0?' disabled':'')+' aria-label="이전 날">‹</button>'+
    '<div class="mid"><div class="d1">'+fmtD(ST.date)+'</div>'+
      '<div class="d2'+(isT?' today':'')+'">'+(isT?'오늘':'차량 · 식단 · 체육 수업')+'</div></div>'+
    '<button onclick="moveDate(1)"'+(i<0||i>=ds.length-1?' disabled':'')+' aria-label="다음 날">›</button>'+
    '</div>';
}

/* ② 우리 아이 차량 */
function vBus(){
  var k=ST.kid, b=k.bus||{go:[],back:[]};
  var go=(b.go||[]), back=(b.back||[]);
  if(!go.length && !back.length) return "";

  var d=ST.date;
  var isPlanDay=(k.plan||[]).indexOf(d)>=0 || (k.mk||[]).indexOf(d)>=0;
  var absent=(k.att||{})[d]===2;
  var skip=k.skip||{}, skipAll=k.skipAll||{}, pick=k.pick||{};

  var pickOne=function(list,key){
    if(!list.length) return { none:true };
    if(list.length===1) return { st:list[0] };
    var want=pick[d+"|"+key];
    if(!want) return { undecided:true };
    var hit=null; list.forEach(function(x){ if(x.k===want) hit=x; });
    return hit ? { st:hit } : { undecided:true };
  };
  var g=pickOne(go,"go"), bk=pickOne(back,"back");
  var offOf=function(r){ return (r&&r.st) ? (!!skipAll[d] || !!skip[d+"|"+r.st.k]) : false; };
  var goOff=offOf(g), backOff=offOf(bk);

  var h='<section class="card" style="--tape:var(--t-bus)">'+
    '<div class="card-hd"><span class="eyebrow">차량</span><h2>우리 아이 차량</h2>'+
      '<span class="when">'+esc(fmtD(d))+'</span></div><div class="card-bd">';

  var why = !isPlanDay ? "이 날은 등원일이 아닙니다"
          : absent ? "결석으로 기록되어 차량에서 빠졌습니다"
          : (skipAll[d] || (goOff && backOff && !g.none && !bk.none)) ? "이 날은 차량을 이용하지 않습니다"
          : "";

  if(why){
    h+='<div class="empty"><div class="big">🚏</div>'+esc(why)+'</div>';
  } else {
    var row=function(r,isGo,off){
      if(r.none) return "";
      if(r.undecided){
        return '<div class="ride dim"><div class="ic off">❓</div><div>'+
          '<div class="tm" style="color:var(--wait)">'+(isGo?"승차":"하차")+' 장소 미정</div>'+
          '<div class="pl">아래 장소 중 한 곳입니다. 캠프 카카오톡으로 확인해 주세요.</div></div></div>';
      }
      if(off){
        return '<div class="ride dim"><div class="ic off">✕</div><div>'+
          '<div class="tm">'+(isGo?"등원":"하원")+' 차량 이용 안 함</div>'+
          '<div class="pl">'+esc(r.st.place||"")+'</div></div></div>';
      }
      var st=r.st, col=isGo?"var(--t-bus)":"var(--ok)";
      return '<div class="ride"><div class="ic '+(isGo?"go":"back")+'">'+(isGo?"🚌":"🏠")+'</div><div>'+
        '<div class="tm">'+esc(st.t||"시간 미정")+
          '<span class="kind" style="color:'+col+'">'+(isGo?"등원 승차":"하원 하차")+'</span></div>'+
        '<div class="pl">'+esc(st.place||"장소 미정")+'</div></div></div>';
    };
    var body=row(g,true,goOff)+row(bk,false,backOff);
    h+= body || '<div class="empty"><div class="big">🚏</div>이 날은 차량 운행이 없습니다.</div>';
  }

  var fix=function(list,isGo){
    if(!list.length) return "";
    var many=list.length>1;
    var out='<div class="t">'+(isGo?"등원 승차":"하원 하차")+(many?' — 날마다 달라집니다':'')+'</div>';
    list.forEach(function(st){
      var now = isGo ? (g.st&&g.st.k===st.k) : (bk.st&&bk.st.k===st.k);
      out+='<div class="stop'+(many&&now?' now':'')+'">'+
        '<div class="tt" style="color:'+(isGo?"var(--t-bus)":"var(--ok)")+'">'+esc(st.t||"–")+'</div>'+
        '<div class="pp">'+esc(st.place||"장소 미정")+
        (many&&now?'<span class="tag">이 날</span>':'')+'</div></div>';
    });
    return out;
  };
  h+='<div class="stoplist">'+fix(go,true)+fix(back,false)+'</div>';

  if(go.length>1 || back.length>1)
    h+='<div class="callout wait">이 아이는 <b>날짜에 따라 타고 내리는 곳이 달라집니다.</b> '+
       '위 날짜를 바꾸면 그날 장소가 표시되고, <b>「이 날」</b> 표시가 그날의 장소입니다.</div>';

  h+='<div class="note">차량은 <b>버스정류장·아파트 입구</b>에서 타고 내립니다. '+
     '시간은 교통 상황에 따라 5분 내외 차이가 날 수 있습니다.<br>'+
     '시간과 장소가 실제와 다르면 꼭 캠프 카카오톡으로 알려 주세요.</div>'+
     '</div></section>';
  return h;
}

/* ③ 이 날의 식단 */
function vMeal(){
  var m=(ST.data.meals||{})[ST.date], hol=(ST.data.hol||{})[ST.date];
  var h='<section class="card" style="--tape:var(--t-meal)">'+
    '<div class="card-hd"><span class="eyebrow">중식</span><h2>이 날의 식단</h2>'+
      '<span class="when">'+esc(fmtD(ST.date))+'</span></div><div class="card-bd">';
  if(hol){ return h+'<div class="empty"><div class="big">🗓</div>휴일입니다.</div></div></section>'; }
  if(!m){ return h+'<div class="empty"><div class="big">🍚</div>아직 식단이 올라오지 않았습니다.</div></div></section>'; }
  if(m.sp){
    h+='<div class="menu"><div class="k">특식</div><div class="v">'+esc(m.note||"특식 제공")+'</div></div>';
  } else {
    (m.items||[]).forEach(function(it){
      h+='<div class="menu"><div class="k">'+esc(it.l)+'</div>'+
         '<div class="v">'+esc(it.n)+(it.k?'<span class="kc">'+it.k+' kcal</span>':'')+'</div></div>';
    });
    if(m.kc) h+='<div class="kcsum"><span class="a">1인분 어림값 '+
      (m.unk?'<span style="color:var(--ink4)">(칼로리 정보 없는 반찬 '+m.unk+'가지 제외)</span>':'(밥 제외)')+
      '</span><span class="b">'+m.kc+' kcal</span></div>';
  }
  h+='<div class="note">밥과 함께 배식됩니다. 알러지 등 특이사항은 캠프 카카오톡으로 알려 주세요.</div>'+
     '</div></section>';
  return h;
}

/* ④ 영어 독서 지도 */
function vEng(){
  var k=ST.kid;
  var h='<section class="card" style="--tape:var(--t-eng)">'+
    '<div class="card-hd"><span class="eyebrow">영어</span><h2>영어 독서 지도</h2></div><div class="card-bd">';
  if(k.lv){
    h+='<div class="level"><div class="tape"></div>'+
       '<div class="v">'+esc(k.lv)+'</div>'+
       '<div class="c">지금 편안하게 읽는 책의 범위'+(k.lvAt?' · '+esc(k.lvAt)+' 측정':'')+'</div></div>';
  } else {
    h+='<div class="empty"><div class="big">📖</div>아직 레벨이 기록되지 않았습니다.<br>레벨 테스트 후 이곳에 표시됩니다.</div>';
  }
  var log=(k.lvLog||[]).filter(function(x){ return x.lv; });
  if(log.length>1){
    h+='<div style="margin-top:13px"><span class="lab">레벨 변화</span>';
    log.slice(-5).forEach(function(x){
      h+='<div class="lvlog"><span style="color:var(--ink3)">'+esc(x.d)+'</span><b>'+esc(x.lv)+'</b></div>';
    });
    h+='</div>';
  }
  if(k.an) h+='<div class="pane an"><div class="t">레벨 분석</div><div class="c">'+esc(k.an)+'</div></div>';
  if(k.gd) h+='<div class="pane gd"><div class="t">지도 방향</div><div class="c">'+esc(k.gd)+'</div></div>';
  if(k.pub) h+='<div class="pane gd"><div class="t">선생님 기록</div><div class="c">'+esc(k.pub)+'</div></div>';
  if(!k.an && !k.gd && !k.pub && k.lv)
    h+='<div class="note">담당 선생님이 아이의 독서 모습을 살펴본 뒤 <b>분석과 지도 방향</b>을 이곳에 올려 드립니다.</div>';

  if(k.iid){
    var src=ST.imgs && ST.imgs[k.iid];
    if(src) h+='<img class="lvimg" src="'+src+'" onclick="window.open(this.src)" alt="레벨테스트 결과지">'+
               '<div class="cap">레벨테스트 결과지 · 눌러서 크게 보기</div>';
    else if(ST.imgLoading) h+='<div class="note">결과지를 불러오는 중입니다…</div>';
    else h+='<button class="btn ghost" style="margin-top:11px" onclick="loadImgs()">레벨테스트 결과지 보기</button>';
  }

  h+='<div class="srnote">'+
     '<div class="t">이 숫자를 이렇게 읽어 주세요</div><ul>'+
       '<li>이 값은 <b>르네상스 러닝</b>의 SR 테스트로 측정한 <b>「읽기 편한 책의 범위」</b>입니다.</li>'+
       '<li>영어 <b>실력의 순위나 등급이 아닙니다.</b> 어떤 책을 권해 드릴지 정하기 위한 값입니다.</li>'+
       '<li>숫자는 <b>미국 학교 기준</b>이라 한국 학년과 그대로 견주기 어렵습니다.</li>'+
       '<li>그날의 컨디션과 문항에 따라 <b>오르내릴 수 있는 참고값</b>입니다.</li>'+
     '</ul>'+
     '<div class="more">캠프의 영어독서는 스스로 골라 읽는 <b>다독 프로그램</b>입니다. '+
       '짧은 기간에 점수로 드러나지 않더라도, 아이가 스스로 읽어 나가는 것을 응원해 주세요.<br>'+
       '결과지를 자세히 풀어 듣고 싶으시면 <b>클래식리더 원장 상담</b>을 캠프 카카오톡으로 신청하실 수 있습니다.</div>'+
     '</div></div></section>';
  return h;
}

/* ⑤ 체육 활동 기록 — 날짜별로 올라오는 그날의 활동이 기본입니다 */
function vPe(){
  var k=ST.kid, pl=ST.data.peLog||{};
  var days=Object.keys(pl).filter(function(d){ return pl[d] && (pl[d].j||pl[d].g); }).sort().reverse();

  var h='<section class="card" style="--tape:var(--t-pe)">'+
    '<div class="card-hd"><span class="eyebrow">체육</span><h2>체육 활동 기록</h2>'+
      (days.length?'<span class="when">'+days.length+'일 기록</span>':'')+'</div><div class="card-bd">';

  if(!days.length){
    h+='<div class="empty"><div class="big">🤸</div>아직 체육 수업 기록이 올라오지 않았습니다.<br>'+
       '수업이 끝나면 그날 활동을 올려 드립니다.</div>';
  } else {
    var show=days.slice(0,6), rest=days.slice(6);
    h+='<div class="pelist">'+show.map(peRow).join("")+'</div>';
    if(rest.length){
      h+='<details><summary>이전 기록 더 보기 ('+rest.length+'일)</summary>'+
         '<div class="pelist" style="margin-top:9px">'+rest.map(peRow).join("")+'</div></details>';
    }
  }

  /* 우리 아이에게만 따로 남긴 기록 (공통과 다른 내용이 있을 때만) */
  var mj=peMine(k.jp,"j"), mg=peMine(k.gy,"g"), mo=String(k.pe||"").trim();
  if(mj || mg || mo){
    h+='<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line2)">'+
       '<span class="lab" style="color:var(--t-pe)">'+esc(k.n)+' 개별 기록</span>';
    if(mj) h+='<div class="pane pe" style="margin-top:6px"><div class="t">줄넘기</div><div class="c">'+esc(mj)+'</div></div>';
    if(mg) h+='<div class="pane an"><div class="t">체조</div><div class="c">'+esc(mg)+'</div></div>';
    if(mo) h+='<div class="pane pe"><div class="t">체육 기록</div><div class="c">'+esc(mo)+'</div></div>';
    h+='</div>';
  }

  h+='<div class="note">위 기록은 <b>그날 다같이 한 활동</b>입니다.'+
     ((mj||mg||mo)?' 아래 <b>개별 기록</b>은 선생님이 '+esc(k.n)+' 학생을 보며 따로 적어 둔 내용입니다.':'')+
     '<br>줄넘기는 월·수·금, 체조는 화·목에 진행합니다.</div></div></section>';
  return h;
}
/* 개별 기록에서 «공통 수업 내용과 똑같은 줄» 은 빼고 보여 줍니다.
   (저장 한 번으로 전원에게 들어간 내용이 두 번 보이지 않게) */
function peMine(txt, kind){
  var pl=ST.data.peLog||{}, common={};
  Object.keys(pl).forEach(function(d){
    var dd=new Date(d+"T00:00:00");
    var tag=(dd.getMonth()+1)+"/"+dd.getDate();
    var v=(kind==="j" ? pl[d].j : pl[d].g);
    if(v) common[tag+"|"+String(v).trim()]=1;
  });
  return String(txt||"").split("\n").filter(function(L){
    if(!L.trim()) return false;
    var m=L.match(/^·\s*(\d{1,2}\/\d{1,2})\s+([\s\S]*)$/);
    if(!m) return true;                                  /* 날짜 없는 줄은 그대로 */
    return !common[m[1]+"|"+m[2].trim()];                /* 공통과 같으면 뺍니다 */
  }).join("\n").trim();
}
/* 하루치 활동 한 줄 */
function peRow(d){
  var x=(ST.data.peLog||{})[d]||{};
  var isSel=(d===ST.date), isToday=(d===today());
  return '<div class="pe-day'+(isSel?' sel':'')+'">'+
    '<div class="pe-d">'+shortD(d)+'<span>'+DOW[dowOf(d)]+'</span>'+
      (isToday?'<em>오늘</em>':'')+'</div>'+
    '<div class="pe-c">'+
      (x.j?'<div class="pe-line"><b class="jump">줄넘기</b>'+esc(x.j)+'</div>':'')+
      (x.g?'<div class="pe-line"><b class="gym">체조</b>'+esc(x.g)+'</div>':'')+
    '</div></div>';
}

/* ⑥ 오늘의 인성 교육 — 동화책 한 쪽처럼 */
function vChar(){
  var cl=ST.data.charLog||{};
  var days=Object.keys(cl).sort();
  if(!days.length) return "";

  /* 고른 날짜에 기록이 있으면 그날, 없으면 그 이전 가장 가까운 날 */
  var d=null;
  for(var i=0;i<days.length;i++){ if(days[i]<=ST.date) d=days[i]; }
  if(!d) d=days[0];
  var c=cl[d];

  var h='<section class="card story-card" style="--tape:#5C7A52">'+
    '<div class="card-hd"><span class="eyebrow" style="color:#5C7A52">인성</span><h2>오늘의 인성 교육</h2>'+
      '<span class="when">'+esc(fmtD(d))+'</span></div>'+
    '<div class="card-bd">'+
    '<div class="blob">'+
      (c.ko?'<div class="ko">'+esc(c.ko)+'</div>':'')+
      (c.en?'<div class="en">'+esc(c.en)+'</div>':'')+
      (c.who?'<div class="who">— '+esc(c.who)+' —</div>':'')+
    '</div>';

  if(c.talk) h+='<div class="talk"><div class="t">선생님 한마디</div><div class="c">'+esc(c.talk)+'</div></div>';

  if(days.length>1){
    h+='<div class="storynav">'+days.slice().reverse().slice(0,12).map(function(x){
      return '<b class="'+(x===d?"on":"")+'" onclick="goStory(\''+x+'\')">'+shortD(x)+'</b>';
    }).join("")+'</div>';
  }
  h+='<div class="note">캠프에서는 매일 짧은 글 한 편을 함께 읽고 이야기를 나눕니다. '+
     '집에서도 아이와 한 번 더 나눠 보시면 좋겠습니다.</div>'+
     '</div></section>';
  return h;
}
function goStory(d){ ST.date=d; render(); }

/* 지난 캠프 (설정에서 켰을 때만) */
function vHist(){
  var k=ST.kid, hs=k.hist||[];
  if(!hs.length) return "";
  var h='<section class="card" style="--tape:var(--ink3)">'+
    '<div class="card-hd"><span class="eyebrow">이력</span><h2>지난 캠프 기록</h2></div><div class="card-bd">';
  hs.forEach(function(x){
    h+='<div class="log"><div class="d">'+esc(x.c)+
       ' <span style="font-weight:600;color:var(--ink3);font-size:12px">'+(x.days||0)+'일 참여'+
       (x.lv?' · 레벨 '+esc(x.lv):'')+'</span></div>'+
       (x.an?'<div class="c">'+esc(x.an)+'</div>':'')+
       (x.gd?'<div class="c">'+esc(x.gd)+'</div>':'')+'</div>';
  });
  h+='<div class="note">캠프에 참여할수록 아이의 기록이 이어서 쌓입니다.</div></div></section>';
  return h;
}

function vFoot(){
  var at=ST.data.at?new Date(ST.data.at):null;
  var w=at?(at.getMonth()+1)+"/"+at.getDate()+" "+
    ("0"+at.getHours()).slice(-2)+":"+("0"+at.getMinutes()).slice(-2):"—";
  return '<button class="btn ghost" onclick="reload()">최신 내용 불러오기</button>'+
    '<div class="foot">자료 기준 '+esc(w)+'<br>'+
    '문의는 기존에 상담하시던 <b>캠프 카카오톡</b>으로 부탁드립니다.<br>'+
    '<span style="color:var(--ink4)">나라차태권도 ✕ 클래식리더영어도서관</span></div>';
}
