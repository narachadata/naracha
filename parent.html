<!DOCTYPE html>
<html lang="ko">
<head>

<title>나라차 학부모</title>

<style>
/* ══ 나라차태권도 학부모앱 p2.0 — 디자인 B안 "친근 성장형" (토큰은 :root만 고치면 전체가 바뀜) ══ */
:root{
  --bg-1:#FFF6E8; --bg-2:#FDF3F6; --bg-3:#F1F7FF; --card:#FFFFFF;
  --ink:#3C3350; --ink-2:#7A6E86; --ink-3:#A79BB4;
  --point:#FF9F43; --point-soft:#FFF1C9;
  --ok:#2E9E4F; --warn:#C8342A; --kakao:#FAE100; --info:#2B5FB8;
  --b9:#F2F4F8; --b8:#F7D308; --b7:#F08A24; --b6:#2E9E4F; --b5:#2B5FB8; --b4:#7A4CA8; --b3:#6B4226; --b2:#C8342A; --b1:#111111; --bp:#111111;
  --r-lg:24px; --r-md:20px; --r-sm:14px;
  --sh:0 6px 20px rgba(150,110,70,.13); --sh-sm:0 4px 14px rgba(150,110,70,.10);
  --line:#F0E6DA;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:linear-gradient(180deg,var(--bg-1) 0%,var(--bg-2) 42%,var(--bg-3) 100%);background-attachment:fixed;color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:14px;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;min-height:100svh}
h1,h2,h3,h4,.jua{font-family:"Jua",sans-serif;font-weight:400;letter-spacing:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{max-width:100%}
#app{max-width:430px;margin:0 auto;position:relative;min-height:100svh;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(180deg,rgba(255,246,232,.97),rgba(255,246,232,.82));backdrop-filter:saturate(1.3) blur(8px)}
.hbar{display:flex;align-items:center;gap:9px;padding:13px 16px 9px}
.hbar b{font-family:"Jua",sans-serif;font-size:16px}
.hbar .sub{font-size:10.5px;color:var(--ink-2)}
.hbtn{margin-left:auto;height:32px;border-radius:99px;background:#fff;box-shadow:var(--sh-sm);display:inline-flex;align-items:center;gap:5px;padding:0 12px;font-size:12px;font-weight:600;color:var(--ink-2)}
.kids{display:flex;gap:7px;padding:0 16px 8px;overflow-x:auto}
.kids button{flex:0 0 auto;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;background:#fff;box-shadow:var(--sh-sm);color:var(--ink-2)}
.kids button.on{background:var(--point);color:#fff}
main{padding:4px 16px 108px;display:none}
main.on{display:block}
.card{background:var(--card);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh);margin-bottom:13px}
.card.sm{border-radius:var(--r-md);padding:14px;box-shadow:var(--sh-sm)}
.sec{display:flex;align-items:baseline;gap:7px;margin:18px 4px 9px}
.sec h2{margin:0;font-size:16px}
.sec span{font-size:11px;color:var(--ink-3)}
.tiny{font-size:11px;color:var(--ink-2)}
.cta{display:block;width:100%;background:var(--point);color:#fff;border-radius:18px;padding:13px;font-family:"Jua",sans-serif;font-size:15px;box-shadow:0 6px 16px rgba(255,159,67,.36)}
.cta.ghost{background:#fff;color:var(--point);box-shadow:var(--sh-sm)}
.cta.kakao{background:var(--kakao);color:#3C1E1E;box-shadow:0 5px 14px rgba(180,150,0,.26)}
.cta.navy{background:var(--ink);color:#fff;box-shadow:var(--sh-sm)}
/* 로그인 */
.login{padding:28px 20px 40px;max-width:430px;margin:0 auto}
.login .logo{width:66px;height:66px;border-radius:20px;margin:18px auto 10px;display:grid;place-items:center;font-family:"Jua",sans-serif;font-size:30px;color:#fff;background:linear-gradient(150deg,#FF9F43,#FFC93C);box-shadow:0 6px 16px rgba(255,159,67,.36)}
.login h1{text-align:center;margin:0;font-size:22px}
.login .msg{font-size:13px;line-height:1.65;color:var(--ink-2)}
input.code{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px;font-size:17px;font-weight:700;letter-spacing:2px;text-align:center;font-family:"IBM Plex Sans KR",monospace;text-transform:uppercase;background:#fff}
.errt{font-size:13px;color:var(--warn);line-height:1.6;margin:8px 0}
/* 히어로 */
.hero{position:relative;overflow:hidden;text-align:center}
.hero::before{content:"";position:absolute;top:-44px;right:-34px;width:118px;height:118px;border-radius:50%;background:var(--point-soft)}
.hero > *{position:relative;z-index:1}
.av{width:78px;height:78px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:34px;background:linear-gradient(150deg,#FFE9A8,#FFD166);box-shadow:0 4px 14px rgba(255,180,60,.3);overflow:hidden;font-family:"Jua",sans-serif;color:#7A5A10}
.hero h1{margin:10px 0 0;font-size:22px}
.beads{display:flex;justify-content:center;gap:5px;margin-top:9px;flex-wrap:wrap}
.beads i{width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.beads i.now{transform:scale(1.35);box-shadow:0 0 0 3px var(--point-soft)}
.hero .lb{font-size:12px;color:var(--ink-2);margin-top:10px}
.hero .lb b{color:var(--ink)}
/* 수련 현황 박스 */
.pbox{border:1.5px solid var(--point)}
.pbox .big{font-family:"Jua",sans-serif;font-size:28px;line-height:1}
.prow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:13px}
.prow b.m{width:34px;font-family:"Jua",sans-serif;font-size:14px}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.tag.ok{background:#E4F6EA;color:#19692F}.tag.go{background:#E7F0FF;color:#1F4FA8}.tag.no{background:#FFE7E4;color:#A42C23}.tag.gray{background:#F0EDF5;color:#6B6180}
.bar{height:10px;background:#F4EEF7;border-radius:99px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--point),#FFC93C)}
.note{background:#F4FAF5;border-radius:var(--r-sm);padding:9px 12px;font-size:12px;color:var(--ink-2);margin-top:8px;line-height:1.6}
.note b{color:var(--ink)}
/* D-day */
.ring{display:flex;align-items:center;gap:14px}
.ring svg{flex:0 0 auto}
.ring h3{margin:0;font-size:17px}
.ring p{margin:3px 0 0;font-size:11.5px;color:var(--ink-2)}
.pill{display:inline-block;margin-top:7px;background:var(--point-soft);color:#8A6416;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:600}
/* 오늘 2칸 */
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}
.st > div{background:#fff;border-radius:var(--r-md);padding:13px;box-shadow:var(--sh-sm);text-align:center}
.st .em{font-size:22px;line-height:1.2}
.st b{display:block;font-family:"Jua",sans-serif;font-size:14px;margin-top:3px}
.st small{font-size:10.5px;color:var(--ink-2)}
/* 목록 */
.listbox{background:#fff;border-radius:var(--r-md);padding:4px 15px;box-shadow:var(--sh-sm);margin-bottom:13px}
.item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .ic{width:30px;height:30px;border-radius:50%;background:#EAF3FF;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.item b{display:block;font-size:13px;font-weight:600}
.item p{margin:2px 0 0;font-size:11.5px;color:var(--ink-2)}
.item .dt{font-size:10px;color:var(--ink-3);margin-top:3px}
.paybar{display:flex;align-items:center;gap:11px;background:#FFF0E2;border-radius:var(--r-md);padding:13px 14px;box-shadow:var(--sh-sm);margin-bottom:13px;color:#8A4F12}
.paybar .ic{width:30px;height:30px;border-radius:50%;background:var(--point);color:#fff;display:grid;place-items:center;font-size:14px;flex:0 0 auto}
.paybar b{display:block;font-size:13px}
.paybar small{font-size:10.5px;opacity:.9}
/* 성장 */
.road{display:flex;align-items:flex-end;gap:5px;justify-content:space-between}
.road > div{text-align:center;flex:1;min-width:0}
.road i{display:block;border-radius:8px 8px 4px 4px;margin:0 auto 5px;width:72%;border:1.5px solid rgba(0,0,0,.1)}
.road small{font-size:9.5px;color:var(--ink-2);line-height:1.25;display:block}
.road .me small{color:var(--ink);font-weight:600}
.certwrap{perspective:1200px;margin-bottom:13px}
.cert{position:relative;width:100%;min-height:270px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.cert.flip{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.cert{transition:none}}
.cface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh)}
.cf{background:linear-gradient(150deg,#FFE9A8,#FFD166);color:#5A4209;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cf .em{font-size:40px}
.cf b{display:block;font-family:"Jua",sans-serif;font-size:21px;margin-top:6px}
.cf small{font-size:11.5px;display:block;margin-top:2px}
.cf .no{font-size:10.5px;opacity:.75;margin-top:9px}
.cf .hint{font-size:10.5px;opacity:.7;margin-top:12px}
.cb{background:#fff;transform:rotateY(180deg);overflow:auto}
.cb h4{margin:0 0 2px;font-size:16px}
.bars{display:grid;gap:8px;margin-top:11px}
.bars .r{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);margin-bottom:3px}
.bars .t{height:8px;border-radius:99px;background:#F4EEF7;overflow:hidden}
.bars .t i{display:block;height:100%;border-radius:99px}
.mbox{display:flex;gap:6px;flex-wrap:wrap}
.mbox > div{flex:1;min-width:58px;background:#F7F4FA;border-radius:12px;padding:8px 4px;text-align:center}
.mbox b{display:block;font-family:"Jua",sans-serif;font-size:16px}
.mbox small{font-size:10px;color:var(--ink-2)}
.quote{background:#F4FAF5;border-radius:var(--r-md);padding:13px 15px;font-size:12.5px;color:var(--ink-2);box-shadow:var(--sh-sm);margin-bottom:13px}
.quote b{color:var(--ink)}
.qa{padding:8px 0;border-top:1px dashed var(--line);font-size:12.5px}
.qa:first-child{border-top:0}
.qa .q{color:#0F766E;font-weight:600;font-size:11.5px}
.qa .a{color:var(--ink);margin-top:2px;white-space:pre-wrap}
/* 소식 */
.ev{display:flex;gap:12px}
.evd{width:54px;flex:0 0 auto;text-align:center;border-radius:16px;background:var(--point-soft);color:#8A6416;padding:8px 0}
.evd small{display:block;font-size:10.5px;font-weight:600}
.evd b{display:block;font-family:"Jua",sans-serif;font-size:20px;line-height:1.1}
.ev h4{margin:0;font-size:15px}
.ev p{margin:3px 0 0;font-size:11.5px;color:var(--ink-2)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead b{font-family:"Jua",sans-serif;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .wd{font-size:10px;color:var(--ink-3);padding-bottom:3px;font-weight:600}
.cal .d{aspect-ratio:1;border-radius:11px;display:grid;place-items:center;font-size:12px;color:var(--ink-2)}
.cal .d.att{background:#E4F6EA;color:#19692F;font-weight:600}
.cal .d.mk{background:#E7F0FF;color:#1F4FA8;font-weight:600}
.cal .d.ab{background:#FFE7E4;color:#A42C23;font-weight:600}
.cal .d.today{outline:2px solid var(--point);outline-offset:-2px;color:var(--point);font-weight:700}
.cal .d.off{background:repeating-linear-gradient(135deg,#F3EEF4 0 4px,#FAF7FB 4px 8px);color:var(--ink-3);grid-template-rows:auto auto;align-content:center;row-gap:0;line-height:1.05}
.cal .d.off em{font-style:normal;font-size:8px;font-weight:700;color:#B59AA6;letter-spacing:.02em}
.cal .d.off.today{color:var(--point)}
.callg{display:flex;gap:12px;margin-top:11px;font-size:10.5px;color:var(--ink-3);flex-wrap:wrap}
.callg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* 내정보 */
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink-2);flex:0 0 auto}
.kv b{font-weight:600;text-align:right}
.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 9px;border-radius:99px;margin-left:5px}
.bg-ok{background:#E4F6EA;color:#19692F}.bg-no{background:#FFE7E4;color:#A42C23}.bg-wait{background:#F0EDF5;color:#6B6180}
.sw{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.sw:last-child{border-bottom:0}
.sw b{display:block;font-size:13.5px;font-weight:600}
.sw small{font-size:10.5px;color:var(--ink-3)}
.tog{margin-left:auto;width:46px;height:27px;border-radius:99px;background:#E8E2EE;position:relative;transition:background .18s;flex:0 0 auto}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.tog[aria-pressed="true"]{background:var(--ok)}
.tog[aria-pressed="true"]::after{transform:translateX(19px)}
.guard{font-size:11.5px;color:var(--ink-2);background:#fff;border-radius:var(--r-md);padding:13px 15px;box-shadow:var(--sh-sm);line-height:1.65}
.guard b{color:var(--ink)}
.ver{text-align:center;font-size:10.5px;color:var(--ink-3);margin-top:14px}
.linkbtn{background:none;border:none;color:var(--ink-3);font-size:11.5px;text-decoration:underline}
/* 설치 안내 */
.inst{background:#FFFBEF;border:1.5px solid #F0D9A8;border-radius:var(--r-md);padding:12px 14px;margin-bottom:13px;font-size:12.5px;line-height:1.65}
.inst b{display:block;font-size:13.5px;margin-bottom:3px}
/* 탭바 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:430px;margin:0 auto;padding:0 14px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav .inner{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:22px;box-shadow:0 8px 22px rgba(120,90,60,.2);padding:7px 0 8px;pointer-events:auto}
nav button{text-align:center;font-size:9.5px;color:var(--ink-3);font-weight:600;padding:0}
nav button .gi{display:block;font-size:18px;line-height:1.25}
nav button[aria-current="true"]{color:var(--point)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#3C3350;color:#fff;font-size:12.5px;padding:10px 16px;border-radius:99px;box-shadow:0 8px 20px rgba(60,51,80,.3);z-index:60;max-width:330px;text-align:center}
.toast[hidden]{display:none}
.confirmbox{background:#FFF0E2;border-radius:var(--r-md);padding:12px 14px;margin:10px 0;font-size:13px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.confirmbox button{border-radius:12px;padding:7px 12px;font-weight:700;background:#fff;box-shadow:var(--sh-sm)}
.confirmbox button.yes{background:var(--warn);color:#fff}
</style>
</head>

    (ST.ask==='logout'?'<div class="confirmbox">로그아웃할까요? 다시 보려면 도장에서 받은 링크가 필요합니다.<span style="flex:1"></span><button onclick="cancelAsk()">취소</button><button class="yes" onclick="doLogout()">로그아웃</button></div>':'')+
    '<div class="ver">학부모앱 '+APP_VER+' · 나라차태권도'+(ST.fam&&ST.fam.pubD?' · '+esc(dot(ST.fam.pubD))+' 발행':'')+(function(){ try{ var ago=ST.fam&&ST.fam.pubT?Math.floor((Date.now()-ST.fam.pubT)/86400000):null; return ago!=null?(ago<=0?' · 오늘 갱신':' · '+ago+'일 전 갱신'):''; }catch(e){ return ''; } })()+'<br><button class="linkbtn" onclick="askLogout()">로그아웃</button></div>';
}

function vHome(){
  var tabs=[['home','🏠','홈'],['grow','🌱','성장'],['news','📣','소식'],['me','👤','내정보']];
  var body = ST.tab==='grow'?growTab() : ST.tab==='news'?newsTab() : ST.tab==='me'?meTab() : homeTab();
  var stale=''; try{ var ago=ST.fam&&ST.fam.pubT?Math.floor((Date.now()-ST.fam.pubT)/86400000):null; if(ago!=null&&ago>=3) stale='<div class="inst" style="background:#FFF7E8;border-color:#F0C36D">⏳ 최근 기록이 아직 반영되지 않았을 수 있어요 ('+ago+'일 전 갱신). 도장에 문의해 주세요 ☎</div>'; }catch(e){}
  return header()+'<div id="app"><main class="on">'+stale+body+'</main>'+
    '<nav><div class="inner">'+tabs.map(function(t){ return '<button aria-current="'+(ST.tab===t[0]?'true':'false')+'" onclick="goTab(\''+t[0]+'\')"><span class="gi">'+t[1]+'</span>'+t[2]+'</button>'; }).join('')+'</div></nav></div>';
}
function render(){
  var el=document.getElementById('root'); if(!el) return;
  el.innerHTML = ST.view==='home'?vHome() : ST.view==='verify'?vVerify() : ST.view==='loading'?vLoading() : vLogin();
}

(function boot(){ var link=__linkCode, sv=saved();
  if(link){ tryLogin(link, !(sv&&sv.ok&&sv.code===link)); return; }
  if(sv&&sv.ok&&sv.code){ tryLogin(sv.code, false); return; }
  ST.view='login'; render(); })();

(function(){ try{ var k='naracha_parent_verchk'; if(localStorage.getItem(k)===new Date().toDateString()) return;
  fetch(location.pathname+'?chk='+Date.now(),{cache:'no-store'}).then(function(r){ return r.text(); }).then(function(t){ localStorage.setItem(k,new Date().toDateString()); var m=t.match(/APP_VER\s*=\s*"([^"]+)"/); if(m && m[1]!==APP_VER){ setTimeout(function(){ location.reload(); }, 1500); } }).catch(function(){}); }catch(e){} })();
