<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'"><noscript><link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
/* ══ 나라차태권도 학부모앱 p2.0 — 디자인 B안 "친근 성장형" (토큰은 :root만 고치면 전체가 바뀜) ══ */
:root{
  --bg-1:#FFF6E8; --bg-2:#FDF3F6; --bg-3:#F1F7FF; --card:#FFFFFF;
  --ink:#3C3350; --ink-2:#7A6E86; --ink-3:#8A7E99;
  --point:#FF9F43; --point-soft:#FFF1C9;
  --ok:#2E9E4F; --warn:#C8342A; --kakao:#FAE100; --info:#2B5FB8;
  --b9:#F2F4F8; --b8:#F7D308; --b7:#F08A24; --b6:#2E9E4F; --b5:#2B5FB8; --b4:#7A4CA8; --b3:#6B4226; --b2:#C8342A; --b1:#C8342A; --bp:#111111;
  --r-lg:24px; --r-md:20px; --r-sm:14px;
  --sh:0 6px 20px rgba(150,110,70,.13); --sh-sm:0 4px 14px rgba(150,110,70,.10);
  --line:#F0E6DA;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:linear-gradient(180deg,var(--bg-1) 0%,var(--bg-2) 42%,var(--bg-3) 100%);background-attachment:fixed;color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:16px;line-height:1.6;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;min-height:100svh}
h1,h2,h3,h4,.jua{font-family:"Jua",sans-serif;font-weight:400;letter-spacing:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
img{max-width:100%}
#app{max-width:430px;margin:0 auto;position:relative;min-height:100svh;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:30;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(180deg,rgba(255,246,232,.97),rgba(255,246,232,.82));-webkit-backdrop-filter:saturate(1.3) blur(8px);backdrop-filter:saturate(1.3) blur(8px)}
.hbar{display:flex;align-items:center;gap:9px;padding:13px 16px 9px}
.hbar b{font-family:"Jua",sans-serif;font-size:19px}
.hbar .sub{font-size:13px;color:var(--ink-2)}
.beta{display:inline-block;vertical-align:2px;margin-left:4px;font-family:"IBM Plex Sans KR",sans-serif;font-size:10.5px;font-weight:700;letter-spacing:.04em;color:#8A4F12;background:#FFF0E2;border:1px solid #F5C9A3;border-radius:99px;padding:1px 7px}
.betabox{background:#FFF8EC;border:1.5px solid #F2D7AE;border-radius:var(--r-md);padding:12px 14px;margin-bottom:13px;font-size:14.5px;line-height:1.6;color:#6B4A12}
.betabox b{color:#3C3350}
.hbtn{margin-left:auto;height:32px;border-radius:99px;background:#fff;box-shadow:var(--sh-sm);display:inline-flex;align-items:center;gap:5px;padding:0 12px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.kidsrow{padding:0 16px 8px;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 28px),transparent 100%)}
.kidsin{display:flex;gap:6px;overflow-x:auto;min-width:0;scrollbar-width:none;padding-right:28px}
.hbtn-sm{height:34px;min-width:34px;padding:0 10px;margin-left:6px;font-size:15px;vertical-align:2px;justify-content:center}
.kidsin::-webkit-scrollbar{display:none}
.kidsin button{flex:0 0 auto;white-space:nowrap;border-radius:99px;padding:5px 12px;font-size:13.5px;font-weight:700;background:#fff;box-shadow:var(--sh-sm);color:var(--ink-2)}
.kidsin button.on{background:var(--point);color:#fff}
main{padding:4px 16px calc(108px + env(safe-area-inset-bottom,0px));display:none}
main.on{display:block}
.card{background:var(--card);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh);margin-bottom:13px}
.card.sm{border-radius:var(--r-md);padding:14px;box-shadow:var(--sh-sm)}
.sec{display:flex;align-items:baseline;gap:7px;margin:18px 4px 9px}
.sec h2{margin:0;font-size:19px}
.sec span{font-size:13px;color:var(--ink-3)}
.tiny{font-size:13.5px;color:var(--ink-2)}
.cta{display:block;width:100%;background:var(--point);color:#fff;border-radius:18px;padding:14px;font-family:"Jua",sans-serif;font-size:17.5px;box-shadow:0 6px 16px rgba(255,159,67,.36)}
.cta.ghost{background:#fff;color:var(--point);box-shadow:var(--sh-sm)}
.cta.kakao{background:var(--kakao);color:#3C1E1E;box-shadow:0 5px 14px rgba(180,150,0,.26)}
.cta.navy{background:var(--ink);color:#fff;box-shadow:var(--sh-sm)}
/* 로그인 */
.login{padding:28px 20px 40px;max-width:430px;margin:0 auto}
.login .logo{width:66px;height:66px;border-radius:20px;margin:18px auto 10px;display:grid;place-items:center;font-family:"Jua",sans-serif;font-size:30px;color:#fff;background:linear-gradient(150deg,#FF9F43,#FFC93C);box-shadow:0 6px 16px rgba(255,159,67,.36);overflow:hidden}
.login .logo img{width:100%;height:100%;object-fit:cover;border-radius:20px}
.login h1{text-align:center;margin:0;font-size:22px}
.login .msg{font-size:15.5px;line-height:1.65;color:var(--ink-2)}
input.code{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px;font-size:17px;font-weight:700;letter-spacing:2px;text-align:center;font-family:"IBM Plex Sans KR",monospace;text-transform:uppercase;background:#fff}
.errt{font-size:15px;color:var(--warn);line-height:1.6;margin:8px 0}
/* 히어로 */
.hero{position:relative;overflow:hidden;text-align:center}
.hero::before{content:"";position:absolute;top:-44px;right:-34px;width:118px;height:118px;border-radius:50%;background:var(--point-soft)}
.hero > *{position:relative;z-index:1}
.av{width:78px;height:78px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:34px;background:linear-gradient(150deg,#FFE9A8,#FFD166);box-shadow:0 4px 14px rgba(255,180,60,.3);overflow:hidden;font-family:"Jua",sans-serif;color:#7A5A10}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.bpatch{display:inline-block;width:30px;height:13px;border-radius:5px;vertical-align:-1px;margin-left:8px;border:1px solid rgba(0,0,0,.2);box-shadow:inset 0 -2px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.12)}
.avwrap{position:relative;width:78px;margin:0 auto}
.demobimg{position:absolute;right:-10px;bottom:-6px;width:36px;height:auto;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35));pointer-events:none}
.demobimg.inline{position:static;width:22px;vertical-align:-5px;margin-right:5px}
.hero h1{margin:10px 0 0;font-size:27px}
.beads{display:flex;justify-content:center;gap:5px;margin-top:9px;flex-wrap:wrap}
.beads i{width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.beads i.now{transform:scale(1.35);box-shadow:0 0 0 3px var(--point-soft)}
.hero .lb{font-size:15px;color:var(--ink-2);margin-top:10px}
.hero .lb b{color:var(--ink)}
/* 수련 현황 박스 */
.pbox{border:1.5px solid var(--point)}
.pbox .big{font-family:"Jua",sans-serif;font-size:32px;line-height:1}
.prow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px dashed var(--line);font-size:15.5px}
.prow b.m{width:40px;font-family:"Jua",sans-serif;font-size:16.5px}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.tag.ok{background:#E4F6EA;color:#19692F}.tag.go{background:#E7F0FF;color:#1F4FA8}.tag.no{background:#FFE7E4;color:#A42C23}.tag.gray{background:#F0EDF5;color:#6B6180}
.bar{height:10px;background:#F4EEF7;border-radius:99px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--point),#FFC93C)}
.note{background:#F4FAF5;border-radius:var(--r-sm);padding:10px 13px;font-size:14.5px;color:var(--ink-2);margin-top:8px;line-height:1.6}
.note b{color:var(--ink)}
/* D-day */
.ring{display:flex;align-items:center;gap:14px}
.ring svg{flex:0 0 auto}
.ring h3{margin:0;font-size:19.5px}
.ring p{margin:3px 0 0;font-size:14px;color:var(--ink-2)}
.pill{display:inline-block;margin-top:7px;background:var(--point-soft);color:#8A6416;border-radius:99px;padding:3px 11px;font-size:13px;font-weight:600}
/* 오늘 2칸 */
.st{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}
.st > div{background:#fff;border-radius:var(--r-md);padding:13px;box-shadow:var(--sh-sm);text-align:center}
.st .em{font-size:26px;line-height:1.2}
.st b{display:block;font-family:"Jua",sans-serif;font-size:17px;margin-top:3px}
.st small{font-size:13px;color:var(--ink-2)}
/* 목록 */
.listbox{background:#fff;border-radius:var(--r-md);padding:4px 15px;box-shadow:var(--sh-sm);margin-bottom:13px}
.item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .ic{width:30px;height:30px;border-radius:50%;background:#EAF3FF;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.item b{display:block;font-size:15.5px;font-weight:600}
.item p{margin:2px 0 0;font-size:14px;color:var(--ink-2)}
.item .dt{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.paybar{display:flex;align-items:center;gap:11px;background:#FFF0E2;border-radius:var(--r-md);padding:13px 14px;box-shadow:var(--sh-sm);margin-bottom:13px;color:#8A4F12}
.paybar .ic{width:30px;height:30px;border-radius:50%;background:var(--point);color:#fff;display:grid;place-items:center;font-size:14px;flex:0 0 auto}
.paybar b{display:block;font-size:15.5px}
.paybar small{font-size:13px;opacity:.9}
/* 성장 */
.road{display:flex;align-items:flex-end;gap:5px;justify-content:space-between}
.road > div{text-align:center;flex:1;min-width:0}
.road i{display:block;border-radius:8px 8px 4px 4px;margin:0 auto 5px;width:72%;border:1.5px solid rgba(0,0,0,.1)}
.road small{font-size:12px;color:var(--ink-2);line-height:1.3;display:block}
.road small b{display:block;font-size:11.5px;color:var(--ok);margin-top:2px;font-weight:700}
.road .me small{color:var(--ink);font-weight:600}
.certwrap{perspective:1200px;margin-bottom:13px}
.cert{position:relative;width:100%;min-height:270px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.7,.3,1)}
.cert.flip{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.cert{transition:none}}
.cface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh)}
.cf{background:linear-gradient(150deg,#FFE9A8,#FFD166);color:#5A4209;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cf .em{font-size:44px}
.cf b{display:block;font-family:"Jua",sans-serif;font-size:24px;margin-top:6px}
.cf small{font-size:14px;display:block;margin-top:2px}
.cf .no{font-size:13px;opacity:.75;margin-top:9px}
.cf .hint{font-size:13px;opacity:.7;margin-top:12px}
.cb{background:#fff;transform:rotateY(180deg);overflow:auto}
.cb h4{margin:0 0 2px;font-size:19px}
.bars{display:grid;gap:8px;margin-top:11px}
.bars .r{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2);margin-bottom:3px}
.bars .t{height:8px;border-radius:99px;background:#F4EEF7;overflow:hidden}
.bars .t i{display:block;height:100%;border-radius:99px}
.mbox{display:flex;gap:6px;flex-wrap:wrap}
.mbox > div{flex:1;min-width:58px;background:#F7F4FA;border-radius:12px;padding:8px 4px;text-align:center}
.mbox b{display:block;font-family:"Jua",sans-serif;font-size:19px}
.mbox small{font-size:12.5px;color:var(--ink-2)}
.quote{background:#F4FAF5;border-radius:var(--r-md);padding:14px 16px;font-size:15px;color:var(--ink-2);box-shadow:var(--sh-sm);margin-bottom:13px}
.quote b{color:var(--ink)}
.qa{padding:9px 0;border-top:1px dashed var(--line);font-size:15px}
.qa:first-child{border-top:0}
.qa .q{color:#0F766E;font-weight:600;font-size:14px}
.qa .a{color:var(--ink);margin-top:2px;white-space:pre-wrap}
/* 소식 */
.ev{display:flex;gap:12px}
.evd{width:54px;flex:0 0 auto;text-align:center;border-radius:16px;background:var(--point-soft);color:#8A6416;padding:8px 0}
.evd small{display:block;font-size:12.5px;font-weight:600}
.evd b{display:block;font-family:"Jua",sans-serif;font-size:23px;line-height:1.1}
.ev h4{margin:0;font-size:18px}
.ev p{margin:3px 0 0;font-size:14.5px;color:var(--ink-2)}
.evl{padding:10px 14px}.evl .evr{display:flex;gap:8px;align-items:baseline;padding:5px 0;font-size:14px;line-height:1.4;border-top:1px dashed var(--line)}.evl .evr:first-child{border-top:0}.evl .evr b{flex:0 0 auto;font-weight:700;color:#8A6416;min-width:62px}.evl .evr span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead b{font-family:"Jua",sans-serif;font-size:19px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal .wd{font-size:12.5px;color:var(--ink-3);padding-bottom:3px;font-weight:600}
.cal .d{aspect-ratio:1;border-radius:11px;display:grid;place-items:center;font-size:14.5px;color:var(--ink-2)}
.cal .d.att{background:#E4F6EA;color:#19692F;font-weight:600}
.cal .d.mk{background:#E7F0FF;color:#1F4FA8;font-weight:600}
.cal .d.ab{background:#FFE7E4;color:#A42C23;font-weight:600}
.cal .d.today{outline:2px solid var(--point);outline-offset:-2px;color:var(--point);font-weight:700}
.cal .d.off{background:repeating-linear-gradient(135deg,#F3EEF4 0 4px,#FAF7FB 4px 8px);color:var(--ink-3);grid-template-rows:auto auto;align-content:center;row-gap:0;line-height:1.05}
.cal .d.off em{font-style:normal;font-size:9.5px;font-weight:700;color:#B59AA6;letter-spacing:.02em}
.cal .d.off.today{color:var(--point)}
.callg{display:flex;gap:12px;margin-top:11px;font-size:13px;color:var(--ink-3);flex-wrap:wrap}
/* 나라차 일정 캘린더 (소식지 수련계획표 달력 스타일) */
.scal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.scal .wd{font-size:12px;color:var(--ink-3);font-weight:700;text-align:center;padding:2px 0}
.scal .sd{min-height:48px;border-radius:9px;background:#FAFAFC;padding:3px 2px 2px;font-size:12.5px;color:var(--ink-2);text-align:center;overflow:hidden}
.scal .sd.off{background:repeating-linear-gradient(135deg,#FBECEA 0 4px,#FFF6F5 4px 8px)}
.scal .sd.today{outline:2px solid var(--point);outline-offset:-2px}
.scal .sd .dn{font-weight:700;line-height:1.2}
.scal .sd.sun .dn{color:#C8342A}.scal .sd.sat .dn{color:#2B5FB8}
.scal .pillv{display:block;margin:1px 1px 0;border-radius:6px;font-size:8.5px;font-weight:800;line-height:1.35;padding:1px 2px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scal .pillv.off2{background:#C8342A}.scal .pillv.exam{background:#1F2E5C}.scal .pillv.comp{background:#F08A24}.scal .pillv.ev{background:#2E9E4F}.scal .pillv.nl{background:#2B5FB8}
.dpop{position:fixed;inset:0;background:rgba(60,51,80,.45);z-index:70;display:flex;align-items:flex-end;justify-content:center}
.dpop .sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:430px;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(60,51,80,.25);max-height:calc(100dvh - 40px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.dpop h3{margin:0 0 10px;font-size:19px}
.dpop .row{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-top:1px dashed var(--line);font-size:15.5px;line-height:1.5}
.dpop .row:first-of-type{border-top:0}
.dpop .cdot{flex:0 0 auto;width:12px;height:12px;border-radius:4px;margin-top:5px}
.calnav{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.calnav b{font-family:"Jua",sans-serif;font-size:19px}
.calnav button{width:36px;height:36px;border-radius:10px;background:#F4F0FA;font-size:14px;font-weight:800;color:var(--ink-2)}
.callg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:-1px}
/* 내정보 */
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--ink-2);flex:0 0 auto}
.kv b{font-weight:600;text-align:right}
.badge{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:99px;margin-left:5px}
.bg-ok{background:#E4F6EA;color:#19692F}.bg-wait{background:#F0EDF5;color:#6B6180}
.bg-no{background:#FFF0ED;color:#B3362B;font-size:13px;font-weight:800;padding:3px 11px;border:1.5px solid #EFA79C;box-shadow:0 1.5px 4px rgba(179,54,43,.14);cursor:pointer}   /* p2.19·20: 미납 — 부드럽되 눌러보고 싶게(그림자+화살표, 누르면 납부 방법) */
/* p2.20: 누를 수 있는 것은 실제로 눌리는 느낌 — 공통 눌림 반응 */
.cta:active,.hbtn:active,.kidsin button:active,nav button:active,.badge.bg-no:active,.scal .sd[onclick]:active,.tog:active,.cert:active{transform:scale(.96);transition:transform .08s}
button:active{transform:scale(.96);transition:transform .08s}
.cta,.hbtn,.kidsin button,nav button,.badge.bg-no,.scal .sd,.tog{transition:transform .12s}
.sw{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
/* p2.62: 줄바꿈 — 한글은 어절(띄어쓰기) 단위로, 한 글자만 다음 줄로 넘어가는 '외톨이 글자' 방지 */
body{word-break:keep-all;overflow-wrap:break-word;line-break:strict}
p,li,small,.msg,.tiny,.note,.kv span,.kv b,td,h4{text-wrap:pretty}
h1,h2,h3,.cta,.tdMain b,.bday h3,.qual b,.vcard .vv{text-wrap:balance}
input,textarea,.code,.pillv{word-break:normal;overflow-wrap:anywhere}
/* p2.62: 상세 성장 리포트 — 꼭 눌러 보고 싶은 입체 버튼 */
.rptClose{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin:4px 0 17px;padding:15px;border-radius:18px;border:0;background:#3C3350;color:#fff;font-size:16.5px;font-weight:800;box-shadow:0 5px 0 #231C33,0 8px 16px rgba(60,51,80,.28)}
.rptClose span{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#fff;color:#3C3350;font-size:13px}
.rptClose:active{transform:translateY(4px);box-shadow:0 1px 0 #231C33,0 3px 8px rgba(60,51,80,.25)}
.rptBtn{position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;width:100%;margin:4px 0 17px;padding:14px 14px 14px 13px;border-radius:20px;text-align:left;color:#fff;
  background:linear-gradient(180deg,#FFB867 0%,#FF8E42 52%,#F2742A 100%);
  box-shadow:0 6px 0 #C9581C,0 13px 24px rgba(242,116,42,.38),inset 0 1.5px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(160,60,10,.12);transition:transform .1s,box-shadow .1s}
.rptBtn:active{transform:translateY(5px);box-shadow:0 1px 0 #C9581C,0 4px 10px rgba(242,116,42,.3),inset 0 1.5px 0 rgba(255,255,255,.5)}
.rptBtn .ico{flex:0 0 auto;width:48px;height:48px;border-radius:15px;background:#fff;display:grid;place-items:center;font-size:27px;box-shadow:0 3px 8px rgba(150,60,10,.28)}
.rptBtn .tx{min-width:0}
.rptBtn .tx b{display:block;font-family:"Jua",sans-serif;font-weight:400;font-size:19.5px;line-height:1.2;text-shadow:0 1px 2px rgba(140,45,0,.35)}
.rptBtn .tx small{display:block;font-size:12.5px;line-height:1.4;margin-top:3px;opacity:.96}
.rptBtn .go{flex:0 0 auto;margin-left:auto;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.28);border:1.5px solid rgba(255,255,255,.55);display:grid;place-items:center;font-size:15px;animation:rptNudge 1.6s ease-in-out infinite}
.rptBtn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.38) 48%,transparent 61%);background-size:260% 100%;animation:rptShine 3.4s ease-in-out infinite;pointer-events:none}
@keyframes rptShine{0%{background-position:160% 0}55%,100%{background-position:-70% 0}}
@keyframes rptNudge{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@media (prefers-reduced-motion:reduce){.rptBtn::after,.rptBtn .go{animation:none}}
body.adult .rptBtn{background:linear-gradient(180deg,#6F9BEA 0%,#3F72CF 52%,#2B5FB8 100%);box-shadow:0 6px 0 #1E4790,0 13px 24px rgba(43,95,184,.36),inset 0 1.5px 0 rgba(255,255,255,.55)}
body.adult .rptBtn:active{box-shadow:0 1px 0 #1E4790,0 4px 10px rgba(43,95,184,.3)}
/* p2.62: 미납 내역 별도 상자 — 월별 납부 목록과 섞이지 않게 */
.card.unpBox{margin-top:12px;background:#FFF8F2;border:1.5px solid #F6D2BF}
.unpH{display:flex;align-items:center;gap:8px}.unpH b{font-size:15px;color:#A2421F}.unpH span{margin-left:auto;font-size:13px;font-weight:700;color:#A2421F}
.unpS{font-size:12px;color:#9A6A50;margin:2px 0 2px;line-height:1.45}
.unpBox .kv:last-child{border-bottom:0}
/* p2.62: 미납 안내 — 민감한 내용이라 따뜻하고 잘 보이게 */
.payNote{display:flex;gap:11px;align-items:flex-start;margin-top:12px;padding:13px 14px;border-radius:16px;background:linear-gradient(135deg,#FFF7EC 0%,#FFEAD5 100%);border:1px solid #F5D2AC;box-shadow:inset 0 1px 0 rgba(255,255,255,.75)}
.payNote .pi{flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:19px;box-shadow:0 2px 7px rgba(214,140,70,.28)}
.payNote p{margin:0;font-size:14.5px;line-height:1.6;color:#6A4322}
.payNote p b{color:#B4532A}
.payNote small{display:block;margin-top:2px;font-size:13px;line-height:1.5;color:#946645}
.sw:last-child{border-bottom:0}
.sw b{display:block;font-size:13.5px;font-weight:600}
.sw small{font-size:10.5px;color:var(--ink-3)}
.tog{margin-left:auto;width:46px;height:27px;border-radius:99px;background:#E8E2EE;position:relative;transition:background .18s;flex:0 0 auto}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.tog[aria-pressed="true"]{background:var(--ok)}
.tog[aria-pressed="true"]::after{transform:translateX(19px)}
.guard{font-size:14px;color:var(--ink-2);background:#fff;border-radius:var(--r-md);padding:13px 15px;box-shadow:var(--sh-sm);line-height:1.65}
.guard b{color:var(--ink)}
.ver{text-align:center;font-size:12.5px;color:var(--ink-3);margin-top:14px}
.linkbtn{background:none;border:none;color:var(--ink-3);font-size:14px;text-decoration:underline;padding:8px 10px}
/* 성인 수련생 모드(나라차 수련생앱) — 차분한 남색 톤으로 차별화 */
body.adult{--bg-1:#EDF2FA;--bg-2:#F2F0FA;--bg-3:#FFF4E8;--point:#2B5FB8;--point-soft:#E2EDFF}
body.adult header{background:linear-gradient(180deg,rgba(237,242,250,.97),rgba(237,242,250,.82))}
body.adult .beta{color:#1F4FA8;background:#E7F0FF;border-color:#BFD4F2}
body.adult .cta{box-shadow:0 6px 16px rgba(43,95,184,.3)}
body.adult .av{background:linear-gradient(150deg,#CFE0F8,#9FC3F5);color:#1F3A73}
/* 설치 안내 */
.inst{background:#FFFBEF;border:1.5px solid #F0D9A8;border-radius:var(--r-md);padding:12px 14px;margin-bottom:13px;font-size:15px;line-height:1.65}
.inst b{display:block;font-size:16px;margin-bottom:3px}
/* 탭바 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:430px;margin:0 auto;padding:0 14px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav .inner{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#fff;border:1.5px solid #F0E2D2;border-radius:22px;box-shadow:0 10px 26px rgba(120,90,60,.3);padding:6px 7px 7px;pointer-events:auto}
nav button{text-align:center;font-size:13px;color:#6F6482;font-weight:800;padding:5px 0 6px;border-radius:16px}
nav button .gi{display:block;font-size:22px;line-height:1.25}
nav button[aria-current="true"]{background:var(--point);color:#fff;box-shadow:0 3px 10px rgba(255,159,67,.4)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#3C3350;color:#fff;font-size:15px;padding:10px 16px;border-radius:99px;box-shadow:0 8px 20px rgba(60,51,80,.3);z-index:60;max-width:330px;text-align:center}
.toast[hidden]{display:none}
.confirmbox{background:#FFF0E2;border-radius:var(--r-md);padding:12px 14px;margin:10px 0;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.confirmbox button{border-radius:12px;padding:7px 12px;font-weight:700;background:#fff;box-shadow:var(--sh-sm)}
.confirmbox button.yes{background:var(--warn);color:#fff}

/* p2.60 응시 자격·국기원 승품 안내 */
.qual{margin-top:10px;background:#FFFBF2;border:1px solid #F3E2C2;border-radius:12px;padding:9px 11px;font-size:13.5px;line-height:1.6;color:var(--ink)}
.qual > b{font-size:13.5px}.qual > span{font-size:12px;color:var(--ink-3);margin-left:4px}.qual small{display:block;font-size:12px;color:var(--ink-2);margin-top:4px;line-height:1.5}
body.adult .qual{background:#F4F7FD;border-color:#D8E2F3}
.kkw{border:1.5px solid #E7D7F2;background:linear-gradient(180deg,#FBF8FF,#FFFFFF)}
.kkw .kkwTop{display:flex;align-items:center;gap:8px;margin-bottom:6px}.kkw .kkwTop b{font-family:"Jua",sans-serif;font-weight:400;font-size:22px}
.kkw .kkwBadge{font-size:12px;font-weight:800;color:#fff;background:#14161A;border-radius:999px;padding:3px 10px}
.kkw .kkwRow{display:flex;gap:10px;padding:9px 0;border-top:1px dashed #EADFF3;font-size:14px;line-height:1.55}
.kkw .kkwRow > span{flex:0 0 84px;font-size:12.5px;font-weight:800;color:#7C3AED;padding-top:1px}
.kkw .kkwRow small{font-size:12px;color:var(--ink-3)}.kkw .kkwRow b.on{color:#C8342A}

/* p2.59 이달의 인성덕목 카드(2년 계획) */
.vcard{position:relative;overflow:hidden;border:1.5px solid #F0DCC4;background:linear-gradient(180deg,#FFFBF4,#FFFFFF)}
.vcard.hi{border-color:#CFDDF5;background:linear-gradient(180deg,#F5F8FF,#FFFFFF)}
.vcard .vtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vcard .vbadge{font-size:12px;font-weight:800;color:#fff;background:#C0622F;border-radius:999px;padding:3px 10px}.vcard.hi .vbadge{background:#2B5FB8}
.vcard .vmo{font-size:13px;font-weight:700;color:var(--ink-2)}
.vcard .vname{font-family:"Jua",sans-serif;font-size:30px;line-height:1.2;margin-top:8px;color:var(--ink)}
.vcard .vid{font-family:"Jua",sans-serif;font-size:18px;color:#C0622F;margin-top:2px}.vcard.hi .vid{color:#2B5FB8}.vcard .vid small{font-family:inherit;font-size:13px;color:var(--ink-3)}
.vcard .vmt{font-size:11px;font-weight:700;color:#7C3AED;background:#EDE9FE;border-radius:999px;padding:2px 8px;vertical-align:3px}
.vcard .vmean{font-size:14.5px;color:var(--ink-2);line-height:1.6;margin-top:8px;word-break:keep-all}
.vcard .vact{margin-top:12px;background:#fff;border:1px dashed #E8D7C2;border-radius:14px;padding:10px 12px}.vcard.hi .vact{border-color:#C9D7EF}
.vcard .vact b{display:block;font-size:13.5px;margin-bottom:6px}
.vcard .vact div{display:flex;gap:7px;font-size:14.5px;line-height:1.5;margin-top:4px;word-break:keep-all}.vcard .vact div span{color:#C0622F;font-weight:800}.vcard.hi .vact div span{color:#2B5FB8}

/* p2.58 오늘 카드 — 달력 타일(오늘 날짜)·수련일 안내 강조·도보/차량은 작은 칩 */
.tday{display:flex;align-items:center;gap:14px;padding:14px 15px}
.tdCal{flex:none;width:66px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 0 0 1.5px #F0E3D2,0 4px 10px rgba(60,51,80,.08);text-align:center;display:flex;flex-direction:column}
.tdCal .mo{display:block;background:linear-gradient(180deg,#FF6B5B,#E8453A);color:#fff;font-size:12.5px;font-weight:800;padding:3px 0 2px;letter-spacing:.02em}
.tdCal .dn{display:block;font-family:"Jua",sans-serif;font-size:30px;line-height:1.05;color:var(--ink);padding-top:4px}
.tdCal .wd{display:block;font-size:11.5px;font-weight:700;color:var(--ink-2);padding:0 0 5px}
.tdCal .wd.sun{color:#E8453A}.tdCal .wd.sat{color:#2B5FB8}
.tdMain{flex:1;min-width:0}
.tdMain .tdLab{font-size:12px;font-weight:800;color:var(--ink-3);letter-spacing:.04em}
.tdMain b{display:block;font-family:"Jua",sans-serif;font-weight:400;font-size:20px;line-height:1.25;margin-top:1px;word-break:keep-all}
.tdMain small{display:block;font-size:13.5px;color:var(--ink-2);margin-top:3px;line-height:1.45;word-break:keep-all}
.tdMain .tdBus{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:var(--ink-2);background:#F6F2EC;border-radius:999px;padding:3px 10px}
.tdEm{flex:none;font-size:30px;line-height:1}
.tday.ok{box-shadow:0 0 0 1.5px #BFE6C9,var(--sh)} .tday.ok .tdMain b{color:var(--ok)}
.tday.go{box-shadow:0 0 0 1.5px #FFD9A6,var(--sh)} .tday.go .tdMain b{color:#D9780F}
.tday.abs .tdMain b{color:var(--warn)}
body.adult .tdCal .mo{background:linear-gradient(180deg,#4F7BD9,#2B5FB8)}

/* ══ p2.57 생일 축하 배너 (관장님 지시) ══ */
.bday{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:18px 16px 16px;margin-bottom:13px;color:#fff;cursor:pointer;
  background:radial-gradient(160px 120px at 92% 8%,rgba(255,255,255,.35),transparent 70%),linear-gradient(135deg,#FF6FA8 0%,#FF9F43 58%,#FFCF4A 100%);
  box-shadow:0 12px 26px -12px rgba(255,111,168,.7);display:flex;gap:12px;align-items:center;-webkit-tap-highlight-color:transparent}
.bday > *{position:relative;z-index:1}
.bday .bdCake{font-size:48px;line-height:1;flex:none;animation:bdBob 2.4s ease-in-out infinite;filter:drop-shadow(0 5px 6px rgba(120,40,40,.22))}
.bday .bdTxt{flex:1;min-width:0}
.bday .bdKick{font-family:"Jua",sans-serif;font-size:12px;letter-spacing:.2em;opacity:.92}
.bday h3{font-family:"Jua",sans-serif;font-weight:400;font-size:21px;line-height:1.25;margin:3px 0 5px;text-shadow:0 1px 2px rgba(120,40,40,.18);word-break:keep-all}
.bday p{font-size:13.5px;line-height:1.55;margin:0;opacity:.96;word-break:keep-all}
.bday .bdTap{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:3px 10px}
.bday .bdBall{position:absolute;right:10px;top:8px;font-size:22px;z-index:0;opacity:.85;animation:bdFloat 3.4s ease-in-out infinite}
.bday .bdConf{position:absolute;inset:0;z-index:0;pointer-events:none}
.bday .bdConf i{position:absolute;top:-14px;width:7px;height:12px;border-radius:2px;opacity:.85;animation:bdFall linear infinite}
body.adult .bday{background:radial-gradient(160px 120px at 92% 8%,rgba(255,255,255,.28),transparent 70%),linear-gradient(135deg,#2B5FB8 0%,#7C5CFF 55%,#FF6FA8 100%);box-shadow:0 12px 26px -12px rgba(43,95,184,.6)}
@keyframes bdFall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(210px) rotate(560deg)}}
@keyframes bdBob{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-6px) rotate(5deg)}}
@keyframes bdFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.bdBurst{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.bdBurst i{position:absolute;left:50%;top:42%;width:9px;height:14px;border-radius:2px;animation:bdPop 1.5s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes bdPop{0%{transform:translate(-50%,-50%) rotate(0) scale(.6);opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){ .bday .bdCake,.bday .bdBall,.bday .bdConf i{animation:none} .bday .bdConf,.bdBurst{display:none} }
:root{color-scheme:light}
.badge.bg-no{min-height:36px}
/* p2.64: UI·접근성 검토 반영 */
:root{--ink-2:#615670;--ink-3:#6F6482}
.cta{background:#EE7B2C;text-shadow:0 1px 1px rgba(120,40,0,.25)}
body.adult .cta{background:#2B5FB8}
.rptBtn{background:linear-gradient(180deg,#F7954A 0%,#E7752C 52%,#D2621E 100%)}
.rptBtn .tx small{font-size:13.5px;text-shadow:0 1px 1px rgba(120,40,0,.3)}
.scal .pillv{font-size:10.5px;line-height:1.35}
.calList{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.calList .cl{display:flex;align-items:baseline;gap:8px;font-size:15px;line-height:1.5;padding:4px 0}
.calList .cl b{flex:0 0 auto;font-weight:700;color:var(--ink)}
.calList .cl span:last-child{color:var(--ink-2)}
.calList .cdot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;display:inline-block;transform:translateY(-1px)}
.sec{flex-wrap:wrap}
.sec h2{white-space:nowrap}
.kv span.tiny{flex:1 1 auto;min-width:0}
.unpBox .kv b{color:#A2421F;font-weight:800}
.unpBox .kv b,.unpBox .kv b span{color:#A2421F!important}
.unpBox .kv b>span:first-child{font-size:17px}
.unpS{font-size:13.5px}
.tdBus,.tdLab,.qual span{font-size:13.5px}
.qual span{white-space:nowrap}
.bday p{text-shadow:0 1px 2px rgba(120,40,40,.35)}
.kidsin button{padding:9px 16px;font-size:15px}
.calnav button{min-width:44px;min-height:44px}
nav button{position:relative}
nav .ndot{position:absolute;top:6px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:#E8453A;box-shadow:0 0 0 2px #fff}
body.adult .tday.go{box-shadow:0 0 0 1.5px #BFD4F2,var(--sh)}
body.adult .tday.go .tdMain b{color:#2B5FB8}
.hbar,.kidsrow{max-width:430px;margin-left:auto;margin-right:auto}
.guard ul.pv{margin:8px 0 8px;padding-left:18px}
.guard ul.pv li{margin:3px 0;line-height:1.55}
.guard ul.pv li b{margin-right:4px}
.preBox{margin:6px 0 4px;padding:12px 13px;border-radius:14px;background:#F4F7FD;border:1.5px dashed #C9D7EE;font-size:14px;line-height:1.6;color:var(--ink-2)}
.preBox b{color:var(--ink)}
.preBox button{margin-top:8px;font-size:13.5px;font-weight:700;color:#2B5FB8;background:#fff;border:1px solid #C9D7EE;border-radius:99px;padding:7px 13px;min-height:36px}

<body>
<div id="root"></div>
<div class="toast" id="toast" hidden></div>

function newsTab(){

  var posts=(ST.board||[]).filter(function(p){ return !_nlHidden(p); });
  var notices=posts.filter(function(p){ return p.kind!=='event'; });
  var evRows=(f.events||[]).map(function(e){ return {date:String(e.date||''), end:String(e.end||''), title:e.title||'(제목 미정)', time:e.time||'', place:e.place||'', body:''}; });
  posts.filter(function(p){ return p.kind==='event' && p.date && !_boardEvDup(p) && String((p.end&&p.end>p.date)?p.end:p.date)>=td; }).forEach(function(p){   /* 예전에 게시판에 올린 행사 — 캘린더에 없을 때만 */
    if(evRows.some(function(r){ return r.date===p.date && _evSame(r.title,p.title); })) return;
    evRows.push({date:String(p.date), end:String(p.end||''), title:p.title, time:'', place:'', body:String(p.body||'')}); });
  evRows.sort(function(a,b){ return a.date.localeCompare(b.date); });

        (dTag?' <small style="color:#C8342A;font-weight:800">'+dTag+'</small>':'')+(e.body?'<br><small style="white-space:pre-wrap;color:var(--ink-2)">'+esc(e.body)+'</small>':'')+'</span></div>'; }).join('')+'</div>' : '';
  var board=(noticeHtml||evHtml)? noticeHtml+evHtml

function _copyFb(t){ try{ var ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0;font-size:16px'; document.body.appendChild(ta); ta.focus(); ta.select(); try{ ta.setSelectionRange(0,t.length); }catch(e){} var r=document.execCommand('copy'); ta.remove(); return !!r; }catch(e){ return false; } }
function _copyText(t, ok, fail){ var go=function(){ if(_copyFb(t)) ok(); else fail(); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(ok).catch(go); } else go(); }
